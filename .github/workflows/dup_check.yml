name: 定时查重 & 锁表

on:
  schedule:
    # 每天 21:00-23:45 每15分钟跑一次（UTC 13:00-15:45）
    - cron: '0,15,30,45 13,14,15 * * *'
    # 0:00 最后一次跑，锁定表格（UTC 16:00）
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '目标日期 YYYY-MM-DD，留空按北京时间计算'
        required: false
      is_final:
        description: '是否为最终锁表运行'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: feishu-dup-check
  cancel-in-progress: false

jobs:
  dup-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install requests==2.32.3
      - name: 模拟数据测试
        run: python -m unittest discover -s tests -v
      - name: 执行查重
        env:
          FEISHU_APP_ID:        ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:    ${{ secrets.FEISHU_APP_SECRET }}
          WIKI_TOKEN:           ${{ secrets.WIKI_TOKEN }}
          WECOM_WEBHOOK:        ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY:       ${{ secrets.SERVERCHAN_KEY }}
          DRY_RUN:              ${{ vars.DUP_WRITE_ENABLED == 'true' && 'false' || 'true' }}
          ALLOW_LOCK:           'false' # Enable only after sandbox protection API verification
          TARGET_DATE:          ${{ inputs.target_date }}
          IS_FINAL:             ${{ github.event.schedule == '0 16 * * *' && 'true' || github.event.inputs.is_final || 'false' }}
        run: python dup_check.py

