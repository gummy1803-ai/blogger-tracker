<script>
// ══════════════════════════════════════════
// Supabase 客户端
// ══════════════════════════════════════════
const SB = {
  async query(table, params = {}) {
    const qs = new URLSearchParams();
    if (params.select)   qs.set("select",  params.select);
    if (params.order)    qs.set("order",   params.order);
    if (params.limit)    qs.set("limit",   params.limit);
    if (params.gte_date) qs.set("record_date", `gte.${params.gte_date}`);
    if (params.eq_date)  qs.set("record_date", `eq.${params.eq_date}`);
    const url = `${SUPABASE_URL}/rest/v1/${table}?${qs}`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` }
    });
    if (!res.ok) throw new Error(`Supabase ${res.status}: ${await res.text()}`);
    return res.json();
  }
};

// ══════════════════════════════════════════
// 工具函数
// ══════════════════════════════════════════
const fmtRate = (n,d) => d ? (n/d*100).toFixed(1)+"%" : "—";
const fmtF    = f => (f==null||isNaN(f)) ? "—" : Number(f).toFixed(1)+"万";
const esc     = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function localDateStr(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
const today   = localDateStr(new Date());
const weekStart = (() => {
  const d = new Date(); d.setDate(d.getDate()-d.getDay()+1); return localDateStr(d);
})();

// 时间范围筛选

function getPeriodLabel(period) {
  return {"all":"历史","today":"今日","week":"本周","last_week":"上周","month":"本月","last_month":"上月"}[period] || "今日";
}

function filterByPeriod(rows, period) {
  const now = new Date();
  const todayStr = localDateStr(now);
  const weekStartD = new Date(now); weekStartD.setDate(now.getDate()-now.getDay()+1);
  const weekStartStr = localDateStr(weekStartD);
  const monthStartStr = todayStr.slice(0,7) + "-01";
  if (period === "today") return rows.filter(r => r.record_date === todayStr);
  if (period === "yesterday") {
    const y = new Date(); y.setDate(y.getDate()-1);
    const yStr = localDateStr(y);
    return rows.filter(r => r.record_date === yStr);
  }
  if (period === "week")  return rows.filter(r => r.record_date >= weekStartStr && r.record_date <= todayStr);
  if (period === "month") return rows.filter(r => r.record_date >= monthStartStr && r.record_date <= todayStr);
  if (period === "last_week") {
    const lastWeekEnd = new Date(weekStartD); lastWeekEnd.setDate(lastWeekEnd.getDate()-1);
    const lastWeekStart = new Date(lastWeekEnd); lastWeekStart.setDate(lastWeekStart.getDate()-6);
    return rows.filter(r => r.record_date >= localDateStr(lastWeekStart) && r.record_date <= localDateStr(lastWeekEnd));
  }
  if (period === "last_month") {
    const lastMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const lastMonthStart = localDateStr(lastMonthDate);
    const lastMonthEnd = localDateStr(new Date(now.getFullYear(), now.getMonth(), 0));
    return rows.filter(r => r.record_date >= lastMonthStart && r.record_date <= lastMonthEnd);
  }
  return rows; // all
}

function periodBtns(current, onChange) {
  const periods = [["all","全部历史"],["today","今天"],["week","本周"],["month","本月"]];
  return `<div class="period-btns" style="margin-bottom:14px">${periods.map(([v,l])=>
    `<button class="pbtn${current===v?' active':''}" onclick="(${onChange})('${v}',this)">${l}</button>`
  ).join("")}</div>`;
}

function activatePeriodBtns(containerId, cb) {
  document.querySelectorAll(`#${containerId} .pbtn`).forEach(b => {
    b.onclick = () => {
      document.querySelectorAll(`#${containerId} .pbtn`).forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      cb(b.dataset.period || b.textContent);
    };
  });
}

function calcStats(rows) {
  const bk = {};
  rows.forEach(r => {
    const o = r.owner || "未分配";
    if (!bk[o]) bk[o]={total:0,contacted:0,success:0,fans:[]};
    bk[o].total++;
    if (STATUS_CONTACT.includes(r.status)) bk[o].contacted++;
    if (STATUS_SUCCESS.includes(r.status)) bk[o].success++;
    if (r.followers > 0) bk[o].fans.push(r.followers);
  });
  const res = {};
  for (const [o,b] of Object.entries(bk)) {
    const af = b.fans.length ? b.fans.reduce((a,c)=>a+c,0)/b.fans.length : 0;
    res[o] = {...b, avg_fans:af, quality_ok: af<=MAX_FANS, rate: b.contacted?b.success/b.contacted:0};
  }
  return res;
}

function calcKPI(stats) {
  const avgs = Object.values(stats).map(s=>s.contacted);
  const team = avgs.length ? avgs.reduce((a,c)=>a+c,0)/avgs.length : 1;
  const res  = {};
  for (const [o,s] of Object.entries(stats)) {
    const act  = Math.min(s.contacted/Math.max(team,1),2)/2;
    const qual = s.quality_ok ? 1 : Math.max(0,1-(s.avg_fans-MAX_FANS)/MAX_FANS);
    const sc   = Math.round((s.rate*.4+qual*.3+act*.3)*1000)/10;
    res[o] = {score:sc, grade: sc>=80?"A":sc>=60?"B":sc>=40?"C":"D"};
  }
  return res;
}

function sums(s) {
  return [Object.values(s).reduce((a,v)=>a+v.total,0),
          Object.values(s).reduce((a,v)=>a+v.contacted,0),
          Object.values(s).reduce((a,v)=>a+v.success,0)];
}

  requestAnimationFrame(()=>{

  });
}

function renderDonut(s,c,n) {
  const total=s+c+n||1, R=50, cx=60, cy=60, sw=14, circ=2*Math.PI*R;
  const arc=(pct,off,col)=>{
    const len=pct*circ, gap=circ-len;
    return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${col}" stroke-width="${sw}"
      stroke-dasharray="${len} ${gap}" stroke-dashoffset="${-off*circ}"
      stroke-linecap="round" style="transform-origin:${cx}px ${cy}px;transform:rotate(-90deg)"/>`;
  };
  return `<div class="donut-wrap">
    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="${sw}"/>
      ${arc(n/total,0,"rgba(255,255,255,.15)")}
      ${arc(c/total,n/total,"rgba(91,127,255,.8)")}
      ${arc(s/total,(n+c)/total,"#43d9a4")}
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
        style="font-family:Syne,sans-serif;font-size:${total>999?10:total>99?13:16}px;font-weight:700;fill:#fff;letter-spacing:-1px">${total}</text>
    </svg>
    <div class="donut-legend">

      <div class="leg"><div class="leg-dot" style="background:rgba(255,255,255,.2)"></div>暂未回复<span class="leg-val">${n}</span></div>
    </div>
  </div>`;
}

    const key = r.link||r.account||r.name;
    if(!key) return;
    if(STATUS_SUCCESS.includes(r.status)){ seen[key]="done"; return; }
    if(NO_REPLY.includes(r.status) && seen[key]!=="done" && !seen[key]){
      seen[key] = {name:r.name,owner:r.owner,date:r.record_date,status:r.status};
    }
  });
  Object.values(seen).forEach(info=>{
    if(typeof info!=="object") return;
    const d = new Date(info.date);
    const days = Math.floor((today-d)/(1000*60*60*24));
    if(days>=4) abandon.push({...info,days});
    else if(days>=2) revisit.push({...info,days});
  });
  const card = (title,color,dot,items,emptyMsg) => `
    <div class="card anim" style="margin-bottom:14px">
      <div class="card-title"><div class="dot" style="background:${dot}"></div>${title}（${items.length}人）</div>
      ${items.length?`<div class="person-grid">${items.map(r=>`
        <div class="pcard">
          <div>
            <div class="pname">${r.name}</div>
            <div class="pstats">
              <div class="ps"><em>跟进人</em><b>${r.owner}</b></div>
              <div class="ps"><em>最后联系</em><b>${r.date}</b></div>
              <div class="ps"><em>已沉默</em><b style="color:${color}">${r.days}天</b></div>
            </div>
          </div>
        </div>`).join("")}</div>`:`<div class="ok-box">${emptyMsg}</div>`}
    </div>`;
  el.innerHTML =
    card("🚫 建议放弃（4天无回复）","var(--red)","var(--red)",abandon,"暂无需放弃的博主") +
    card("⏰ 待二次回访（2天无回复）","var(--gold)","var(--gold)",revisit,"暂无需回访的博主");
}

async function runDupCheck() {
  const btn = document.getElementById("dup-run");
  const errEl = document.getElementById("dup-err");
  errEl.style.display = "none";
  const url = document.getElementById("dup-url").value.trim();
  if (!url) { showDupErr("请填写表格 URL"); return; }

  btn.disabled = true;
  btn.innerHTML = `<span class="spin-sm"></span> 检测中…`;
  _dupStoken = ""; _dupToken = ""; _dupDups = [];
  document.getElementById("dup-result").style.display = "none";

  try {
    const resp = await fetch(`${DUP_API}/check`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        url,
        nameCol:   document.getElementById("dup-nameCol").value,
        ownerCol:  document.getElementById("dup-ownerCol").value,
        hasHeader: document.getElementById("dup-header").checked,
        skip:      document.getElementById("dup-skip").value,
      })
    });
    const data = await resp.json();
    if (data.error) { showDupErr(data.error); return; }

    _dupStoken = data._stoken || "";
    _dupToken  = data._token  || "";
    _dupDups   = data.dups    || [];

    renderDupResult(data);
  } catch(e) {
    showDupErr("网络错误，请稍后重试");
  } finally {
    btn.disabled = false;
    btn.textContent = "重新查重";
  }
}

function renderDupResult(data) {
  const resultEl = document.getElementById("dup-result");

  // 数字概览
  let html = `
  <div class="dup-metrics">
    <div class="dup-metric">
      <div class="dup-metric-val" style="color:var(--blue)">${data.total}</div>
      <div class="dup-metric-lbl">总记录数</div>
    </div>
    <div class="dup-metric">
      <div class="dup-metric-val" style="color:var(--blue)">${data.unique}</div>
      <div class="dup-metric-lbl">唯一博主</div>
    </div>
    <div class="dup-metric">
      <div class="dup-metric-val" style="color:${data.dupCount>0?"var(--red)":"var(--green)"}">${data.dupCount}</div>
      <div class="dup-metric-lbl">重复博主</div>
    </div>
  </div>`;

  // 工作表标签
  html += `<div class="sheet-tags">${(data.sheets||[]).map(s=>
    `<span class="stag${s.skipped?" skip":""}">${s.skipped?"⏭ ":""}${esc(s.name)}${!s.skipped?` (${s.count})`:""}</span>`
  ).join("")}</div>`;

  // 写回栏
  if (data.dupCount > 0) {
    html += `
    <div class="wb-bar">
      <span>⚠️ 发现重复数据 — 可将后续重复行在飞书中实时标注"已重复"（首次出现保留）</span>
      <div class="wb-right">
        <span style="font-size:12px;color:var(--muted)">写入列</span>
        <input class="wb-col-inp" id="dup-markCol" value="H" maxlength="2">
        <button class="dup-btn dup-btn-mark" id="dup-mark-btn" onclick="runDupMark()">写回飞书</button>
        <span class="mark-ok" id="dup-mark-ok" style="display:none"></span>
      </div>
    </div>`;
  }

  // 重复列表
  html += `<div class="card">`;
  const dups = data.dups || [];
  if (!dups.length) {
    html += `<div class="ok-box">✅ 未发现重复博主，数据干净！</div>`;
  } else {
    const hasOwner = dups.some(d=>(d.owners||[]).some(o=>o&&o!=="未知"));
    html += `<div class="dup-sec-lbl">重复博主列表（共 ${dups.length} 个）</div>`;
    for (const d of dups) {
      const owners = (d.owners||[]).filter(o=>o&&o!=="未知");
      const isConflict = new Set(owners).size > 1;
      let ownerHtml = "";
      if (hasOwner && owners.length) {
        const chips = owners.map(o=>`<span class="owner-chip">${esc(o)}</span>`).join(`<span class="owner-sep">→</span>`);
        const lbl = isConflict
          ? `<span class="conflict-lbl">⚡ 不同负责人重复录入</span>`
          : `<span class="same-lbl">同一负责人重复</span>`;
        ownerHtml = `<div class="owner-row">${chips}${lbl}</div>`;
      }
      const occs = (d.occurrences||[]).map((o,idx)=>{
        const firstLabel = idx===0 ? `<span class="occ-first">（首次，保留）</span>` : "";
        const ownerSpan  = o.owner&&o.owner!=="未知" ? `<span class="occ-owner">👤 ${esc(o.owner)}</span>` : "";
        return `<div class="dup-occ">
          <span class="occ-sheet">${esc(o.sheet)}</span>
          <span class="occ-row">第 ${o.row} 行</span>
          ${ownerSpan}${firstLabel}
        </div>`;
      }).join("");
      html += `<div class="dup-group">
        <div class="dup-head">
          <span class="dup-name">${esc(d.name)}</span>
          <span class="dup-badge">出现 ${d.count} 次</span>
        </div>
        ${ownerHtml}${occs}
      </div>`;
    }
  }
  html += `</div>`;

  resultEl.innerHTML = html;
  resultEl.style.display = "block";
  resultEl.scrollIntoView({behavior:"smooth"});
}

async function runDupMark() {
  if (!_dupDups.length) return;
  const markCol = (document.getElementById("dup-markCol").value||"H").trim().toUpperCase();
  const okEl = document.getElementById("dup-mark-ok");
  const btn  = document.getElementById("dup-mark-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spin-sm"></span> 写入中…`;
  okEl.style.display = "none";
  try {
    const resp = await fetch(`${DUP_API}/mark`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({stoken:_dupStoken, token:_dupToken, markCol, dups:_dupDups})
    });
    const data = await resp.json();
    if (data.error) { alert("写入失败："+data.error); return; }
    okEl.textContent = `✅ 已标注 ${data.marked} 行`;
    okEl.style.display = "inline";
  } catch(e) {
    alert("网络错误，请重试");
  } finally {
    btn.disabled = false;
    btn.textContent = "写回飞书";
  }
}

  el.className = "dup-err";

  el.style.display = "block";
  const btn = document.getElementById("dup-run");
  btn.disabled = false;
  btn.textContent = "开始查重";
}

async function anFetchAll() {
  const targets = anFilterRows(anCurrentPeriod);
  if (!targets.length) { anSetStatus('该时间段内没有建联成功的博主', '#fca5a5'); return; }

  analysisProfiles = [];
  analysisDone = false;
  document.getElementById('an-profiles').innerHTML = '';
  document.getElementById('an-ai-btn').style.display = 'none';
  document.getElementById('an-fetch-btn').disabled = true;

  for (let i = 0; i < targets.length; i++) {
    const row = targets[i];
    anSetStatus(`搜索中 ${i+1} / ${targets.length}：${row.name || '—'}`);
    anSetProgress(Math.round((i / targets.length) * 100));
    await anFetchOne(row, i);
  }

  anSetProgress(100);
  analysisDone = true;
  anSetStatus(`✅ 搜索完成，共 ${targets.length} 位博主`, 'var(--green)');
  document.getElementById('an-fetch-btn').disabled = false;
  document.getElementById('an-ai-btn').style.display = 'flex';
}

async function anFetchOne(row, idx) {
  const container = document.getElementById('an-profiles');
  const card = document.createElement('div');
  card.id = 'an-card-' + idx;
  card.style.cssText = 'border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surf)';

  // 判断平台
  const link = row.link || '';
  let platform = '未知';
  if (link.includes('xhslink') || link.includes('xiaohongshu') || link.includes('xhs')) platform = '小红书';
  else if (link.includes('douyin') || link.includes('tiktok') || link.includes('v.dou')) platform = '抖音';
  else if (link.includes('bilibili')) platform = 'B站';
  else if (link.includes('weibo')) platform = '微博';

  card.innerHTML = `
    <div style="padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--surf2)">
      <div id="an-dot-${idx}" style="width:7px;height:7px;border-radius:50%;background:#f5a623;flex-shrink:0"></div>
      <span style="font-size:12px;font-weight:600;color:var(--text)">${row.name||'—'}</span>
      <span style="font-size:11px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${platform} · ${link}</span>
      <span style="font-size:11px;color:var(--green);background:rgba(67,217,164,.1);border:1px solid rgba(67,217,164,.25);padding:1px 7px;border-radius:4px;white-space:nowrap">已成功</span>
    </div>
    <div id="an-body-${idx}" style="padding:10px 14px;font-size:12px;color:var(--muted);font-style:italic">搜索中...</div>`;
  container.appendChild(card);

  try {
    // Step 1: Tavily 搜索博主信息
    const query = `${row.name} ${platform} 博主 内容类型 粉丝`;
    const searchResult = await tavilySearch(query);

    // Step 2: DeepSeek 根据搜索结果分析
    const data = await callClaude([{
      role: 'user',
      content: `根据以下搜索结果，分析该博主的公开信息，严格按JSON返回，不要其他文字：
{"platform":"${platform}","name":"${row.name}","followers":"粉丝量（如有）","content_type":"内容类型（1-3个标签，逗号分隔）","style":"内容风格（简洁2-4字）","audience":"目标受众","blogger_type":"博主类型（如：AI科技、生活方式、母婴、美食、知识分享等）"}

搜索结果：
${searchResult}

博主名：${row.name}，平台：${platform}，表格中记录的粉丝量：${row.followers||'未知'}万`
    }], 400);

    const raw = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
    let profile = {};
    try {
      const match = raw.match(/\{[\s\S]*\}/);
      profile = match ? JSON.parse(match[0]) : {};
    } catch { profile = {}; }

    profile._name = row.name;
    profile._link = link;
    profile._followers_raw = row.followers;
    if (!profile.platform) profile.platform = platform;

function mdToHtml(md) {
  // 转义 HTML 特殊字符
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const lines = md.split('\n');
  let html = '';
  let inList = false;

  const closeList = () => { if (inList) { html += '</div>'; inList = false; } };

  for (let i = 0; i < lines.length; i++) {
    let l = lines[i];

    // H1 # 标题
    if (/^#\s+/.test(l)) {
      closeList();
      html += `<div style="font-size:16px;font-weight:800;color:var(--text);margin:20px 0 10px">${esc(l.replace(/^#+\s*/,''))}</div>`;
      continue;
    }
    // H2 ## 标题 → 卡片标题
    if (/^##\s+/.test(l)) {
      closeList();
      const t = l.replace(/^#+\s*/,'');
      const icons = {'一、成功博主画像':'👤','二、建联方向建议':'🎯','成功博主画像':'👤','建联方向建议':'🎯'};
      const icon = Object.entries(icons).find(([k])=>t.includes(k))?.[1] || '📌';
      html += `</div><div style="background:var(--surf);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px">
        <div style="padding:11px 18px;background:var(--surf2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
          <span style="font-size:15px">${icon}</span>
          <span style="font-size:13px;font-weight:700;color:var(--text)">${esc(t)}</span>
        </div>
        <div style="padding:14px 18px;font-size:13px">`;
      continue;
    }
    // H3 ### 小标题
    if (/^###\s+/.test(l)) {
      closeList();
      html += `<div style="font-size:12px;font-weight:700;color:var(--text);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px;opacity:.7">${esc(l.replace(/^#+\s*/,''))}</div>`;
      continue;
    }
    // 列表项 - 或 * 或数字.
    if (/^[-*]\s+/.test(l) || /^\d+\.\s+/.test(l)) {
      if (!inList) { html += '<div style="display:flex;flex-direction:column;gap:2px;margin:4px 0">'; inList = true; }
      let text = l.replace(/^[-*\d.]+\s+/,'');
      // 行内加粗 **text**
      text = esc(text).replace(/\*\*(.*?)\*\*/g,'<b style="color:var(--text)">$1</b>');
      html += `<div style="display:flex;gap:8px;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.03)">
        <span style="color:var(--green);flex-shrink:0;margin-top:1px">▸</span>
        <span style="color:var(--text);line-height:1.65">${text}</span>
      </div>`;
      continue;
    }
    // 分隔线
    if (/^---+$/.test(l.trim())) { closeList(); html += '<div style="height:1px;background:var(--border);margin:12px 0"></div>'; continue; }
    // 空行
    if (!l.trim()) { closeList(); html += '<div style="height:6px"></div>'; continue; }
    // 普通段落
    closeList();
    let text = esc(l).replace(/\*\*(.*?)\*\*/g,'<b style="color:var(--text)">$1</b>');
    html += `<div style="color:var(--muted2);line-height:1.75;margin:3px 0">${text}</div>`;
  }
  closeList();
  return html;
}

let ocrPendingFiles = [];  // 待识别的图片文件

function ocrHandleDrop(e) {
  e.preventDefault();
  document.getElementById('ocr-drop').style.borderColor = 'var(--border)';
  ocrHandleFiles(e.dataTransfer.files);
}

function ocrHandleFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    ocrPendingFiles.push(f);
    const reader = new FileReader();
    reader.onload = ev => {
      const previews = document.getElementById('ocr-previews');
      if (!previews) return;
      const idx = ocrPendingFiles.indexOf(f);
      const div = document.createElement('div');
      div.id = 'preview-' + idx;
      div.style.cssText = 'position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;border:1px solid var(--border)';
      div.innerHTML = `
        <img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover">
        <button onclick="ocrRemoveFile(${idx})" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:4px;width:18px;height:18px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center">×</button>`;
      previews.appendChild(div);
    };
    reader.readAsDataURL(f);
  }
  const btn = document.getElementById('ocr-run-btn');
  if (btn) btn.disabled = ocrPendingFiles.length === 0;
}

function ocrRemoveFile(idx) {
  ocrPendingFiles.splice(idx, 1);
  const el = document.getElementById('preview-' + idx);
  if (el) el.remove();
  const btn = document.getElementById('ocr-run-btn');
  if (btn) btn.disabled = ocrPendingFiles.length === 0;
}

async function ocrRun() {
  if (!ocrPendingFiles.length) return;
  const btn = document.getElementById('ocr-run-btn');
  if (btn) btn.disabled = true;
  const statusEl = document.getElementById('ocr-status');

  // 逐张识别，避免超时
  const newRows = [];

  for (let i = 0; i < ocrPendingFiles.length; i++) {
    const f = ocrPendingFiles[i];
    if (statusEl) statusEl.textContent = `识别中 ${i+1} / ${ocrPendingFiles.length}：${f.name}`;

    // 压缩并转 base64（最大 1200px，quality 0.8）
    const b64 = await new Promise(res => {
      const img = new Image();
      const url = URL.createObjectURL(f);
      img.onload = () => {
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
      };
      img.src = url;
    });

    try {
      const resp = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + QWEN_KEY
        },
        body: JSON.stringify({
          model: 'qwen-vl-plus',
          max_tokens: 2000,
          messages: [{
            role: 'user',
            content: [
              { type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + b64 } },
              { type: 'text', text: `请识别图片中的博主主页信息，严格按以下JSON数组格式返回，不要任何其他文字：
[{"name":"博主名称","account":"博主账号ID（如抖音号/小红书号/B站UID等，不是昵称）","link":"主页链接（如有否则空）","followers":"粉丝数（如19.4万）","blogger_type":"博主类型（如AI科技/生活方式/知识分享等）","error":""}]
如无法识别在error字段说明原因，其他字段留空。followers只填粉丝数不填获赞数。` }
            ]
          }]
        })
      });
      const data = await resp.json();
      const text = data.choices?.[0]?.message?.content || '';
      if (!text) {
        newRows.push({ _error: data.error?.message || '识别失败', name:'', platform:'', followers:'', blogger_type:'', link:'', status:'', owner:'' });
      } else {
        try {
          const match = text.match(/\[[\s\S]*\]/);
          const parsed = match ? JSON.parse(match[0]) : null;
          if (parsed && Array.isArray(parsed)) {
            parsed.forEach(r => {
              if (r.error) {
                newRows.push({ _error: r.error, name:'', platform:'', followers:'', blogger_type:'', link:'', status:'', owner:'' });
              } else {
                newRows.push({ name: r.name||'', account: r.account||'', followers: r.followers||'', blogger_type: r.blogger_type||'', link: r.link||'', status:'', owner:'' });
              }
            });
          } else {
            newRows.push({ _error: '格式解析失败：' + text.slice(0,80), name:'', platform:'', followers:'', blogger_type:'', link:'', status:'', owner:'' });
          }
        } catch(pe) {
          newRows.push({ _error: '解析错误：' + pe.message, name:'', platform:'', followers:'', blogger_type:'', link:'', status:'', owner:'' });
        }
      }
    } catch(e) {
      newRows.push({ _error: e.message, name:'', platform:'', followers:'', blogger_type:'', link:'', status:'', owner:'' });
    }
    // 每识别一张就实时更新表格
    ocrRows = [...ocrRows, ...newRows.slice(newRows.length-1)];
    ocrRenderTable();
  }

  ocrRows = [...ocrRows, ...newRows];
  ocrPendingFiles = [];
  const previews = document.getElementById('ocr-previews');
  if (previews) previews.innerHTML = '';
  if (btn) btn.disabled = true;
  if (statusEl) statusEl.textContent = `✅ 识别完成，共 ${ocrRows.filter(r=>!r._error).length} 条有效数据`;
  ocrRenderTable();
}

function ocrRenderTable() {
  const wrap = document.getElementById('ocr-table-wrap');
  const tbody = document.getElementById('ocr-tbody');
  const count = document.getElementById('ocr-count');
  if (!wrap || !tbody) return;

  wrap.style.display = 'block';
  if (count) count.textContent = `${ocrRows.filter(r=>!r._error).length} 条`;

  tbody.innerHTML = ocrRows.map((row, idx) => {
    if (row._error) {
      return `<tr style="background:rgba(239,68,68,.05)">
        <td colspan="8" style="padding:10px 14px;color:#fca5a5;font-size:12px">⚠ ${row._error}
          <button onclick="ocrDeleteRow(${idx})" style="margin-left:8px;background:transparent;border:none;color:#fca5a5;cursor:pointer;font-size:11px">删除</button>
        </td>
      </tr>`;
    }
    const td = (val, field) => `<td style="padding:8px 14px;border-bottom:1px solid var(--border);color:var(--text)">
      <div contenteditable="true" onblur="ocrEdit(${idx},'${field}',this.textContent)"
        style="outline:none;min-width:40px;min-height:16px">${val||''}</div>
    </td>`;
    return `<tr id="ocr-row-${idx}" style="transition:background .15s" onmouseover="this.style.background='var(--surf2)'" onmouseout="this.style.background='transparent'">
      ${td(row.name,'name')}
      ${td(row.account,'account')}
      ${td(row.followers,'followers')}
      ${td(row.blogger_type,'blogger_type')}
      ${td(row.link,'link')}
      ${td(row.status,'status')}
      ${td(row.owner,'owner')}
      <td style="padding:8px 14px;border-bottom:1px solid var(--border)">
        <button onclick="ocrDeleteRow(${idx})" style="background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:13px">🗑</button>
      </td>
    </tr>`;
  }).join('');
}

function ocrEdit(idx, field, val) {
  if (ocrRows[idx]) ocrRows[idx][field] = val.trim();
}

function ocrDeleteRow(idx) {
  ocrRows.splice(idx, 1);
  ocrRenderTable();
}

function ocrClear() {
  ocrRows = [];
  ocrPendingFiles = [];
  rendered.delete('ocr');
  renderOcr();
  rendered.add('ocr');
}

function ocrExportCSV() {
  const valid = ocrRows.filter(r => !r._error);
  if (!valid.length) return;
  const header = '博主名,博主号,粉丝量,博主类型,博主链接,回复情况,跟进人';
  const rows = valid.map(r =>
    [r.name, r.account, r.followers, r.blogger_type, r.link, r.status, r.owner]
      .map(v => `"${(v||'').replace(/"/g,'""')}"`)
      .join(',')
  );
  const csv = '\uFEFF' + header + '\n' + rows.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = '博主信息.csv'; a.click();
}

function ocrCopyCol(field) {
  const valid = ocrRows.filter(r => !r._error);
  if (!valid.length) return;
  const text = valid.map(r => r[field] || '').join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const s = document.getElementById('ocr-status');
    const labels = {name:'博主名',account:'博主号',followers:'粉丝量',blogger_type:'博主类型',link:'博主链接',status:'回复情况',owner:'跟进人'};
    if (s) { s.textContent = `✅ 已复制「${labels[field]||field}」列`; s.style.color = 'var(--green)'; setTimeout(()=>{ if(s) s.textContent=''; }, 2000); }
  });
}

function ocrCopyFeishu() {
  const valid = ocrRows.filter(r => !r._error);
  if (!valid.length) return;
  const rows = valid.map(r =>
    [r.name, r.account, r.followers, r.blogger_type, r.link, r.status, r.owner].join('\t')
  );
  navigator.clipboard.writeText(rows.join('\n')).then(() => {
    const s = document.getElementById('ocr-status');
    if (s) { s.textContent = '✅ 已复制，直接粘贴到飞书表格即可'; s.style.color = 'var(--green)'; }
  });
}

async function handleKbFile(input) {
  const file = input.files[0];
  if (!file) return;
  const statusEl = document.getElementById("kb-file-status");
  const nameEl = document.getElementById("kb-file-name");
  nameEl.textContent = file.name;
  statusEl.textContent = "解析中...";
  statusEl.style.color = "var(--muted)";
  const titleEl = document.getElementById("kb-title");
  if (!titleEl.value) titleEl.value = file.name.replace(/\.[^.]+$/, "");
  try {
    let text = "";
    const ext = file.name.split(".").pop().toLowerCase();
    if (ext === "txt" || ext === "md") {
      text = await file.text();
    } else if (ext === "pdf") {
      const arrayBuffer = await file.arrayBuffer();
      const pdfjsLib = window["pdfjs-dist/build/pdf"];
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const tc = await page.getTextContent();
        pages.push(tc.items.map(function(s) { return s.str; }).join(" "));
      }
      text = pages.join("\n");
    } else if (ext === "docx") {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
      text = result.value;
    }
    document.getElementById("kb-content").value = text;
    statusEl.textContent = "✓ 解析完成，共 " + text.length + " 字";
    statusEl.style.color = "var(--green)";
    document.getElementById("kb-summary-bar").style.display = "block";
  } catch(e) {
    statusEl.textContent = "解析失败：" + e.message;
    statusEl.style.color = "var(--danger)";
  }
}

function toggleKbEditor() {
  const ed = document.getElementById("kb-editor");
  ed.style.display = ed.style.display === "none" ? "block" : "none";
  if (ed.style.display === "none") {
    document.getElementById("kb-file-name").textContent = "";
    document.getElementById("kb-file-status").textContent = "";
    document.getElementById("kb-summary-bar").style.display = "none";
    document.getElementById("kb-summary-status").textContent = "";
  }
}

async function saveKbItem() {
  const title = document.getElementById("kb-title").value.trim();
  const content = document.getElementById("kb-content").value.trim();
  const category = document.getElementById("kb-category").value;
  if (!title || !content) { alert("标题和内容不能为空"); return; }
  try {
    const resp = await fetch(SUPABASE_URL + "/rest/v1/knowledge_base", {
      method: "POST",
      headers: { "apikey": SUPABASE_ANON, "Authorization": "Bearer " + SUPABASE_ANON, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify({ title, content, category })
    });
    if (resp.ok) {
      document.getElementById("kb-title").value = "";
      document.getElementById("kb-content").value = "";
      toggleKbEditor();
      await loadKbList();
    } else {
      alert("保存失败，请重试");
    }
  } catch(e) {
    alert("保存失败：" + e.message);
  }
}

function editKbItem(id) {
  document.getElementById("kb-view-" + id).style.display = "none";
  document.getElementById("kb-edit-" + id).style.display = "block";
}

function cancelKbEdit(id) {
  document.getElementById("kb-view-" + id).style.display = "block";
  document.getElementById("kb-edit-" + id).style.display = "none";
}

async function saveKbEdit(id) {
  const title = document.getElementById("kb-edit-title-" + id).value.trim();
  const content = document.getElementById("kb-edit-content-" + id).value.trim();
  if (!title || !content) { alert("标题和内容不能为空"); return; }
  try {
    const resp = await fetch(SUPABASE_URL + "/rest/v1/knowledge_base?id=eq." + id, {
      method: "PATCH",
      headers: { "apikey": SUPABASE_ANON, "Authorization": "Bearer " + SUPABASE_ANON, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify({ title: title, content: content, updated_at: new Date().toISOString() })
    });
    if (resp.ok) {
      await loadKbList();
    } else {
      alert("保存失败，请重试");
    }
  } catch(e) {
    alert("保存失败：" + e.message);
  }
}

async function deleteKbItem(id) {
  if (!confirm("确认删除这条材料？")) return;
  try {
    await fetch(SUPABASE_URL + "/rest/v1/knowledge_base?id=eq." + id, {
      method: "DELETE",
      headers: { "apikey": SUPABASE_ANON, "Authorization": "Bearer " + SUPABASE_ANON }
    });
    await loadKbList();
  } catch(e) {
    alert("删除失败");
  }
}

async function genFileSummary() {
  const content = document.getElementById("kb-content").value.trim();
  if (!content) { alert("请先上传文件或输入内容"); return; }
  const wordLen = document.getElementById("kb-summary-len").value;
  const btn = document.getElementById("kb-summary-btn");
  const statusEl = document.getElementById("kb-summary-status");
  btn.disabled = true;
  btn.textContent = "生成中...";
  statusEl.textContent = "";
  try {
    const resp = await fetch("https://api.deepseek.com/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer sk-78a6a00bf38c48dab8b94303f2bae165" },
      body: JSON.stringify({
        model: "deepseek-chat",
        max_tokens: 1500,
        messages: [{
          role: "user",
          content: "请将以下内容总结为约" + wordLen + "字的摘要，保留核心要点，语言简洁清晰：\n\n" + content.slice(0, 8000)
        }]
      })
    });
    const data = await resp.json();
    const summary = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (summary) {
      document.getElementById("kb-content").value = summary;
      statusEl.textContent = "✓ 摘要生成完成（" + summary.length + "字）";
      statusEl.style.color = "var(--green)";
    } else {
      statusEl.textContent = "生成失败，请重试";
      statusEl.style.color = "var(--red)";
    }
  } catch(e) {
    statusEl.textContent = "请求失败：" + e.message;
    statusEl.style.color = "var(--red)";
  } finally {
    btn.disabled = false;
    btn.textContent = "生成摘要";
  }
}

async function askAI() {
  const input = document.getElementById("qa-input");
  const q = input.value.trim();
  if (!q) return;
  input.value = "";

  const history = document.getElementById("qa-history");
  const qDiv = document.createElement("div");
  qDiv.style.cssText = "align-self:flex-end;background:var(--blue);color:#fff;padding:10px 14px;border-radius:14px 14px 4px 14px;max-width:80%;font-size:13px";
  qDiv.textContent = q;
  history.appendChild(qDiv);

  const loadDiv = document.createElement("div");
  loadDiv.style.cssText = "align-self:flex-start;background:var(--surf2);color:var(--muted);padding:10px 14px;border-radius:14px 14px 14px 4px;font-size:13px";
  loadDiv.textContent = "思考中...";
  history.appendChild(loadDiv);
  history.scrollTop = history.scrollHeight;

  try {
    const kbContext = kbItems.length > 0
      ? kbItems.map(function(i) { return "【" + i.category + "·" + i.title + "】\n" + i.content; }).join("\n\n")
      : "（暂无知识库材料）";

    const systemPrompt = "你是博主建联管理系统的智能助手，只根据以下提供的材料回答问题。如果问题超出材料范围，回复\"这个问题超出我的知识范围，请询问管理员\"。回答简洁明了，100字以内。\n\n【知识库材料】\n" + kbContext;

    const resp = await fetch("https://api.deepseek.com/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer sk-78a6a00bf38c48dab8b94303f2bae165" },
      body: JSON.stringify({
        model: "deepseek-chat",
        max_tokens: 300,
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: q }
        ]
      })
    });
    const data = await resp.json();
    const answer = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "抱歉，暂时无法回答，请询问管理员";
    loadDiv.textContent = answer;
    loadDiv.style.color = "var(--text)";
  } catch(e) {
    loadDiv.textContent = "请求失败，请稍后重试";
  }
  history.scrollTop = history.scrollHeight;
}

const TABS = {
  overview: renderOverview,
  team:     renderTeam,
  bloggers: renderBloggers,
  revisit:  renderRevisit,
  trend:    renderTrend,
  guide:    renderGuide,
  lookup:   renderLookup,
  report:   renderReport,
  ocr:      renderOcr,
};
let rendered = new Set();

function switchTab(tab, btn) {
  Object.keys(TABS).forEach(t => document.getElementById("pane-"+t).style.display = t===tab?"":"none");
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  if (!rendered.has(tab)) { TABS[tab](); rendered.add(tab); }
  if (tab === 'report') { rendered.delete('report'); TABS['report'](); rendered.add('report'); }
  if (tab === 'guide') { loadAISummary(); loadKbList(); }
}

async function init() {
  const now = new Date();
  document.getElementById("dateBadge").textContent =
    `${now.getMonth()+1}月${now.getDate()}日 ${now.getHours().toString().padStart(2,"0")}:${now.getMinutes().toString().padStart(2,"0")}`;
  await loadData();
  renderOverview();
  rendered.add("overview");
}

init();
</script>
