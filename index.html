<script>
// ══════════════════════════════════════════
// Supabase 客户端
// ══════════════════════════════════════════
const SB = {
  async query(table, params = {}) {
    const qs = new URLSearchParams();
    if (params.select)   qs.set("select",  params.select);
    if (params.order)    qs.set("order",   params.order);
    if (params.limit)    qs.set("limit",   params.limit);
    if (params.gte_date) qs.set("record_date", `gte.${params.gte_date}`);
    if (params.eq_date)  qs.set("record_date", `eq.${params.eq_date}`);
    // 优先走 Vercel 中转（解决国内访问 Supabase 问题）
    const vercelUrl = `${VERCEL_API}/api/data?table=${table}&${qs}`;
    const directUrl = `${SUPABASE_URL}/rest/v1/${table}?${qs}`;
    let res;
    try {
      res = await fetch(vercelUrl, { signal: AbortSignal.timeout(8000) });
    } catch(e) {
      // Vercel 失败则直连 Supabase
      res = await fetch(directUrl, {
        headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` }
      });
    }
    if (!res.ok) throw new Error(`数据请求失败 ${res.status}: ${await res.text()}`);
    return res.json();
  }
};

// ══════════════════════════════════════════
// 工具函数
// ══════════════════════════════════════════
const fmtRate = (n,d) => d ? (n/d*100).toFixed(1)+"%" : "—";
const fmtF    = f => (f==null||isNaN(f)) ? "—" : Number(f).toFixed(1)+"万";
const esc     = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function localDateStr(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
const today   = localDateStr(new Date());
const weekStart = (() => {
  const d = new Date(); d.setDate(d.getDate()-d.getDay()+1); return localDateStr(d);
})();

// 时间范围筛选

function getPeriodLabel(period) {
  return {"all":"历史","today":"今日","week":"本周","last_week":"上周","month":"本月","last_month":"上月"}[period] || "今日";
}

function filterByPeriod(rows, period) {
  const now = new Date();
  const todayStr = localDateStr(now);
  const weekStartD = new Date(now); weekStartD.setDate(now.getDate()-now.getDay()+1);
  const weekStartStr = localDateStr(weekStartD);
  const monthStartStr = todayStr.slice(0,7) + "-01";
  if (period === "today") return rows.filter(r => r.record_date === todayStr);
  if (period === "yesterday") {
    const y = new Date(); y.setDate(y.getDate()-1);
    const yStr = localDateStr(y);
    return rows.filter(r => r.record_date === yStr);
  }
  if (period === "week")  return rows.filter(r => r.record_date >= weekStartStr && r.record_date <= todayStr);
  if (period === "month") return rows.filter(r => r.record_date >= monthStartStr && r.record_date <= todayStr);
  if (period === "last_week") {
    const lastWeekEnd = new Date(weekStartD); lastWeekEnd.setDate(lastWeekEnd.getDate()-1);
    const lastWeekStart = new Date(lastWeekEnd); lastWeekStart.setDate(lastWeekStart.getDate()-6);
    return rows.filter(r => r.record_date >= localDateStr(lastWeekStart) && r.record_date <= localDateStr(lastWeekEnd));
  }
  if (period === "last_month") {
    const lastMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const lastMonthStart = localDateStr(lastMonthDate);
    const lastMonthEnd = localDateStr(new Date(now.getFullYear(), now.getMonth(), 0));
    return rows.filter(r => r.record_date >= lastMonthStart && r.record_date <= lastMonthEnd);
  }
  return rows; // all
}

function periodBtns(current, onChange) {
  const periods = [["all","全部历史"],["today","今天"],["week","本周"],["month","本月"]];
  return `<div class="period-btns" style="margin-bottom:14px">${periods.map(([v,l])=>
    `<button class="pbtn${current===v?' active':''}" onclick="(${onChange})('${v}',this)">${l}</button>`
  ).join("")}</div>`;
}

function activatePeriodBtns(containerId, cb) {
  document.querySelectorAll(`#${containerId} .pbtn`).forEach(b => {
    b.onclick = () => {
      document.querySelectorAll(`#${containerId} .pbtn`).forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      cb(b.dataset.period || b.textContent);
    };
  });
}

function calcStats(rows) {
  const bk = {};
  rows.forEach(r => {
    const o = r.owner || "未分配";
    if (!bk[o]) bk[o]={total:0,contacted:0,success:0,fans:[]};
    bk[o].total++;
    if (STATUS_CONTACT.includes(r.status)) bk[o].contacted++;
    if (STATUS_SUCCESS.includes(r.status)) bk[o].success++;
    if (r.followers > 0) bk[o].fans.push(r.followers);
  });
  const res = {};
  for (const [o,b] of Object.entries(bk)) {
    const af = b.fans.length ? b.fans.reduce((a,c)=>a+c,0)/b.fans.length : 0;
    res[o] = {...b, avg_fans:af, quality_ok: af<=MAX_FANS, rate: b.contacted?b.success/b.contacted:0};
  }
  return res;
}

function calcKPI(stats) {
  const avgs = Object.values(stats).map(s=>s.contacted);
  const team = avgs.length ? avgs.reduce((a,c)=>a+c,0)/avgs.length : 1;
  const res  = {};
  for (const [o,s] of Object.entries(stats)) {
    const act  = Math.min(s.contacted/Math.max(team,1),2)/2;
    const qual = s.quality_ok ? 1 : Math.max(0,1-(s.avg_fans-MAX_FANS)/MAX_FANS);
    const sc   = Math.round((s.rate*.4+qual*.3+act*.3)*1000)/10;
    res[o] = {score:sc, grade: sc>=80?"A":sc>=60?"B":sc>=40?"C":"D"};
  }
  return res;
}

function sums(s) {
  return [Object.values(s).reduce((a,v)=>a+v.total,0),
          Object.values(s).reduce((a,v)=>a+v.contacted,0),
          Object.values(s).reduce((a,v)=>a+v.success,0)];
}

function animBars() {
  requestAnimationFrame(()=>{
    document.querySelectorAll(".bar-fill[data-w]").forEach(el => el.style.width = el.dataset.w+"%");
  });
}

// ══════════════════════════════════════════
// 数据加载
// ══════════════════════════════════════════
let ALL_ROWS = [], REPORTS = [];

async function loadData() {
  try {
    [ALL_ROWS, REPORTS] = await Promise.all([
      SB.query("bloggers", {
        select: "link,name,status,followers,owner,record_date,platform,blogger_type,account,note,is_dup",
        order:  "record_date.desc",
        limit:  "10000"
      }),
      SB.query("daily_reports", {
        select: "report_date,total,contacted,success,rate,w_total,w_contacted,w_success,w_rate",
        order:  "report_date.desc",
        limit:  "14"
      })
    ]);
    document.getElementById("syncTime").textContent = `最后同步 ${new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}`;
  } catch(e) {
    document.getElementById("pane-overview").innerHTML =
      `<div class="card"><div class="empty">⚠️ 连接 Supabase 失败，请检查配置<br><small style="color:var(--muted)">${e.message}</small></div></div>`;
    throw e;
  }
}

// ══════════════════════════════════════════
// 总览
// ══════════════════════════════════════════
let overviewPeriod = "today";
function renderOverview() {
  const rows = filterByPeriod(ALL_ROWS, overviewPeriod);
  const todayRows = rows;
  const weekRows  = rows;
  const ts = calcStats(todayRows), ws = calcStats(weekRows);
  const [tt,tc,tsx] = sums(ts), [wt,wc,wsx] = sums(ws);
  const dN = todayRows.filter(r=>r.status==="没回").length;
  const dC = todayRows.filter(r=>STATUS_CONTACT.includes(r.status)&&!STATUS_SUCCESS.includes(r.status)).length;
  const dS = todayRows.filter(r=>STATUS_SUCCESS.includes(r.status)).length;
  const qOk = todayRows.filter(r=>r.followers<=MAX_FANS).length;
  const replied = todayRows.filter(r=>r.status&&r.status!=="没回"&&r.status!=="未回"&&r.status!=="").length;
  const repliedTotal = todayRows.length;

  const el = document.getElementById("pane-overview");
  el.innerHTML = `
  <div class="period-btns" style="margin-bottom:14px">
    ${["all","today","week","month"].map((v,i)=>{
      const labels=["全部历史","今天","本周","本月"];
      return `<button class="pbtn${overviewPeriod===v?' active':''}" onclick="overviewPeriod='${v}';renderOverview()">${labels[i]}</button>`;
    }).join("")}
  </div>
  <div class="metrics anim">
    <div class="mc" style="--c:#5b7fff">
      <div class="mc-label">${getPeriodLabel(overviewPeriod)}录入博主</div>
      <div class="mc-val">${tt}</div>
      <div class="mc-sub">共 ${wt} 人</div>
    </div>
    <div class="mc" style="--c:#43d9a4">
      <div class="mc-label">${getPeriodLabel(overviewPeriod)}引导成功</div>
      <div class="mc-val" style="color:var(--green)">${tsx}</div>
      <div class="mc-sub">转化率 ${fmtRate(tsx,tc)}</div>
    </div>
    <div class="mc" style="--c:#5b7fff">
      <div class="mc-label">${getPeriodLabel(overviewPeriod)}已联系</div>
      <div class="mc-val" style="color:var(--blue)">${tc}</div>
      <div class="mc-sub">暂未回 ${dN} 人</div>
    </div>
    <div class="mc" style="--c:#f5a623">
      <div class="mc-label">有效回复率</div>
      <div class="mc-val" style="color:var(--gold)">${repliedTotal?Math.round(replied/repliedTotal*100):0}%</div>
      <div class="mc-sub">有意向博主占比</div>
    </div>
  </div>
  <div class="two-col anim">
    <div class="card">
      <div class="card-title"><div class="dot" style="background:var(--green)"></div>${getPeriodLabel(overviewPeriod)}状态分布</div>
      ${renderDonut(dS,dC,dN)}
    </div>
    <div class="card">
      <div class="card-title"><div class="dot" style="background:var(--blue)"></div>${getPeriodLabel(overviewPeriod)}平台分布</div>
      ${renderPlatformBars(todayRows)}
    </div>
  </div>
  <div class="card anim">
    <div class="card-title"><div class="dot" style="background:var(--gold)"></div>本周汇总</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px">
      ${wStat("录入总量",wt,"人")} ${wStat("已联系",wc,"人")} ${wStat("建联成功",wsx,"人")} ${wStat("周转化率",fmtRate(wsx,wc),"","#43d9a4",true)}
    </div>
  </div>`;
  setTimeout(animBars, 60);
}

function wStat(label,val,unit,color,raw=false) {
  return `<div style="text-align:center">
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">${label}</div>
    <div style="font-family:'Noto Sans SC',sans-serif;font-size:32px;font-weight:700;letter-spacing:-1px;${color?`color:${color}`:""}">
      ${val}<span style="font-size:13px;color:var(--muted);margin-left:2px">${unit}</span>
    </div>
  </div>`;
}

function renderDonut(s,c,n) {
  const total=s+c+n||1, R=50, cx=60, cy=60, sw=14, circ=2*Math.PI*R;
  const arc=(pct,off,col)=>{
    const len=pct*circ, gap=circ-len;
    return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${col}" stroke-width="${sw}"
      stroke-dasharray="${len} ${gap}" stroke-dashoffset="${-off*circ}"
      stroke-linecap="round" style="transform-origin:${cx}px ${cy}px;transform:rotate(-90deg)"/>`;
  };
  return `<div class="donut-wrap">
    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="${sw}"/>
      ${arc(n/total,0,"rgba(255,255,255,.15)")}
      ${arc(c/total,n/total,"rgba(91,127,255,.8)")}
      ${arc(s/total,(n+c)/total,"#43d9a4")}
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
        style="font-family:Syne,sans-serif;font-size:${total>999?10:total>99?13:16}px;font-weight:700;fill:#fff;letter-spacing:-1px">${total}</text>
    </svg>
    <div class="donut-legend">
      <div class="leg"><div class="leg-dot" style="background:#43d9a4"></div>合作成功<span class="leg-val" style="color:#43d9a4">${s}</span></div>
      <div class="leg"><div class="leg-dot" style="background:#5b7fff"></div>私信建联<span class="leg-val" style="color:#5b7fff">${c}</span></div>
      <div class="leg"><div class="leg-dot" style="background:rgba(255,255,255,.2)"></div>暂未回复<span class="leg-val">${n}</span></div>
    </div>
  </div>`;
}

function renderWeekBars() {
  const days = [];
  for (let i=6;i>=0;i--) { const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().split("T")[0]); }
  const maxV = Math.max(...days.map(d=>ALL_ROWS.filter(r=>r.record_date===d&&STATUS_SUCCESS.includes(r.status)).length),1);
  return `<div class="bars">${days.map(d=>{

function renderRevisit() {
  const el = document.getElementById("pane-revisit");
  const today = new Date();
  const revisit = [];
  const abandon = [];
  const NO_REPLY = ["没回","未回"];
  const seen = {};
  const sorted = [...ALL_ROWS].sort((a,b)=>b.record_date.localeCompare(a.record_date));
  sorted.forEach(r=>{
    const key = r.link||r.account||r.name;
    if(!key) return;
    if(STATUS_SUCCESS.includes(r.status)){ seen[key]="done"; return; }
    if(NO_REPLY.includes(r.status) && seen[key]!=="done" && !seen[key]){
      seen[key] = {name:r.name,owner:r.owner,date:r.record_date,status:r.status};
    }
  });
  Object.values(seen).forEach(info=>{
    if(typeof info!=="object") return;
    const d = new Date(info.date);
    const days = Math.floor((today-d)/(1000*60*60*24));
    if(days>=4) abandon.push({...info,days});
    else if(days>=2) revisit.push({...info,days});
  });
  const card = (title,color,dot,items,emptyMsg) => `
    <div class="card anim" style="margin-bottom:14px">
      <div class="card-title"><div class="dot" style="background:${dot}"></div>${title}（${items.length}人）</div>
      ${items.length?`<div class="person-grid">${items.map(r=>`
        <div class="pcard">
          <div>
            <div class="pname">${r.name}</div>
            <div class="pstats">
              <div class="ps"><em>跟进人</em><b>${r.owner}</b></div>
              <div class="ps"><em>最后联系</em><b>${r.date}</b></div>
              <div class="ps"><em>已沉默</em><b style="color:${color}">${r.days}天</b></div>
            </div>
          </div>
        </div>`).join("")}</div>`:`<div class="ok-box">${emptyMsg}</div>`}
    </div>`;
  el.innerHTML =
    card("🚫 建议放弃（4天无回复）","var(--red)","var(--red)",abandon,"暂无需放弃的博主") +
    card("⏰ 待二次回访（2天无回复）","var(--gold)","var(--gold)",revisit,"暂无需回访的博主");
}

async function runDupCheck() {
  const btn = document.getElementById("dup-run");
  const errEl = document.getElementById("dup-err");
  errEl.style.display = "none";
  const url = document.getElementById("dup-url").value.trim();
  if (!url) { showDupErr("请填写表格 URL"); return; }

  btn.disabled = true;
  btn.innerHTML = `<span class="spin-sm"></span> 检测中…`;
  _dupStoken = ""; _dupToken = ""; _dupDups = [];
  document.getElementById("dup-result").style.display = "none";

  try {
    const resp = await fetch(`${DUP_API}/check`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        url,
        nameCol:   document.getElementById("dup-nameCol").value,
        ownerCol:  document.getElementById("dup-ownerCol").value,
        hasHeader: document.getElementById("dup-header").checked,
        skip:      document.getElementById("dup-skip").value,
      })
    });
    const data = await resp.json();
    if (data.error) { showDupErr(data.error); return; }

    _dupStoken = data._stoken || "";
    _dupToken  = data._token  || "";
    _dupDups   = data.dups    || [];

    renderDupResult(data);
  } catch(e) {
    showDupErr("网络错误，请稍后重试");
  } finally {
    btn.disabled = false;
    btn.textContent = "重新查重";
  }
}

function renderDupResult(data) {
  const resultEl = document.getElementById("dup-result");

  // 数字概览
  let html = `
  <div class="dup-metrics">
    <div class="dup-metric">
      <div class="dup-metric-val" style="color:var(--blue)">${data.total}</div>
      <div class="dup-metric-lbl">总记录数</div>

    <div class="dup-metric">

      <div class="dup-metric-lbl">唯一博主</div>
    </div>
    <div class="dup-metric">
      <div class="dup-metric-val" style="color:${data.dupCount>0?"var(--red)":"var(--green)"}">${data.dupCount}</div>
      <div class="dup-metric-lbl">重复博主</div>
    </div>
  </div>`;

  // 工作表标签
  html += `<div class="sheet-tags">${(data.sheets||[]).map(s=>
    `<span class="stag${s.skipped?" skip":""}">${s.skipped?"⏭ ":""}${esc(s.name)}${!s.skipped?` (${s.count})`:""}</span>`
  ).join("")}</div>`;

  // 写回栏
  if (data.dupCount > 0) {
    html += `
    <div class="wb-bar">
      <span>⚠️ 发现重复数据 — 可将后续重复行在飞书中实时标注"已重复"（首次出现保留）</span>

        <span class="mark-ok" id="dup-mark-ok" style="display:none"></span>
      </div>
    </div>`;
  }

  // 重复列表
  html += `<div class="card">`;
  const dups = data.dups || [];
  if (!dups.length) {
    html += `<div class="ok-box">✅ 未发现重复博主，数据干净！</div>`;
  } else {
    const hasOwner = dups.some(d=>(d.owners||[]).some(o=>o&&o!=="未知"));
    html += `<div class="dup-sec-lbl">重复博主列表（共 ${dups.length} 个）</div>`;
    for (const d of dups) {
      const owners = (d.owners||[]).filter(o=>o&&o!=="未知");
      const isConflict = new Set(owners).size > 1;
      let ownerHtml = "";
      if (hasOwner && owners.length) {
        const chips = owners.map(o=>`<span class="owner-chip">${esc(o)}</span>`).join(`<span class="owner-sep">→</span>`);
        const lbl = isConflict
          ? `<span class="conflict-lbl">⚡ 不同负责人重复录入</span>`
          : `<span class="same-lbl">同一负责人重复</span>`;
        ownerHtml = `<div class="owner-row">${chips}${lbl}</div>`;
      }
      const occs = (d.occurrences||[]).map((o,idx)=>{
        const firstLabel = idx===0 ? `<span class="occ-first">（首次，保留）</span>` : "";
        const ownerSpan  = o.owner&&o.owner!=="未知" ? `<span class="occ-owner">👤 ${esc(o.owner)}</span>` : "";
        return `<div class="dup-occ">
          <span class="occ-sheet">${esc(o.sheet)}</span>
          <span class="occ-row">第 ${o.row} 行</span>
          ${ownerSpan}${firstLabel}
        </div>`;
      }).join("");
      html += `<div class="dup-group">
        <div class="dup-head">
          <span class="dup-name">${esc(d.name)}</span>
          <span class="dup-badge">出现 ${d.count} 次</span>
        </div>
        ${ownerHtml}${occs}
      </div>`;
    }
  }
  html += `</div>`;

  resultEl.innerHTML = html;
  resultEl.style.display = "block";
  resultEl.scrollIntoView({behavior:"smooth"});
}

async function runDupMark() {
  if (!_dupDups.length) return;
  const markCol = (document.getElementById("dup-markCol").value||"H").trim().toUpperCase();
  const okEl = document.getElementById("dup-mark-ok");
  const btn  = document.getElementById("dup-mark-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spin-sm"></span> 写入中…`;
  okEl.style.display = "none";
  try {
    const resp = await fetch(`${DUP_API}/mark`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({stoken:_dupStoken, token:_dupToken, markCol, dups:_dupDups})
    });
    const data = await resp.json();
    if (data.error) { alert("写入失败："+data.error); return; }
    okEl.textContent = `✅ 已标注 ${data.marked} 行`;

  } finally {
    btn.disabled = false;
    btn.textContent = "写回飞书";
  }
}

const STRICT_ANALYSIS_RULES = `你是一名严谨的数据分析师，撰写本报告时必须严格遵守以下规则：

【硬性约束】
1. 全文禁止出现以下及类似表述："总体良好"、"稳步提升"、"有待加强"、"持续优化"、"前景可观"、"建议关注"、"存在不足"等任何无实质信息的空话、客套话、口号式语句。
2. 所有观点、结论、判断、预测、原因分析，必须绑定具体数据、数值、比例、差值；没有数据支撑的内容不写。
3. 语言务实精炼，统一使用分点格式，逻辑分层清晰。
4. 完成后自我复核：删除模糊描述、冗余文字、通用模板话术。如发现某条结论缺乏数据支撑，直接删除该条而不是用空话填充。
5. 如果样本量很小（如少于5位博主），必须在相应结论处注明样本量，并说明该结论的可信度受限，不得用小样本得出绝对化结论。
6. 数据本身没有体现某种规律时，如实写"现有数据未显示明显规律"，不强行主观推演。

【报告结构，按顺序输出，缺少对应数据的模块可省略但需说明原因】
一、数据概况与现状复盘
- 列出全部核心指标的数值：样本量、各分类的数量及占比、最大值/最小值/平均值
- 标注异常数据点、明显偏离整体的项（具体到博主名或数值）

二、现存问题与根因拆解
- 结合数据定位具体问题，逐条说明该问题对应的数据表现（如"X类博主占比仅Y%，但Z类占比达W%"）
- 区分表层现象（数据本身）与深层诱因（为什么会这样，结合建联渠道/话术/选号标准等可能原因）

三、趋势预测（如数据量不足以支撑预测，本节写明"当前样本量N，不足以做出有统计意义的预测"并跳过）
- 短期/中期两个周期，给出具体预估数值或区间，并写明推导依据
- 常规/乐观/风险三种情景，分别给出对应数据结果

四、风险识别
- 结合数据规律指出可能的风险点，标注触发条件
- 仅在有数据依据时列出，不凑数

五、可执行建议
- 每条建议必须包含：执行动作（做什么）、适配对象（针对哪类博主/哪个环节）、预期效果（对应哪个指标会改善）
- 建议数量与数据支撑强度匹配，不为凑数量写空泛建议

【前提假设与局限性说明】（报告末尾单独列出）
- 本次分析基于的样本量、统计范围
- 哪些外部变量可能改变结论（如博主公开数据更新滞后、人工标注误差等）`;

async function anFetchOne(row, idx) {
  const container = document.getElementById('an-profiles');
  const card = document.createElement('div');
  card.id = 'an-card-' + idx;
  card.style.cssText = 'border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surf)';

  // 判断平台
  const link = row.link || '';
  let platform = '未知';
  if (link.includes('xhslink') || link.includes('xiaohongshu') || link.includes('xhs')) platform = '小红书';
  else if (link.includes('douyin') || link.includes('tiktok') || link.includes('v.dou')) platform = '抖音';
  else if (link.includes('bilibili')) platform = 'B站';
  else if (link.includes('weibo')) platform = '微博';

  card.innerHTML = `
    <div style="padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--surf2)">
      <div id="an-dot-${idx}" style="width:7px;height:7px;border-radius:50%;background:#f5a623;flex-shrink:0"></div>
      <span style="font-size:12px;font-weight:600;color:var(--text)">${row.name||'—'}</span>
      <span style="font-size:11px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${platform} · ${link}</span>
      <span style="font-size:11px;color:var(--green);background:rgba(67,217,164,.1);border:1px solid rgba(67,217,164,.25);padding:1px 7px;border-radius:4px;white-space:nowrap">已成功</span>
    </div>
    <div id="an-body-${idx}" style="padding:10px 14px;font-size:12px;color:var(--muted);font-style:italic">搜索中...</div>`;
  container.appendChild(card);

  try {
    // Step 1: 搜索博主信息
    const searchResp = await fetch(window.location.origin + '/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: `${row.name} ${platform} 博主 内容 粉丝` })
    });
    const searchData = await searchResp.json();
    const searchResult = searchData.text || '';

    // Step 2: DeepSeek 分析
    const data = await callClaude([{
      role: 'user',
      content: `根据以下信息，分析该博主的公开信息，严格按JSON返回，不要其他文字：
{"platform":"${platform}","name":"${row.name}","followers":"${row.followers||'未知'}万","content_type":"内容类型（1-3个标签，逗号分隔）","style":"内容风格（简洁2-4字）","audience":"目标受众","blogger_type":"博主类型（如：AI科技、生活方式、母婴、美食、知识分享等）"}

搜索结果：${searchResult}
博主名：${row.name}，平台：${platform}，粉丝量：${row.followers||'未知'}万`
    }], 400);

    const raw = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
    let profile = {};
    try {
      const match = raw.match(/\{[\s\S]*\}/);
      profile = match ? JSON.parse(match[0]) : {};
    } catch { profile = {}; }

    profile._name = row.name;
    profile._link = link;
    profile._followers_raw = row.followers;
    if (!profile.platform) profile.platform = platform;
    if (!profile.followers) profile.followers = (row.followers||'—') + '万';
    analysisProfiles.push(profile);

    document.getElementById('an-dot-' + idx).style.background = '#22c55e';
    const body = document.getElementById('an-body-' + idx);
    body.style.fontStyle = 'normal';
    body.style.color = 'var(--text)';
    body.innerHTML = `
      <span style="color:var(--muted)">粉丝：</span>${profile.followers||'—'} &nbsp;|&nbsp;
      <span style="color:var(--muted)">内容：</span>${profile.content_type||'—'} &nbsp;|&nbsp;
      <span style="color:var(--muted)">风格：</span>${profile.style||'—'} &nbsp;|&nbsp;
      <span style="color:var(--muted)">类型：</span><b style="color:var(--green)">${profile.blogger_type||'—'}</b>`;
  } catch(e) {
    analysisProfiles.push({ error: e.message, _name: row.name, _link: link, platform });
    document.getElementById('an-dot-' + idx).style.background = '#ef4444';
    document.getElementById('an-body-' + idx).style.color = '#fca5a5';
    document.getElementById('an-body-' + idx).style.fontStyle = 'normal';
    document.getElementById('an-body-' + idx).textContent = '失败：' + e.message;
  }
}

async function anRunAI() {
  const validProfiles = analysisProfiles.filter(p => p._name || p.name);
  if (!validProfiles.length) { anSetStatus('没有可分析的博主数据', '#fca5a5'); return; }

  const aiBtn = document.getElementById('an-ai-btn');
  if (aiBtn) aiBtn.disabled = true;
  anSetStatus('✨ AI 正在深度分析，请稍候（约30秒）...', 'var(--blue)');
  const profileSummary = validProfiles.map((p,i) =>
    `博主${i+1}：博主名=${p.name||p._name}，平台=${p.platform}，粉丝=${p.followers}，内容类型=${p.content_type||'—'}，风格=${p.style||'—'}，目标受众=${p.audience||'—'}，博主类型=${p.blogger_type||'—'}`
  ).join('\n');

  // 预计算统计数据，强制AI基于这些数字写报告，而不是自己编
  const statsLines = [];
  statsLines.push(`样本量：${validProfiles.length} 位`);
  const platformCount = {};
  validProfiles.forEach(p => { const k = p.platform || '未知'; platformCount[k] = (platformCount[k]||0) + 1; });
  statsLines.push('平台分布：' + Object.entries(platformCount).map(([k,v]) => `${k} ${v}位(${(v/validProfiles.length*100).toFixed(1)}%)`).join('、'));
  const typeCount = {};
  validProfiles.forEach(p => { const k = p.blogger_type || '未标注'; typeCount[k] = (typeCount[k]||0) + 1; });
  statsLines.push('博主类型分布：' + Object.entries(typeCount).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `${k} ${v}位(${(v/validProfiles.length*100).toFixed(1)}%)`).join('、'));
  const fansNums = validProfiles.map(p => {
    const raw = (p.followers || p._followers_raw || '').toString();
    const m = raw.match(/[\d.]+/);
    return m ? parseFloat(m[0]) : null;
  }).filter(n => n !== null);
  if (fansNums.length) {
    const max = Math.max(...fansNums), min = Math.min(...fansNums);
    const avg = fansNums.reduce((a,b)=>a+b,0) / fansNums.length;
    statsLines.push(`粉丝量（万）：最大值 ${max}，最小值 ${min}，平均值 ${avg.toFixed(1)}，有效样本 ${fansNums.length}/${validProfiles.length}`);
  }
  const statsBlock = statsLines.join('\n');

  try {
    const data = await callClaude(
      [{ role: 'user', content: `${STRICT_ANALYSIS_RULES}

【本次分析对象】我们团队建联成功（引导到私域）的博主，全部历史数据。

【预计算统计数据，报告中的数值描述必须与下方一致，不要重新估算】
${statsBlock}

【博主明细】
${profileSummary}

请按上述报告结构输出本次分析报告。报告主题是"成功博主画像与建联方向建议"，第一节"数据概况"基于上方预计算统计数据展开，不要重复计算或编造新数字；第五节"可执行建议"聚焦：优先锁定哪类博主、避免浪费资源在哪类博主、话术切入点建议、下一步行动计划。` }],
      2200
    );
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
    anSetStatus('✅ 分析完成，正在跳转报告...', 'var(--green)');
    // 存到全局供报告Tab展示和导出
    window._anReportText = text;
    const periodLabels = {all:'全部历史',today:'今天',yesterday:'昨天',week:'本周',last_week:'上周',month:'本月',last_month:'上月'};
    window._anReportMeta = {
      period: periodLabels[anCurrentPeriod] || anCurrentPeriod,
      count: validProfiles.length,
      time: new Date().toLocaleString('zh-CN',{hour12:false})
    };

  } catch(e) {

function mdToHtml(md) {
  // 转义 HTML 特殊字符
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const lines = md.split('\n');
  let html = '';
  let inList = false;

  const closeList = () => { if (inList) { html += '</div>'; inList = false; } };

  for (let i = 0; i < lines.length; i++) {
    let l = lines[i];

    // H1 # 标题
    if (/^#\s+/.test(l)) {
      closeList();
      html += `<div style="font-size:16px;font-weight:800;color:var(--text);margin:20px 0 10px">${esc(l.replace(/^#+\s*/,''))}</div>`;
      continue;
    }
    // H2 ## 标题 → 卡片标题
    if (/^##\s+/.test(l)) {
      closeList();
      const t = l.replace(/^#+\s*/,'');
      const icons = {'一、成功博主画像':'👤','二、建联方向建议':'🎯','成功博主画像':'👤','建联方向建议':'🎯'};
      const icon = Object.entries(icons).find(([k])=>t.includes(k))?.[1] || '📌';
      html += `</div><div style="background:var(--surf);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px">
        <div style="padding:11px 18px;background:var(--surf2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
          <span style="font-size:15px">${icon}</span>
          <span style="font-size:13px;font-weight:700;color:var(--text)">${esc(t)}</span>
        </div>
        <div style="padding:14px 18px;font-size:13px">`;
      continue;
    }
    // H3 ### 小标题
    if (/^###\s+/.test(l)) {
      closeList();
      html += `<div style="font-size:12px;font-weight:700;color:var(--text);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px;opacity:.7">${esc(l.replace(/^#+\s*/,''))}</div>`;
      continue;
    }
    // 列表项 - 或 * 或数字.
    if (/^[-*]\s+/.test(l) || /^\d+\.\s+/.test(l)) {
      if (!inList) { html += '<div style="display:flex;flex-direction:column;gap:2px;margin:4px 0">'; inList = true; }
      let text = l.replace(/^[-*\d.]+\s+/,'');
      // 行内加粗 **text**
      text = esc(text).replace(/\*\*(.*?)\*\*/g,'<b style="color:var(--text)">$1</b>');
      html += `<div style="display:flex;gap:8px;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.03)">
        <span style="color:var(--green);flex-shrink:0;margin-top:1px">▸</span>
        <span style="color:var(--text);line-height:1.65">${text}</span>
      </div>`;
      continue;
    }
    // 分隔线
    if (/^---+$/.test(l.trim())) { closeList(); html += '<div style="height:1px;background:var(--border);margin:12px 0"></div>'; continue; }
    // 空行
    if (!l.trim()) { closeList(); html += '<div style="height:6px"></div>'; continue; }
    // 普通段落
    closeList();
    let text = esc(l).replace(/\*\*(.*?)\*\*/g,'<b style="color:var(--text)">$1</b>');
    html += `<div style="color:var(--muted2);line-height:1.75;margin:3px 0">${text}</div>`;
  }
  closeList();
  return html;
}

// 生成时间段选项
function getPeriodicOptions() {
  const now = new Date();
  const options = [];

  // 过去6个月
  for (let i = 0; i < 6; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const year = d.getFullYear();
    const month = d.getMonth() + 1;
    const monthKey = `${year}-${String(month).padStart(2,'0')}`;
    const monthLabel = `${year}年${month}月`;

    // 整月
    options.push({ key: monthKey, label: monthLabel, type: 'month', year, month });

    // 月内4个阶段
    const phases = [
      { key: `${monthKey}-p1`, label: `${monthLabel} 第1阶段（1-7日）`,  start: 1,  end: 7  },
      { key: `${monthKey}-p2`, label: `${monthLabel} 第2阶段（8-14日）`, start: 8,  end: 14 },
      { key: `${monthKey}-p3`, label: `${monthLabel} 第3阶段（15-21日）`,start: 15, end: 21 },
      { key: `${monthKey}-p4`, label: `${monthLabel} 第4阶段（22日-月底）`,start: 22, end: 31 },
    ];
    phases.forEach(p => options.push({ ...p, type: 'phase', year, month }));
  }
  return options;
}

// 根据时间段 key 筛选博主
function filterByPeriodKey(key) {
  const parts = key.split('-');
  const year  = parseInt(parts[0]);
  const month = parseInt(parts[1]);
  const phase = parts[2]; // p1/p2/p3/p4 或 undefined

  return ALL_ROWS.filter(r => {
    if (!r.record_date || r.status !== '引导到私域了') return false;
    const d = new Date(r.record_date);
    if (d.getFullYear() !== year || d.getMonth()+1 !== month) return false;
    if (!phase) return true; // 整月
    const day = d.getDate();
    if (phase === 'p1') return day >= 1  && day <= 7;
    if (phase === 'p2') return day >= 8  && day <= 14;
    if (phase === 'p3') return day >= 15 && day <= 21;
    if (phase === 'p4') return day >= 22;
    return false;
  });
}

// 计算上一个相邻周期的key（用于环比），月份没有阶段细分时按月环比
function getPreviousPeriodKey(key) {
  const parts = key.split('-');
  const year  = parseInt(parts[0]);
  const month = parseInt(parts[1]);
  const phase = parts[2];
  if (phase) {
    const phaseOrder = ['p1','p2','p3','p4'];
    const idx = phaseOrder.indexOf(phase);
    if (idx > 0) return `${year}-${String(month).padStart(2,'0')}-${phaseOrder[idx-1]}`;
    // p1 的上一阶段是上个月的 p4
    const prevDate = new Date(year, month - 2, 1); // month是1-based, 这里取上个月
    return `${prevDate.getFullYear()}-${String(prevDate.getMonth()+1).padStart(2,'0')}-p4`;
  }
  // 整月：上一个月
  const prevDate = new Date(year, month - 2, 1);
  return `${prevDate.getFullYear()}-${String(prevDate.getMonth()+1).padStart(2,'0')}`;
}

async function periodicRun() {
  const key = document.getElementById('period-select').value;
  if (!key) { alert('请先选择时间段'); return; }
  if (periodicRunning) return;

  const rows = filterByPeriodKey(key);
  if (!rows.length) {
    document.getElementById('period-status').textContent = '⚠ 该时间段没有建联成功的博主';
    return;
  }

  periodicRunning = true;
  const btn = document.getElementById('period-run-btn');
  btn.disabled = true;
  const statusEl = document.getElementById('period-status');
  const progWrap = document.getElementById('period-prog-wrap');
  const prog = document.getElementById('period-prog');
  progWrap.style.display = 'block';

  // Step 1: 逐个搜索博主信息
  const profiles = [];
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    statusEl.textContent = `搜索中 ${i+1}/${rows.length}：${row.name||'—'}`;
    prog.style.width = Math.round((i/rows.length)*60) + '%';

    try {
      const link = row.link || '';
      let platform = '未知';
      if (link.includes('xhslink')||link.includes('xiaohongshu')) platform = '小红书';
      else if (link.includes('douyin')||link.includes('v.dou')) platform = '抖音';
      else if (link.includes('bilibili')) platform = 'B站';

      const searchResp = await fetch(window.location.origin + '/api/search', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({query: `${row.name} ${platform} 博主 内容 粉丝`})
      });
      const sd = await searchResp.json();
      profiles.push({name: row.name, platform, followers: row.followers, searchText: sd.text||''});
    } catch(e) {
      profiles.push({name: row.name, platform: '未知', followers: row.followers, searchText: ''});
    }
  }

  // Step 2: AI 生成报告
  statusEl.textContent = '✨ AI 正在生成分析报告...';
  prog.style.width = '80%';

  const optionEl = document.querySelector(`#period-select option[value="${key}"]`);
  const label = optionEl ? optionEl.textContent : key;

  const summary = profiles.map((p,i) => ['博主'+(i+1), p.name, p.platform, (p.followers||'未知')+'万', p.searchText.slice(0,200)].join(',')).join('\n');

  // 预计算本阶段统计数据
  const platformCount = {};
  profiles.forEach(p => { const k = p.platform || '未知'; platformCount[k] = (platformCount[k]||0) + 1; });
  const platformLine = '平台分布：' + Object.entries(platformCount).map(([k,v]) => `${k} ${v}位(${(v/profiles.length*100).toFixed(1)}%)`).join('、');

  const fansNums = profiles.map(p => {
    const raw = (p.followers || '').toString();
    const m = raw.match(/[\d.]+/);
    return m ? parseFloat(m[0]) : null;
  }).filter(n => n !== null);
  let fansLine = '粉丝量数据：本阶段无有效粉丝量记录';
  if (fansNums.length) {
    const max = Math.max(...fansNums), min = Math.min(...fansNums);
    const avg = fansNums.reduce((a,b)=>a+b,0) / fansNums.length;
    fansLine = `粉丝量（万）：最大值 ${max}，最小值 ${min}，平均值 ${avg.toFixed(1)}，有效样本 ${fansNums.length}/${profiles.length}`;
  }

  // 上一阶段环比数据（如果已分析过）
  let prevCompareLine = '上一阶段对比：无上一阶段已分析数据，本次不做环比';
  try {
    const prevKey = getPreviousPeriodKey(key);
    const prevRows = filterByPeriodKey(prevKey);
    if (prevRows.length || periodicReports[prevKey]) {
      const prevCount = periodicReports[prevKey]?.blogger_count ?? prevRows.length;
      const diff = profiles.length - prevCount;
      const pct = prevCount > 0 ? (diff / prevCount * 100).toFixed(1) : 'N/A';
      prevCompareLine = `上一阶段对比：上一阶段建联成功 ${prevCount} 位，本阶段 ${profiles.length} 位，差值 ${diff>=0?'+':''}${diff}（${pct === 'N/A' ? '上一阶段为0，无法计算比例' : pct + '%'}）`;
    }
  } catch(e) {}

  const statsBlock = [`样本量：${profiles.length} 位`, platformLine, fansLine, prevCompareLine].join('\n');

  try {
    const resp = await fetch(window.location.origin + '/api/analyze', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        prompt: `${STRICT_ANALYSIS_RULES}

【本次分析对象】"${label}"期间建联成功（引导到私域）的博主。

【预计算统计数据，报告中的数值描述必须与下方一致，不要重新估算】
${statsBlock}

【博主明细（格式：序号,博主名,平台,粉丝量,公开信息摘要）】
${summary}

请按上述报告结构输出本次阶段分析报告。第一节"数据概况"基于上方预计算统计数据展开，若"上一阶段对比"显示有环比数据，须在第一节中引用该差值；第三节"趋势预测"如本阶段样本量小于5，按规则说明样本不足并跳过预测；第五节"可执行建议"聚焦本阶段优先锁定的博主类型、应避免的方向、话术切入点、下阶段行动计划。`,
        max_tokens: 2200
      })
    });
    const data = await resp.json();
    const text = data.text || '';

    // 保存到数据库
    await fetch(window.location.origin + '/api/reports/save', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({period_key: key, period_label: label, report_text: text, blogger_count: profiles.length})
    });

    periodicReports[key] = {period_key: key, period_label: label, report_text: text, blogger_count: profiles.length};
    prog.style.width = '100%';
    statusEl.textContent = `✅ 分析完成，已保存`;
    periodicShowReport(periodicReports[key]);
    periodicLoadList(); // 刷新列表
    btn.textContent = '✨ 重新分析';
  } catch(e) {
    statusEl.textContent = '❌ 分析失败：' + e.message;
  }

  periodicRunning = false;
  btn.disabled = false;
  setTimeout(() => { progWrap.style.display = 'none'; prog.style.width = '0'; }, 2000);
}

function periodicExport(key) {

  const md = `# ${data.period_label} 建联分析报告

分析博主：${data.blogger_count} 位

${data.report_text}`;

async function periodicImport(event, input) {
  const wrap = document.getElementById('period-report-wrap');
  const key   = wrap ? wrap.dataset.periodKey   : '';
  const label = wrap ? wrap.dataset.periodLabel : '';
  const file = event.target.files[0];
  if (!file) return;
  const text = await file.text();
  // 去掉文件头部的标题行
  const lines = text.split('\n');
  const bodyLines = lines.filter((l,i) => !(i < 4 && (l.startsWith('#') || l.startsWith('分析博主') || l === '---')));
  const reportText = bodyLines.join('\n').trim();

  const statusEl = document.getElementById('period-status');
  try {
    await fetch(window.location.origin + '/api/reports/save', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({period_key: key, period_label: label, report_text: reportText, blogger_count: 0})
    });
    periodicReports[key] = {period_key: key, period_label: label, report_text: reportText, blogger_count: 0};
    periodicShowReport(periodicReports[key]);
    periodicLoadList();
    if (statusEl) { statusEl.textContent = '✅ 导入成功'; statusEl.style.color = 'var(--green)'; }
  } catch(e) {
    if (statusEl) { statusEl.textContent = '❌ 导入失败：' + e.message; statusEl.style.color = '#fca5a5'; }
  }
}

let rankPendingFiles = [];

function rankHandleDrop(e) {
  e.preventDefault();
  document.getElementById('rank-drop').style.borderColor = 'var(--border)';
  rankHandleFiles(e.dataTransfer.files);
}

function rankHandleFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    rankPendingFiles.push(f);
    const reader = new FileReader();
    reader.onload = ev => {
      const previews = document.getElementById('rank-previews');
      if (!previews) return;
      const idx = rankPendingFiles.length - 1;
      const div = document.createElement('div');
      div.id = 'rank-preview-' + idx;
      div.style.cssText = 'position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;border:1px solid var(--border)';
      div.innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover">
        <button onclick="rankRemoveFile(${idx})" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:4px;width:18px;height:18px;font-size:11px;cursor:pointer">×</button>`;
      previews.appendChild(div);
    };
    reader.readAsDataURL(f);
  }
  const btn = document.getElementById('rank-run-btn');
  if (btn) btn.disabled = rankPendingFiles.length === 0;
}

function rankRemoveFile(idx) {
  rankPendingFiles.splice(idx, 1);
  const el = document.getElementById('rank-preview-' + idx);
  if (el) el.remove();
  const btn = document.getElementById('rank-run-btn');
  if (btn) btn.disabled = rankPendingFiles.length === 0;
}

async function rankRun() {
  if (!rankPendingFiles.length) return;
  const btn = document.getElementById('rank-run-btn');
  btn.disabled = true;
  const statusEl = document.getElementById('rank-status');
  const progWrap = document.getElementById('rank-prog-wrap');
  const prog = document.getElementById('rank-prog');
  progWrap.style.display = 'block';

  rankProfiles = [];

  // Step 1: 把所有截图转成 base64
  if (statusEl) statusEl.textContent = '处理截图中...';
  const allB64s = [];
  for (let i = 0; i < rankPendingFiles.length; i++) {
    const f = rankPendingFiles[i];
    const b64 = await new Promise(res => {
      const img = new Image();
      const url = URL.createObjectURL(f);
      img.onload = () => {
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
      };
      img.src = url;
    });
    allB64s.push(b64);
  }
  prog.style.width = '30%';

  // Step 2: 一次性发送所有截图，让AI识别并自动合并同一博主
  if (statusEl) statusEl.textContent = `AI 识别 ${allB64s.length} 张截图，自动合并同一博主...`;
  try {
    const prompt = `以上是${allB64s.length}张截图，可能是博主主页截图或建联成功的聊天记录截图，可能有多张属于同一博主（头像相同即为同一人）。

识别规则：
- 如果是主页截图：读取页面上显示的博主昵称、粉丝数、简介等
- 如果是聊天记录截图：只看屏幕左侧的消息（对方/博主发的），读取左侧气泡旁边的头像和昵称；忽略右侧消息（那是我自己发的）
- 头像相同的多张截图属于同一博主，合并为一条

严格按JSON数组返回，不要其他文字：
[{"name":"博主昵称","account":"账号ID（如有）","followers":"粉丝数（如有，否则空）","content_type":"内容类型（如有，否则空）","platform":"平台（小红书/抖音/B站等）","bio":"简介或备注（如有）","merged_count":合并了几张截图}]`;
    const resp = await fetch(window.location.origin + '/api/vision', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ images: allB64s, prompt })
    });
    const data = await resp.json();
    const rawText = data.raw || (data.result ? JSON.stringify(data.result) : '');
    const text = data.result ? JSON.stringify(data.result) : rawText;
    const match = text.match(/\[[\s\S]*\]/);
    const profiles = data.result ? data.result : (match ? JSON.parse(match[0]) : []);

    for (const profile of profiles) {
      const name = profile.name || '';
      const existing = ALL_ROWS.filter(r =>
        r.name && name && (r.name.includes(name) || name.includes(r.name))
      );
      profile._existing = existing;
      profile._status = existing.length ? existing[existing.length-1].status : '未找到记录';
      profile._followers_db = existing.length ? existing[existing.length-1].followers : null;
      rankProfiles.push(profile);
    }
  } catch(e) {
    rankProfiles.push({ name: '识别失败', error: e.message, _existing: [], _status: '未找到记录' });
  }
  prog.style.width = '50%';

  // Step 2.5: 显示识别结果，让用户确认/删除
  if (statusEl) statusEl.textContent = `✅ 识别完成，共 ${rankProfiles.length} 位博主，确认后点排序`;
  prog.style.width = '55%';
  rankShowPreview();
  btn.disabled = false;
  return; // 先停在这里，等用户确认
}

function rankShowPreview() {
  const wrap = document.getElementById('rank-result');
  if (!wrap) return;
  wrap.style.display = 'block';

  const cards = rankProfiles.map((p, idx) => `
    <div id="rank-card-${idx}" style="background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px">${p.name||'未识别'} ${p.merged_count>1?'<span style="font-size:11px;color:var(--green);background:rgba(67,217,164,.1);padding:1px 6px;border-radius:4px">合并'+p.merged_count+'张</span>':''}</div>
        <div style="font-size:12px;color:var(--muted)">${p.platform||''} · 粉丝：${p.followers||'未知'} · ${p.content_type||''}</div>
        ${p.bio?'<div style="font-size:11px;color:var(--muted);margin-top:4px">'+p.bio+'</div>':''}
        ${p.error?'<div style="font-size:11px;color:#fca5a5">⚠ '+p.error+'</div>':''}
      </div>
      <button onclick="rankDeleteProfile(${idx})" style="background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;white-space:nowrap">🗑 删除</button>
    </div>`).join('');

  wrap.innerHTML = `
    <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px">识别结果（共 ${rankProfiles.length} 位博主）— 确认无误后点排序</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">${cards}</div>
    <button class="dup-btn dup-btn-primary" onclick="rankDoSort()" style="width:100%;background:var(--green)">✨ 确认并生成优先级排序</button>`;
}

function rankDeleteProfile(idx) {
  rankProfiles.splice(idx, 1);
  rankShowPreview();
}

async function rankDoSort() {
  const btn = document.getElementById('rank-run-btn');
  if (btn) btn.disabled = true;
  const statusEl = document.getElementById('rank-status');
  const progWrap = document.getElementById('rank-prog-wrap');
  const prog = document.getElementById('rank-prog');
  if (progWrap) progWrap.style.display = 'block';

  // Step 3: AI 综合排序
  if (statusEl) statusEl.textContent = '✨ AI 综合分析，生成优先级排序...';
  prog.style.width = '70%';

  // 统计历史成功规律
  const successRows = ALL_ROWS.filter(r => r.status === '引导到私域了');
  const successFollowers = successRows.map(r => parseFloat(r.followers)||0).filter(v=>v>0);
  const avgSuccess = successFollowers.length ? (successFollowers.reduce((a,b)=>a+b,0)/successFollowers.length).toFixed(1) : '未知';

  const profileSummary = rankProfiles.map((p, i) =>
    '博主'+(i+1)+'：'+p.name+'，粉丝：'+(p.followers||'未知')+'，内容类型：'+(p.content_type||'未知')+'，简介：'+(p.bio||'无')+'，历史状态：'+p._status
  ).join('\n');

  try {
    const resp = await fetch(window.location.origin + '/api/analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: `你是一位新媒体建联专家。以下是待建联博主的信息：

${profileSummary}

历史建联成功博主平均粉丝量：${avgSuccess}万，共${successRows.length}位成功案例。

请根据博主特征和历史成功规律，将这些博主分为三个优先级，严格按以下JSON格式返回，不要其他文字：
{
  "high": [{"name":"博主名","reason":"建议理由（1-2句）"}],
  "medium": [{"name":"博主名","reason":"建议理由（1-2句）"}],
  "low": [{"name":"博主名","reason":"建议理由（1-2句）"}],
  "strategy": "整体建联策略建议（2-3句）"
}

判断依据：粉丝量是否匹配、内容类型是否契合、是否有历史互动记录、建联成功率预估。`,
        max_tokens: 1000
      })
    });
    const data = await resp.json();
    const text = data.text || '';
    const match = text.match(/\{[\s\S]*\}/);
    rankResult = match ? JSON.parse(match[0]) : null;

    prog.style.width = '100%';
    if (statusEl) { statusEl.textContent = '✅ 排序完成，正在保存...'; statusEl.style.color = 'var(--green)'; }
    rankShowResult();

    // 保存到数据库
    const reportKey = 'rank-' + Date.now();
    try {
      await fetch(window.location.origin + '/api/rank/save', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ report_key: reportKey, report_data: rankResult, blogger_count: rankProfiles.length })
      });
      if (statusEl) statusEl.textContent = '✅ 排序完成，已保存';
      rankLoadHistory();
    } catch(e) {
      if (statusEl) statusEl.textContent = '✅ 排序完成（保存失败：' + e.message + '）';
    }

    rankPendingFiles = [];
    const previews = document.getElementById('rank-previews');
    if (previews) previews.innerHTML = '';
  } catch(e) {
    if (statusEl) { statusEl.textContent = '❌ 排序失败：' + e.message; statusEl.style.color = '#fca5a5'; }
  }

  btn.disabled = false;
  setTimeout(() => { progWrap.style.display = 'none'; prog.style.width = '0'; }, 2000);
}

function rankShowResult() {
  const wrap = document.getElementById('rank-result');
  if (!wrap || !rankResult) return;
  wrap.style.display = 'block';

  const levels = [
    { key: 'high',   label: '🔴 高优先级', color: '#ef4444', bg: 'rgba(239,68,68,.08)',   border: 'rgba(239,68,68,.3)',   hdr: 'rgba(239,68,68,.15)' },
    { key: 'medium', label: '🟡 中优先级', color: '#f59e0b', bg: 'rgba(245,158,11,.08)',  border: 'rgba(245,158,11,.3)',  hdr: 'rgba(245,158,11,.15)' },
    { key: 'low',    label: '🟢 低优先级', color: '#22c55e', bg: 'rgba(34,197,94,.08)',   border: 'rgba(34,197,94,.3)',   hdr: 'rgba(34,197,94,.15)' },
  ];

  // 三列看板
  const cols = levels.map(lv => {
    const items = (rankResult[lv.key] || []);
    const cards = items.map(it => `
      <div style="background:var(--surf);border:1px solid ${lv.border};border-radius:10px;padding:12px 14px;margin-bottom:8px">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px">${it.name}</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.6">${it.reason}</div>
      </div>`).join('');
    return `
      <div style="flex:1;min-width:200px">
        <div style="background:${lv.hdr};border:1px solid ${lv.border};border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:13px;font-weight:700;color:${lv.color}">${lv.label}</span>
          <span style="font-size:11px;color:${lv.color};background:${lv.bg};padding:2px 8px;border-radius:4px">${items.length}位</span>
        </div>
        ${cards || '<div style="font-size:12px;color:var(--muted);text-align:center;padding:16px">暂无</div>'}
      </div>`;
  }).join('');

  const strategy = rankResult.strategy ? `
    <div style="background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px">📋 整体建联策略</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.7">${rankResult.strategy}</div>
    </div>` : '';

  wrap.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:14px;font-weight:600;color:var(--text)">🎯 建联优先级排序结果</div>
      <button class="dup-btn dup-btn-mark" onclick="rankExport()" style="font-size:12px">⬇ 导出</button>
    </div>
    ${strategy}
    <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">${cols}</div>`;
}

function rankExport() {
  if (!rankResult) return;
  let md = '# 建联优先级排序报告\n\n';
  if (rankResult.strategy) md += `## 整体策略
${rankResult.strategy}

`;
  ['high','medium','low'].forEach(k => {
    const label = k==='high'?'高优先级':k==='medium'?'中优先级':'低优先级';
    const items = rankResult[k] || [];
    if (items.length) {
      md += `## ${label}
`;
      items.forEach(it => { md += '- **' + it.name + '**：' + it.reason + '\n'; });
      md += '\n';
    }
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], {type:'text/markdown'}));
  a.download = '建联优先级排序.md'; a.click();
}

  rankProfiles = []; rankResult = null;

}

let chatPendingFiles = [];

function chatHandleDrop(event) {
  event.preventDefault();
  chatHandleFiles(event.dataTransfer.files);
}

function chatHandleFiles(files) {
  Array.from(files).forEach((f, idx) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      chatPendingFiles.push({ file: f, b64: e.target.result.split(',')[1], name: f.name });
      const previews = document.getElementById('chat-previews');
      if (previews) {
        const div = document.createElement('div');
        div.style.cssText = 'position:relative;display:inline-block';
        div.innerHTML = `<img src="${e.target.result}" style="width:70px;height:70px;object-fit:cover;border-radius:6px">
          <button onclick="chatRemoveFile(${chatPendingFiles.length-1})" style="position:absolute;top:-4px;right:-4px;background:#ef4444;border:none;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;padding:0;line-height:18px">×</button>`;
        previews.appendChild(div);
      }
    };
    reader.readAsDataURL(f);
  });
  const btn = document.getElementById('chat-run-btn');
  if (btn) btn.disabled = chatPendingFiles.length === 0;
}

function chatRemoveFile(idx) {
  chatPendingFiles.splice(idx, 1);
  renderOcrChatContent();
}

async function chatRun() {
  if (!chatPendingFiles.length) return;
  const btn = document.getElementById('chat-run-btn');
  if (btn) btn.disabled = true;
  const statusEl = document.getElementById('chat-status');
  if (statusEl) statusEl.textContent = '识别中，请稍候...';

  const allB64s = chatPendingFiles.map(f => f.b64);

  try {
    const messages = [
      {
        role: 'user',
        content: [
          ...allB64s.map(b64 => ({ type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + b64 } })),
          { type: 'text', text: `以上是${allB64s.length}张与博主的聊天截图。请分析截图中我方（右侧气泡）的消息，提取有效的建联话术。
按以下JSON数组格式返回，不要其他文字：
[{"type":"话术类型(开场白/拒绝处理/价值塑造/跟进/成交/其他)","script":"具体话术内容，保持原文","platform":"平台(小红书/抖音/微信等)","note":"话术亮点或使用建议"}]
每条话术单独一个对象。如果有多条有效话术，全部提取。` }
        ]
      }
    ];

    const resp = await fetch(window.location.origin + '/api/vision', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        images: allB64s,
        prompt: `以上是${allB64s.length}张与博主的聊天截图。请分析截图中我方（右侧气泡）的消息，提取有效的建联话术。
按以下JSON数组格式返回，不要其他文字：
[{"type":"话术类型(开场白/拒绝处理/价值塑造/跟进/成交/其他)","script":"具体话术内容，保持原文","platform":"平台(小红书/抖音/微信等)","note":"话术亮点或使用建议"}]
每条话术单独一个对象。如果有多条有效话术，全部提取。`
      })
    });
    const data = await resp.json();
    const text = data.result ? JSON.stringify(data.result) : (data.raw || '');
    const match = text.match(/\[[\s\S]*\]/);
    if (data.result || match) {
      const parsed = data.result || JSON.parse(match[0]);
      const now = new Date().toLocaleDateString('zh-CN');
      parsed.forEach(r => { r.date = now; chatScriptRows.push(r); });
      await saveChatScripts();
      // 保存话术到数据库（带成员姓名）
      try {
        await fetch(window.location.origin + '/api/tactics', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ tactics: parsed.map(t => ({
            category: t.type || t.category || '其他',
            content: t.script || t.content || '',
            note: t.note || '',
            source: t.platform || '',
            member: ocrCurrentMember || ''
          }))})
        });
      } catch(e) { console.warn('话术保存失败:', e); }
      if (statusEl) statusEl.textContent = `✅ 提取完成，新增 ${parsed.length} 条话术，已保存到话术库`;
    } else {
      if (statusEl) statusEl.textContent = '⚠️ 未能识别有效话术，请检查截图';
    }
  } catch(e) {
    if (statusEl) statusEl.textContent = '❌ 识别失败：' + e.message;
  }

  chatPendingFiles = [];
  if (btn) btn.disabled = true;
  renderOcrChatContent();
}

async function saveChatScripts() {
  try {
    localStorage.setItem('chat_scripts', JSON.stringify(chatScriptRows));
  } catch(e) {}
  // Also save to supabase if table exists
  try {
    await fetch(`${window.location.origin}/api/tactics`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(chatScriptRows.map(r => ({ type: r.type, script: r.script, platform: r.platform, note: r.note, date: r.date })))
    });
  } catch(e) {}
}

async function loadChatScripts() {
  try {
    const resp = await fetch(`${window.location.origin}/api/tactics`);
    if (resp.ok) {
      const rows = await resp.json();
      if (rows && rows.length) { chatScriptRows = rows; return; }
    }
  } catch(e) {}
  try {
    const stored = localStorage.getItem('chat_scripts');
    if (stored) chatScriptRows = JSON.parse(stored);
  } catch(e) {}
}

function chatDeleteRow(idx) {
  chatScriptRows.splice(idx, 1);
  saveChatScripts();
  renderOcrChatContent();
}

function chatClearResults() {
  if (!confirm('确定清空所有话术？')) return;
  chatScriptRows = [];
  saveChatScripts();
  renderOcrChatContent();
}

function chatExport() {
  if (!chatScriptRows.length) return;
  const header = '类型,话术内容,平台,建议,日期';
  const rows = chatScriptRows.map(r =>
    [r.type, r.script, r.platform, r.note, r.date].map(v => `"${(v||'').replace(/"/g,'""')}"`).join(',')
  );
  const csv = '\uFEFF' + header + '\n' + rows.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = '话术库.csv'; a.click();
}

function chatClear() {
  chatPendingFiles = [];
  renderOcrChatContent();
}

    btn.style.cursor = ready ? 'pointer' : 'not-allowed';
    btn.textContent = ready ? `🔍 开始分析全部 ${n} 位博主` : `🔍 分析适配度（还需 ${10 - n} 张）`;
  }

          <img src="${e.target.result}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;display:block">
          <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);border-radius:0 0 8px 8px;font-size:10px;color:#fff;text-align:center;padding:2px 0">#${idx+1}</div>
          <button onclick="compatRemoveOne(${idx})" style="position:absolute;top:-5px;right:-5px;background:#ef4444;border:none;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;padding:0;line-height:18px;font-weight:700">×</button>`;
        previews.appendChild(div);
      }
      compatUpdateCounter();
    };
    reader.readAsDataURL(f);
  });
}

function compatRemoveOne(idx) {
  compatPendingFiles.splice(idx, 1);
  // 重新渲染预览
  const previews = document.getElementById('compat-previews');
  if (previews) {
    previews.innerHTML = '';
    compatPendingFiles.forEach((f, i) => {
      const div = document.createElement('div');
      div.style.cssText = 'position:relative;display:inline-block';
      div.innerHTML = `
        <img src="${f.src}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;display:block">
        <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);border-radius:0 0 8px 8px;font-size:10px;color:#fff;text-align:center;padding:2px 0">#${i+1}</div>
        <button onclick="compatRemoveOne(${i})" style="position:absolute;top:-5px;right:-5px;background:#ef4444;border:none;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;padding:0;line-height:18px;font-weight:700">×</button>`;
      previews.appendChild(div);
    });
  }
  compatUpdateCounter();
}

async function compatRun() {
  if (compatPendingFiles.length < 10) {
    alert(`请至少上传10张截图，当前只有 ${compatPendingFiles.length} 张`);
    return;
  }
  // 未选成员先弹窗
  if (!ocrCurrentMember) {
    ocrPickMember(() => compatRun());
    return;
  }
  const btn = document.getElementById('compat-run-btn');
  const statusEl = document.getElementById('compat-status');
  const resultEl = document.getElementById('compat-result');
  btn.disabled = true;
  btn.style.opacity = '.6';

  // 统计历史成功博主特征
  const successRows = ALL_ROWS.filter(r => STATUS_SUCCESS.includes(r.status));
  const avgFollowers = successRows.length
    ? (successRows.map(r => parseFloat(r.followers)||0).filter(v=>v>0).reduce((a,b)=>a+b,0) / successRows.length).toFixed(1)
    : '未知';
  const platforms = {};
  successRows.forEach(r => { if(r.platform) platforms[r.platform] = (platforms[r.platform]||0)+1; });
  const topPlatform = Object.entries(platforms).sort((a,b)=>b[1]-a[1]).map(([p,c])=>`${p}(${c}位)`).join('、');

  const total = compatPendingFiles.length;
  const results = [];

  // 逐张分析（每次API调用1张，避免混淆）
  for (let i = 0; i < total; i++) {
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--blue)">分析第 ${i+1}/${total} 位博主中…</span>`;

    const compatPrompt = `这是第${i+1}位博主的主页截图，请分析该博主是否适合宣传以下产品。

【产品信息：飞羽出书 FeatherPub AI】
- 核心定位：AI一站式出书平台，依托国际人工智能科学院出版社资源
- 拳头产品：16666元包含版号的实体书籍出版发行一站式解决方案
- 目标用户：有人生故事、个人回忆录、知识积累想出版的人
- 核心卖点：AI辅助写作，一天写完一本书，human in the loop全程参与
- 适合类型：AI科技、知识分享、个人成长、中老年人群、有故事有经历的博主

历史建联成功数据：总成功${successRows.length}位，平均粉丝${avgFollowers}万，主要平台：${topPlatform||'暂无'}

请严格按JSON格式返回，不要其他文字：
{"name":"博主名","platform":"平台","followers":"粉丝数","content_type":"内容类型","compatibility_score":85,"compatibility_level":"高/中/低","reasons":["原因1"],"risks":["风险1"],"suggestion":"建联建议（1句）"}`;

    try {
      const resp = await fetch(window.location.origin + '/api/vision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ images: [compatPendingFiles[i].b64], prompt: compatPrompt })
      });
      const data = await resp.json();
      const rawText = data.result ? JSON.stringify(data.result[0] || data.result) : (data.raw || '');
      const match = rawText.match(/\{[\s\S]*\}/);
      const result = data.result?.[0] || (match ? JSON.parse(match[0]) : null);
      results.push(result ? { ...result, imgSrc: compatPendingFiles[i].src, idx: i+1 } : { name: `第${i+1}张`, error: '识别失败', imgSrc: compatPendingFiles[i].src, idx: i+1, compatibility_score: 0 });
    } catch(e) {
      results.push({ name: `第${i+1}张`, error: e.message, imgSrc: compatPendingFiles[i].src, idx: i+1, compatibility_score: 0 });
    }

    // 实时渲染已完成的结果
    renderCompatResults(results, total);
  }

  // 全部完成后保存到 Supabase
  const today = new Date().toISOString().slice(0,10);
  const validResults = results.filter(r => !r.error && r.compatibility_score > 0);
  const avgScore = validResults.length
    ? Math.round(validResults.reduce((s,r) => s + (r.compatibility_score||0), 0) / validResults.length)
    : 0;

  try {
    const rows = validResults.map(r => ({
      member_name: ocrCurrentMember || '',
      score_date: today,
      blogger_name: r.name || '',
      compat_score: r.compatibility_score || 0,
      platform: r.platform || '',
      content_type: r.content_type || ''
    }));
    if (rows.length) {
      await fetch(`${SUPABASE_URL}/rest/v1/compat_scores`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON,
          'Authorization': 'Bearer ' + SUPABASE_ANON,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(rows)
      });
      // 更新本地缓存
      if (!window.compatScoreCache) window.compatScoreCache = [];
      window.compatScoreCache.push(...rows);
    }
    const qualifies = avgScore >= 75;
    if (statusEl) statusEl.innerHTML = `✅ 全部分析完成 · 共 ${validResults.length} 位博主 · 总平均适配分 <b style="color:${qualifies?'var(--green)':'var(--gold)'}">${avgScore}分</b>${qualifies?' · 🎯 达标，今日可得绩效加分':' · 需平均≥70分才能得绩效加分'} · 已记录到 ${ocrCurrentMember} 的绩效`;
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `✅ 分析完成，保存失败：${e.message}`;
  }

  btn.disabled = false;
  btn.style.opacity = '1';
}

function renderCompatResults(results, total) {
  const resultEl = document.getElementById('compat-result');
  if (!resultEl) return;

  const validResults = results.filter(r => !r.error && r.compatibility_score > 0);
  const avgScore = validResults.length
    ? Math.round(validResults.reduce((s,r) => s + (r.compatibility_score||0), 0) / validResults.length)
    : 0;
  const pending = total - results.length;

  const avgColor = avgScore >= 75 ? 'var(--green)' : avgScore >= 60 ? 'var(--gold)' : 'var(--red)';

  resultEl.innerHTML = `
    <!-- 总平均分 banner -->
    <div style="background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px">总平均适配分（${validResults.length}/${total} 已完成）</div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-size:40px;font-weight:800;color:${avgColor};line-height:1">${validResults.length ? avgScore : '—'}</span>
          <span style="font-size:14px;color:var(--muted)">/ 100</span>
          ${validResults.length ? `<span style="font-size:13px;font-weight:600;color:${avgColor};background:${avgColor}22;padding:2px 10px;border-radius:6px">${avgScore>=75?'🎯 达标可得绩效加分':avgScore>=60?'中等适配':'适配度偏低'}</span>` : ''}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:12px">
        <div style="background:rgba(67,217,164,.1);border-radius:8px;padding:8px 12px">
          <div style="color:var(--green);font-weight:700;font-size:18px">${validResults.filter(r=>r.compatibility_score>=75).length}</div>
          <div style="color:var(--muted)">高适配</div>
        </div>
        <div style="background:rgba(245,166,35,.1);border-radius:8px;padding:8px 12px">
          <div style="color:var(--gold);font-weight:700;font-size:18px">${validResults.filter(r=>r.compatibility_score>=50&&r.compatibility_score<75).length}</div>
          <div style="color:var(--muted)">中适配</div>
        </div>
        <div style="background:rgba(255,107,107,.1);border-radius:8px;padding:8px 12px">
          <div style="color:var(--red);font-weight:700;font-size:18px">${validResults.filter(r=>r.compatibility_score<50).length}</div>
          <div style="color:var(--muted)">低适配</div>
        </div>
      </div>
    </div>

    <!-- 各博主结果卡片 -->
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px">
      ${results.map(r => {
        if (r.error) return `
          <div style="background:var(--surf2);border:1px solid rgba(255,107,107,.3);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:flex-start">
            <img src="${r.imgSrc}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;flex-shrink:0">
            <div>
              <div style="font-size:12px;font-weight:600;color:var(--muted)">#${r.idx} 识别失败</div>
              <div style="font-size:11px;color:var(--red);margin-top:3px">${r.error}</div>
            </div>
          </div>`;
        const sc = r.compatibility_score || 0;
        const lc = sc >= 75 ? 'var(--green)' : sc >= 50 ? 'var(--gold)' : 'var(--red)';
        return `
          <div style="background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:12px">
            <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px">
              <div style="position:relative;flex-shrink:0">
                <img src="${r.imgSrc}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;display:block">
                <div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:${lc};color:#000;font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;white-space:nowrap">${sc}分</div>
              </div>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">#${r.idx} ${r.name||'未识别'}</div>

      ${pending > 0 ? Array(pending).fill(0).map((_,i) => `

            <div style="font-size:11px">#${results.length+i+1} 等待分析</div>
          </div>
        </div>`).join('') : ''}
    </div>`;
}

async function recommendBloggers() {
  const btn = document.getElementById('recommend-run-btn');

  btn.disabled = true;
  if (statusEl) { statusEl.textContent = 'AI 分析历史数据，生成推荐...'; statusEl.style.color = 'var(--muted)'; }
  if (resultEl) resultEl.innerHTML = '';

  const successRows = ALL_ROWS.filter(r => r.status === '引导到私域了');
  if (!successRows.length) {
    if (statusEl) statusEl.textContent = '⚠️ 暂无建联成功数据，无法生成推荐';
    btn.disabled = false;
    return;
  }

  const summary = successRows.slice(0, 50).map(r =>
    `博主名:${r.name},平台:${r.platform||'未知'},粉丝:${r.followers||'未知'}万,类型:${r.blogger_type||'未知'}`
  ).join('\n');

  try {
    const resp = await fetch(window.location.origin + '/api/analyze', {
      method: 'POST',

        prompt: `以下是我们团队建联成功的博主数据（共${successRows.length}位）：\n\n${summary}\n\n基于以上成功案例的规律，请推荐20个最适合建联的博主方向/类型。\n\n严格按JSON数组返回，不要其他文字：\n[{"rank":1,"type":"博主类型/方向","platform":"平台","followers_range":"粉丝量区间","reason":"推荐原因（1句话）","approach":"建联切入点（1句话）"}]`,
        max_tokens: 2000
      })
    });
    const data = await resp.json();
    const text = data.text || '';
    const match = text.match(/\[[\s\S]*\]/);
    const list = match ? JSON.parse(match[0]) : null;

    if (list && list.length) {
      resultEl.innerHTML = `

            <div style="background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:12px">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">

              <div style="font-size:11px;color:var(--muted);margin-bottom:4px">${item.platform||''} · ${item.followers_range||''}</div>
              <div style="font-size:12px;color:var(--green);margin-bottom:4px">▸ ${item.reason||''}</div>
              <div style="font-size:11px;color:var(--blue)">💬 ${item.approach||''}</div>
            </div>`).join('')}
        </div>`;
      if (statusEl) { statusEl.textContent = `✅ 已生成 ${list.length} 条推荐`; statusEl.style.color = 'var(--green)'; }
    } else {
      if (statusEl) { statusEl.textContent = '⚠️ 生成失败，请重试'; statusEl.style.color = '#fca5a5'; }
    }
  } catch(e) {
    if (statusEl) { statusEl.textContent = '❌ 错误：' + e.message; statusEl.style.color = '#fca5a5'; }
  }
  btn.disabled = false;
}

function ocrHandleDrop(e) {

function ocrHandleFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    ocrPendingFiles.push(f);
    const reader = new FileReader();
    reader.onload = ev => {
      const previews = document.getElementById('ocr-previews');
      if (!previews) return;
      const idx = ocrPendingFiles.indexOf(f);
      const div = document.createElement('div');
      div.id = 'preview-' + idx;
      div.style.cssText = 'position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;border:1px solid var(--border)';
      div.innerHTML = `
        <img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover">
        <button onclick="ocrRemoveFile(${idx})" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:4px;width:18px;height:18px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center">×</button>`;
      previews.appendChild(div);
    };
    reader.readAsDataURL(f);
  }
  const btn = document.getElementById('ocr-run-btn');
  if (btn) btn.disabled = ocrPendingFiles.length === 0;
}

function ocrRemoveFile(idx) {
  ocrPendingFiles.splice(idx, 1);
  const el = document.getElementById('preview-' + idx);
  if (el) el.remove();
  const btn = document.getElementById('ocr-run-btn');
  if (btn) btn.disabled = ocrPendingFiles.length === 0;
}

async function ocrRun() {
  if (!ocrPendingFiles.length) return;
  const btn = document.getElementById('ocr-run-btn');
  if (btn) btn.disabled = true;
  const statusEl = document.getElementById('ocr-status');

  // 逐张识别，避免超时
  const newRows = [];

  for (let i = 0; i < ocrPendingFiles.length; i++) {
    const f = ocrPendingFiles[i];
    if (statusEl) statusEl.textContent = `识别中 ${i+1} / ${ocrPendingFiles.length}：${f.name}`;

    // 压缩并转 base64（最大 1200px，quality 0.8）
    const b64 = await new Promise(res => {
      const img = new Image();
      const url = URL.createObjectURL(f);
      img.onload = () => {
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
      };
      img.src = url;
    });

    try {
      const resp = await fetch(window.location.origin + '/api/vision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          images: [b64],
          prompt: `请识别图片中的博主主页信息，严格按以下JSON数组格式返回，不要任何其他文字：
[{"name":"博主名称","account":"博主账号ID（如抖音号/小红书号/B站UID等，不是昵称）","link":"主页链接（如有否则空）","followers":"粉丝数（如19.4万）","blogger_type":"博主类型（如AI科技/生活方式/知识分享等）","error":""}]
如无法识别在error字段说明原因，其他字段留空。followers只填粉丝数不填获赞数。`
        })
      });
      const data = await resp.json();
      if (data.error) {
        newRows.push({ _error: data.error, name:'', platform:'', followers:'', blogger_type:'', link:'', status:'', owner:'' });
      } else {
        const parsed = data.result;
        try {
          if (parsed && Array.isArray(parsed)) {
            parsed.forEach(r => {
              if (r.error) {
                newRows.push({ _error: r.error, name:'', platform:'', followers:'', blogger_type:'', link:'', status:'', owner:'' });
              } else {
                newRows.push({ name: r.name||'', account: r.account||'', followers: r.followers||'', blogger_type: r.blogger_type||'', link: r.link||'', status:'', owner:'' });
              }
            });
          } else if (data.raw) {
            const match = data.raw.match(/\[[\s\S]*\]/);
            const fallback = match ? JSON.parse(match[0]) : null;
            if (fallback) {
              fallback.forEach(r => newRows.push({ name: r.name||'', account: r.account||'', followers: r.followers||'', blogger_type: r.blogger_type||'', link: r.link||'', status:'', owner:'' }));
            } else {
              newRows.push({ _error: '格式解析失败：' + data.raw.slice(0,80), name:'', platform:'', followers:'', blogger_type:'', link:'', status:'', owner:'' });
            }
          } else {
            newRows.push({ _error: '识别无结果', name:'', platform:'', followers:'', blogger_type:'', link:'', status:'', owner:'' });
          }
        } catch(pe) {
          newRows.push({ _error: '解析错误：' + pe.message, name:'', platform:'', followers:'', blogger_type:'', link:'', status:'', owner:'' });
        }
      }
    } catch(e) {
      newRows.push({ _error: e.message, name:'', platform:'', followers:'', blogger_type:'', link:'', status:'', owner:'' });
    }
    // 每识别一张就实时更新表格
    ocrRows = [...ocrRows, ...newRows.slice(newRows.length-1)];
    ocrRenderTable();
  }
  ocrPendingFiles = [];
  const previews = document.getElementById('ocr-previews');
  if (previews) previews.innerHTML = '';
  if (btn) btn.disabled = true;
  if (statusEl) statusEl.textContent = `✅ 识别完成，共 ${ocrRows.filter(r=>!r._error).length} 条有效数据`;
  ocrRenderTable();
}

function ocrRenderTable() {
  const wrap = document.getElementById('ocr-table-wrap');
  const tbody = document.getElementById('ocr-tbody');
  const count = document.getElementById('ocr-count');
  if (!wrap || !tbody) return;

  wrap.style.display = 'block';
  if (count) count.textContent = `${ocrRows.filter(r=>!r._error).length} 条`;

  tbody.innerHTML = ocrRows.map((row, idx) => {
    if (row._error) {
      return `<tr style="background:rgba(239,68,68,.05)">
        <td colspan="8" style="padding:10px 14px;color:#fca5a5;font-size:12px">⚠ ${row._error}
          <button onclick="ocrDeleteRow(${idx})" style="margin-left:8px;background:transparent;border:none;color:#fca5a5;cursor:pointer;font-size:11px">删除</button>
        </td>
      </tr>`;
    }
    const isDup = !!row._dup;
    const td = (val, field) => `<td style="padding:8px 14px;border-bottom:1px solid var(--border);color:var(--text)">
      <div contenteditable="true" onblur="ocrEdit(${idx},'${field}',this.textContent)"
        style="outline:none;min-width:40px;min-height:16px">${val||''}</div>
    </td>`;
    return `<tr id="ocr-row-${idx}" style="transition:background .15s;background:${isDup?'rgba(239,68,68,.07)':'transparent'}" onmouseover="this.style.background='${isDup?'rgba(239,68,68,.12)':'var(--surf2)'}'" onmouseout="this.style.background='${isDup?'rgba(239,68,68,.07)':'transparent'}'">
      ${td(row.name,'name')}
      ${td(row.account,'account')}
      ${td(row.followers,'followers')}
      ${td(row.blogger_type,'blogger_type')}
      ${td(row.link,'link')}
      ${td(row.status,'status')}
      ${td(row.owner,'owner')}
      <td style="padding:8px 14px;border-bottom:1px solid var(--border);white-space:nowrap">
        ${isDup ? `<span style="font-size:11px;color:#fca5a5;margin-right:6px" title="${row._dup}">⚠ ${row._dup}</span>` : ''}
        <button onclick="ocrDeleteRow(${idx})" style="background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:13px">🗑</button>
      </td>
    </tr>`;
  }).join('');
}

function ocrEdit(idx, field, val) {
  if (ocrRows[idx]) ocrRows[idx][field] = val.trim();
}

function ocrDeleteRow(idx) {
  ocrRows.splice(idx, 1);
  ocrRenderTable();
}

function ocrClear() {
  ocrRows = [];
  ocrPendingFiles = [];
  rendered.delete('ocr');
  renderOcr();
  rendered.add('ocr');
}

function ocrExportCSV() {
  const valid = ocrRows.filter(r => !r._error);
  if (!valid.length) return;
  const header = '博主名,博主号,粉丝量,博主类型,博主链接,回复情况,跟进人';
  const rows = valid.map(r =>
    [r.name, r.account, r.followers, r.blogger_type, r.link, r.status, r.owner]
      .map(v => `"${(v||'').replace(/"/g,'""')}"`)
      .join(',')
  );
  const csv = '\uFEFF' + header + '\n' + rows.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = '博主信息.csv'; a.click();
}

function ocrCheckDup() {
  const valid = ocrRows.filter(r => !r._error);
  if (!valid.length) return;

  // 建立 Supabase 已有链接的集合（归一化处理）
  const normalize = url => (url||'').trim().toLowerCase().replace(/\/+$/, '').replace(/^https?:\/\//, '');
  const existingLinks = new Set(ALL_ROWS.map(r => normalize(r.link)));
  const existingNames = new Set(ALL_ROWS.map(r => (r.name||'').trim()));
  const existingAccounts = new Set(ALL_ROWS.map(r => (r.account||'').trim()).filter(Boolean));

  let dupCount = 0;
  ocrRows = ocrRows.map(r => {
    if (r._error) return r;
    const linkDup  = r.link    && existingLinks.has(normalize(r.link));
    const nameDup  = r.name    && existingNames.has(r.name.trim());
    const accDup   = r.account && existingAccounts.has(r.account.trim());
    if (linkDup || nameDup || accDup) {
      dupCount++;
      const reasons = [];
      if (linkDup) reasons.push('链接重复');
      if (nameDup) reasons.push('名称重复');
      if (accDup)  reasons.push('账号重复');
      return { ...r, _dup: reasons.join('、') };
    }
    return { ...r, _dup: '' };
  });

  ocrRenderTable();
  const s = document.getElementById('ocr-status');
  if (s) {
    if (dupCount > 0) {
      s.textContent = `⚠ 发现 ${dupCount} 条重复博主（已标红）`;
      s.style.color = '#fca5a5';
    } else {
      s.textContent = '✅ 无重复博主';
      s.style.color = 'var(--green)';
    }
  }
}

function ocrCopyCol(field) {
  const valid = ocrRows.filter(r => !r._error);
  if (!valid.length) return;
  const text = valid.map(r => r[field] || '').join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const s = document.getElementById('ocr-status');
    const labels = {name:'博主名',account:'博主号',followers:'粉丝量',blogger_type:'博主类型',link:'博主链接',status:'回复情况',owner:'跟进人'};
    if (s) { s.textContent = `✅ 已复制「${labels[field]||field}」列`; s.style.color = 'var(--green)'; setTimeout(()=>{ if(s) s.textContent=''; }, 2000); }
  });
}

function ocrCopyFeishu() {
  const valid = ocrRows.filter(r => !r._error);
  if (!valid.length) return;
  const rows = valid.map(r =>
    [r.name, r.account, r.followers, r.blogger_type, r.link, r.status, r.owner].join('\t')
  );
  navigator.clipboard.writeText(rows.join('\n')).then(() => {
    const s = document.getElementById('ocr-status');
    if (s) { s.textContent = '✅ 已复制，直接粘贴到飞书表格即可'; s.style.color = 'var(--green)'; }
  });
}
