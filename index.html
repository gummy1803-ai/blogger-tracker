let kbItems = [];
async function loadKbList() {
  try {
    const items = await SB.query("knowledge_base", { order: "created_at.desc", limit: "50" });
    kbItems = items || [];
    const el = document.getElementById("kb-list");
    if (!kbItems.length) {
      el.innerHTML = '<div style="color:var(--muted);padding:10px 0">暂无材料，点击「+ 添加材料」开始录入</div>';
      return;
    }
    el.innerHTML = kbItems.map(function(item) {
      var safeTitle = item.title.replace(/"/g, "&quot;");
      var safeContent = item.content.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return '<div id="kb-item-' + item.id + '" style="padding:10px 0;border-bottom:1px solid var(--border)">'
        + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'
        + '<span style="font-weight:600;color:var(--text)">' + item.title + '</span>'
        + '<span style="font-size:11px;background:var(--surf2);color:var(--muted);padding:2px 8px;border-radius:10px">' + item.category + '</span>'
        + '<button onclick="editKbItem(\'' + item.id + '\')" style="margin-left:auto;background:none;border:none;color:var(--blue);cursor:pointer;font-size:12px">编辑</button>'
        + '<button onclick="deleteKbItem(\'' + item.id + '\')" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:12px">删除</button>'
        + '</div>'
        + '<div id="kb-view-' + item.id + '" style="color:var(--muted2);font-size:12px;white-space:pre-wrap">' + item.content.slice(0,100) + (item.content.length>100?'...':'') + '</div>'
        + '<div id="kb-edit-' + item.id + '" style="display:none;margin-top:8px">'

        + '<textarea id="kb-edit-content-' + item.id + '" rows="5" style="width:100%;padding:6px 10px;background:var(--surf2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;resize:vertical;box-sizing:border-box">' + safeContent + '</textarea>'

        + '<button onclick="cancelKbEdit(\'' + item.id + '\')" style="margin-top:6px;margin-left:6px;background:var(--surf2);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:6px 16px;font-size:12px;cursor:pointer">取消</button>'
        + '</div>'

    }).join("");
  } catch(e) {
    document.getElementById("kb-list").innerHTML = '<span style="color:var(--muted)">加载失败</span>';
  }

async function handleKbFile(input) {
  const file = input.files[0];
  if (!file) return;
  const statusEl = document.getElementById("kb-file-status");
  const nameEl = document.getElementById("kb-file-name");
  nameEl.textContent = file.name;
  statusEl.textContent = "解析中...";
  statusEl.style.color = "var(--muted)";
  const titleEl = document.getElementById("kb-title");
  if (!titleEl.value) titleEl.value = file.name.replace(/\.[^.]+$/, "");
  try {
    let text = "";
    const ext = file.name.split(".").pop().toLowerCase();
    if (ext === "txt" || ext === "md") {
      text = await file.text();
    } else if (ext === "pdf") {
      const arrayBuffer = await file.arrayBuffer();
      const pdfjsLib = window["pdfjs-dist/build/pdf"];
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const tc = await page.getTextContent();
        pages.push(tc.items.map(function(s) { return s.str; }).join(" "));
      }
      text = pages.join("\n");
    } else if (ext === "docx") {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
      text = result.value;
    }
    document.getElementById("kb-content").value = text;
    statusEl.textContent = "✓ 解析完成，共 " + text.length + " 字";
    statusEl.style.color = "var(--green)";
    document.getElementById("kb-summary-bar").style.display = "block";
  } catch(e) {
    statusEl.textContent = "解析失败：" + e.message;
    statusEl.style.color = "var(--danger)";
  }
}

function toggleKbEditor() {
  const ed = document.getElementById("kb-editor");
  ed.style.display = ed.style.display === "none" ? "block" : "none";
  if (ed.style.display === "none") {
    document.getElementById("kb-file-name").textContent = "";
    document.getElementById("kb-file-status").textContent = "";
    document.getElementById("kb-summary-bar").style.display = "none";
    document.getElementById("kb-summary-status").textContent = "";
  }
}

async function saveKbItem() {
  const title = document.getElementById("kb-title").value.trim();
  const content = document.getElementById("kb-content").value.trim();
  const category = document.getElementById("kb-category").value;
  if (!title || !content) { alert("标题和内容不能为空"); return; }
  try {
    const resp = await fetch(window.location.origin + "/api/kb", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, content, category })
    });
    if (resp.ok) {
      document.getElementById("kb-title").value = "";
      document.getElementById("kb-content").value = "";
      toggleKbEditor();
      await loadKbList();
    } else {
      alert("保存失败，请重试");
    }
  } catch(e) {
    alert("保存失败：" + e.message);
  }
}

function editKbItem(id) {
  document.getElementById("kb-view-" + id).style.display = "none";
  document.getElementById("kb-edit-" + id).style.display = "block";
}

function cancelKbEdit(id) {
  document.getElementById("kb-view-" + id).style.display = "block";
  document.getElementById("kb-edit-" + id).style.display = "none";
}

async function saveKbEdit(id) {
  const title = document.getElementById("kb-edit-title-" + id).value.trim();
  const content = document.getElementById("kb-edit-content-" + id).value.trim();
  if (!title || !content) { alert("标题和内容不能为空"); return; }
  try {
    const resp = await fetch(window.location.origin + "/api/kb/" + id, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: title, content: content, updated_at: new Date().toISOString() })
    });
    if (resp.ok) {
      await loadKbList();
    } else {
      alert("保存失败，请重试");
    }
  } catch(e) {
    alert("保存失败：" + e.message);
  }

      checkinData[r.checkin_date][r.member_name] = {

async function saveCheckinRecord(memberName, date) {
  if (!checkinData[date]) checkinData[date] = {};
  if (!checkinData[date][memberName]) checkinData[date][memberName] = { chat:[], blogger:[], review:[], submitted: false };
  const rec = checkinData[date][memberName];
  const hasImages = (rec.chat||[]).length + (rec.blogger||[]).length + (rec.review||[]).length > 0;
  if (hasImages) rec.submitted = true;
  const payload = {
    member_name: memberName,
    checkin_date: date,
    chat_images: rec.chat || [],
    blogger_images: rec.blogger || [],
    review_images: rec.review || [],
    submitted: rec.submitted || false,
    admin_override: rec.adminOverride || null
  };
  const headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_ANON,
    'Authorization': 'Bearer ' + SUPABASE_ANON,
    'Prefer': 'return=representation'
  };
  try {
    // 直接调 Supabase，绕过 Vercel 后端，避免中文编码问题
    const existResp = await fetch(
      `${SUPABASE_URL}/rest/v1/checkins?member_name=eq.${encodeURIComponent(memberName)}&checkin_date=eq.${date}&select=id`,
      { headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON } }
    );
    const existing = await existResp.json();
    let r;
    if (existing && existing.length > 0) {
      r = await fetch(
        `${SUPABASE_URL}/rest/v1/checkins?member_name=eq.${encodeURIComponent(memberName)}&checkin_date=eq.${date}`,
        { method: 'PATCH', headers, body: JSON.stringify(payload) }
      );
    } else {
      r = await fetch(
        `${SUPABASE_URL}/rest/v1/checkins`,
        { method: 'POST', headers, body: JSON.stringify(payload) }
      );
    }
    const data = await r.json();
    const row = Array.isArray(data) ? data[0] : data;
    if (row?.id) checkinData[date][memberName].id = row.id;
    if (row?.chat_images) checkinData[date][memberName].chat = row.chat_images;
    if (row?.blogger_images) checkinData[date][memberName].blogger = row.blogger_images;
    if (row?.review_images) checkinData[date][memberName].review = row.review_images;
  } catch(e) { console.error('saveCheckinRecord error:', e); }
}

// 图片压缩后上传到 Supabase Storage，返回公开 URL
// memberName/imgType 可选，用于文件名标注归属
async function uploadCheckinImage(file, memberName, imgType) {
  // 1. 压缩图片（最大800px，quality 0.7，兼顾清晰度和大小）
  const compressed = await new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 800;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.7);
    };
    img.src = url;
  });

  // 2. 上传到 Supabase Storage（文件名含姓名+类型，方便归档）
  const typeMap = { chat: 'chat', blogger: 'blogger', review: 'review', compat: 'compat' };
  const safeName = memberName ? memberName.split('').map(c => c.charCodeAt(0) > 127 ? encodeURIComponent(c).replace(/%/g,'') : c).join('') : 'member';
  const safeType = typeMap[imgType] || (imgType || 'img');
  const filename = `${safeName}_${safeType}_${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
  const resp = await fetch(
    `${SUPABASE_URL}/storage/v1/object/checkin-images/${filename}`,
    {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON,
        'Authorization': 'Bearer ' + SUPABASE_ANON,
        'Content-Type': 'image/jpeg',
        'x-upsert': 'true'
      },
      body: compressed
    }
  );
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error('图片上传失败：' + err);
  }

  // 3. 返回公开 URL
  return `${SUPABASE_URL}/storage/v1/object/public/checkin-images/${filename}`;
}

// 导出当天所有截图为 zip
async function checkinExportZip(date) {
  const dayData = checkinData[date] || {};
  const typeLabels = { chat: '聊天截图', blogger: '建联记录', review: '复盘截图' };

  // 检查有没有截图
  let totalImgs = 0;
  CHECKIN_MEMBERS.forEach(m => {
    const rec = dayData[m.name] || {};
    ['chat','blogger','review'].forEach(t => { totalImgs += (rec[t]||[]).length; });
  });

  if (!totalImgs) {
    alert(`${date} 暂无截图可导出`);
    return;
  }

  const zip = new JSZip();
  const folder = zip.folder(date);

  CHECKIN_MEMBERS.forEach(m => {
    const rec = dayData[m.name] || {};
    ['chat','blogger','review'].forEach(type => {
      const imgs = rec[type] || [];
      imgs.forEach((dataUrl, i) => {
        // dataUrl: data:image/jpeg;base64,xxx
        const base64 = dataUrl.split(',')[1];
        const filename = `${m.name}_${typeLabels[type]}_${i+1}.jpg`;
        folder.file(filename, base64, { base64: true });
      });
    });
  });

  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `打卡截图_${date}.zip`;
  a.click();
}

// 待保存的截图临时存这里，不影响其他人数据
async function checkinHandleUpload(event, member, type, date) {
  const files = Array.from(event.target.files);
  if (!files.length) return;
  const statusEl = document.getElementById(`ci-save-status-${member}`);
  if (statusEl) statusEl.textContent = '上传中...';

  for (const file of files) {
    try {
      const url = await uploadCheckinImage(file, member, type);

      // 写入checkinData（用服务器返回的最新数据合并，避免卡片重渲染导致数据丢失）
      if (!checkinData[date]) checkinData[date] = {};
      if (!checkinData[date][member]) checkinData[date][member] = { chat:[], blogger:[], review:[], submitted: false };
      checkinData[date][member][type] = [...(checkinData[date][member][type] || []), url];
      checkinData[date][member].submitted = true;

      // 保存到数据库
      const payload = {
        member_name: member,
        checkin_date: date,
        chat_images: checkinData[date][member].chat || [],
        blogger_images: checkinData[date][member].blogger || [],
        review_images: checkinData[date][member].review || [],
        submitted: true,
        admin_override: checkinData[date][member].adminOverride || null
      };

      const r = await fetch(`${window.location.origin}/api/checkins`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await r.json();
      if (data?.id) checkinData[date][member].id = data.id;
      // 用服务器返回的最新数据更新内存，确保一致
      if (data?.chat_images) checkinData[date][member].chat = data.chat_images;
      if (data?.blogger_images) checkinData[date][member].blogger = data.blogger_images;
      if (data?.review_images) checkinData[date][member].review = data.review_images;

      if (statusEl) statusEl.textContent = '✅ 已保存';

      // 刷新卡片（此时checkinData已是最新，不会丢数据）
      const cfg = CHECKIN_MEMBERS.find(m => m.name === member);
      if (cfg) {
        const cardEl = document.getElementById(`checkin-card-${member}`);
        if (cardEl) cardEl.outerHTML = renderCheckinMemberCard(cfg, date);
      }
    } catch(e) {
      if (statusEl) statusEl.textContent = '❌ 上传失败：' + e.message;
      console.error('checkinHandleUpload error', e);
    }
  }

  setTimeout(() => { const s = document.getElementById(`ci-save-status-${member}`); if(s) s.textContent=''; }, 3000);
}

// ── 签到页博主适配度截图上传（无建联成功时替代建联成功截图）──
async function checkinHandleCompatUpload(event, member, date) {
  const files = Array.from(event.target.files);
  if (!files.length) return;
  const statusEl = document.getElementById(`ci-compat-status-${member}`);
  if (statusEl) statusEl.textContent = `上传中 (0/${files.length})...`;

  // 把截图存到 blogger 槽（同时作为截图上传分来源）
  for (let i = 0; i < files.length; i++) {
    try {
      const url = await uploadCheckinImage(files[i], member, 'compat');
      if (!checkinData[date]) checkinData[date] = {};
      if (!checkinData[date][member]) checkinData[date][member] = { chat:[], blogger:[], review:[], submitted: false };
      checkinData[date][member].blogger = [...(checkinData[date][member].blogger || []), url];
      checkinData[date][member].submitted = true;
      if (statusEl) statusEl.textContent = `上传中 (${i+1}/${files.length})...`;
    } catch(e) {
      if (statusEl) statusEl.textContent = `❌ 第${i+1}张上传失败：${e.message}`;
    }
  }
  // 保存到数据库
  await saveCheckinRecord(member, date);
  // 刷新卡片
  const cfg = CHECKIN_MEMBERS.find(m => m.name === member);
  if (cfg) {
    const cardEl = document.getElementById(`checkin-card-${member}`);
    if (cardEl) cardEl.outerHTML = renderCheckinMemberCard(cfg, date);
  }
  if (statusEl) statusEl.textContent = `✅ 已上传 ${files.length} 张，共 ${(checkinData[date]?.[member]?.blogger||[]).length} 张，满10张可分析`;
}

// ── 签到页一键分析适配度（提取blogger槽图片，调用vision API）──
async function checkinRunCompatAnalysis(member, date) {
  const images = (checkinData[date]?.[member]?.blogger || []);
  if (images.length < 10) { alert(`需要至少10张截图，当前 ${images.length} 张`); return; }
  const statusEl = document.getElementById(`ci-compat-status-${member}`);
  if (statusEl) statusEl.innerHTML = `<span style="color:var(--blue)">分析中，请稍候…</span>`;

  // 下载图片转base64
  const toB64 = async url => {
    const resp = await fetch(url);
    const blob = await resp.blob();
    return new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result.split(',')[1]); r.readAsDataURL(blob); });
  };

  const successRows = ALL_ROWS.filter(r => STATUS_SUCCESS.includes(r.status));
  const avgFollowers = successRows.length ? (successRows.map(r=>parseFloat(r.followers)||0).filter(v=>v>0).reduce((a,b)=>a+b,0)/successRows.length).toFixed(1) : '未知';

  const results = [];
  for (let i = 0; i < images.length; i++) {
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--blue)">分析第 ${i+1}/${images.length} 位…</span>`;
    try {
      const b64 = await toB64(images[i]);
      const prompt = `这是第${i+1}位博主的主页截图，请分析该博主是否适合宣传以下产品。
【产品：飞羽出书 FeatherPub AI】核心定位：AI一站式出书平台；目标用户：有故事/知识积累想出版的人；适合类型：AI科技、知识分享、个人成长、中老年人群。
历史成功建联均粉：${avgFollowers}万。
请严格按JSON格式返回，不要其他文字：
{"name":"博主名","compatibility_score":85,"compatibility_level":"高/中/低","suggestion":"建联建议（1句）"}`;
      const resp = await fetch(`${window.location.origin}/api/vision`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ images:[b64], prompt })
      });
      const data = await resp.json();
      const raw = data.result ? JSON.stringify(data.result[0]||data.result) : (data.raw||'');
      const match = raw.match(/\{[\s\S]*\}/);
      const r = match ? JSON.parse(match[0]) : null;
      results.push(r ? { ...r, idx:i+1 } : { name:`第${i+1}张`, compatibility_score:0, idx:i+1, error:'识别失败' });
    } catch(e) {
      results.push({ name:`第${i+1}张`, compatibility_score:0, idx:i+1, error:e.message });
    }
  }

  const valid = results.filter(r => !r.error && r.compatibility_score > 0);
  const avg = valid.length ? Math.round(valid.reduce((s,r)=>s+r.compatibility_score,0)/valid.length) : 0;
  const qualifies = avg >= 70;

  // 保存到 compat_scores
  if (valid.length) {
    try {
      const rows = valid.map(r => ({ member_name:member, score_date:date, blogger_name:r.name||'', compat_score:r.compatibility_score||0 }));
      await fetch(`${SUPABASE_URL}/rest/v1/compat_scores`, {
        method:'POST',
        headers:{ 'apikey':SUPABASE_ANON, 'Authorization':'Bearer '+SUPABASE_ANON, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
        body: JSON.stringify(rows)
      });
      if (!window.compatScoreCache) window.compatScoreCache = [];
      window.compatScoreCache.push(...rows);
    } catch(e) { console.warn('compat_scores 保存失败', e); }
  }

  if (statusEl) statusEl.innerHTML = `✅ 分析完成 · ${valid.length}位博主 · 平均适配分 <b style="color:${qualifies?'var(--green)':'var(--gold)'}">${avg}分</b>${qualifies?' · 🎯 +5分已记录':'· 需≥70分'}`;

  // 刷新卡片显示最新状态
  const cfg = CHECKIN_MEMBERS.find(m => m.name === member);
  if (cfg) {
    const cardEl = document.getElementById(`checkin-card-${member}`);
    if (cardEl) cardEl.outerHTML = renderCheckinMemberCard(cfg, date);
  }
}

// ── 📅 打卡总览 ──
let attendanceMonth = new Date().toISOString().slice(0, 7); // YYYY-MM

function renderAttendance() {
  const el = document.getElementById('pane-attendance');
  const [year, month] = attendanceMonth.split('-').map(Number);
  const today = new Date().toISOString().slice(0, 10);

  // 生成该月日期，当月到今天，历史月份到月底
  // 起始日期：如果是5月（第一个月），从第一条数据日期开始；否则从1号开始
  const firstDataDate = ALL_ROWS.length
    ? [...ALL_ROWS].sort((a,b) => a.record_date.localeCompare(b.record_date))[0].record_date
    : `${year}-${String(month).padStart(2,'0')}-01`;
  const monthStr = `${year}-${String(month).padStart(2,'0')}`;
  const startDay = firstDataDate.startsWith(monthStr)
    ? parseInt(firstDataDate.slice(8))
    : 1;
  const daysInMonth = new Date(year, month, 0).getDate();
  const allDates = [];
  for (let d = startDay; d <= daysInMonth; d++) {
    allDates.push(`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }
  const isCurrentMonth = attendanceMonth === new Date().toISOString().slice(0, 7);
  const dates = isCurrentMonth ? allDates.filter(d => d <= today) : allDates;

  // 月份切换
  const prevMonth = (() => {
    const d = new Date(year, month - 2, 1); // month-2 because month is 1-indexed
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  })();
  const nextMonth = (() => {
    const d = new Date(year, month, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

function adminCellClick(member, date) {
  // 直接切换打卡状态
  adminToggleCheckin(member, date);
}

async function adminToggleCheckin(member, date) {
  if (!isAdmin) return;
  const icon = checkinStatusIcon(member, date);

  if (!checkinData[date]) checkinData[date] = {};
  if (!checkinData[date][member]) checkinData[date][member] = { chat:[], blogger:[], review:[], submitted: false };

  if (icon === '✅') {
    // 已打卡 → 取消打卡
    checkinData[date][member].adminOverride = 'absent';
    checkinData[date][member].chat = [];
    checkinData[date][member].blogger = [];
    checkinData[date][member].review = [];
    checkinData[date][member].submitted = false;
  } else {
    // 未打卡/部分 → 标记已打卡
    checkinData[date][member].adminOverride = 'present';
    checkinData[date][member].submitted = true;
  }

  try {
    await fetch(`${window.location.origin}/api/checkins`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        member_name: member,
        checkin_date: date,
        chat_images: checkinData[date][member].chat,
        blogger_images: checkinData[date][member].blogger,
        review_images: checkinData[date][member].review,
        submitted: checkinData[date][member].submitted,
        admin_override: checkinData[date][member].adminOverride
      })
    });
  } catch(e) { console.error('adminToggleCheckin error', e); }

  rendered.delete('attendance');
  renderAttendance();
  rendered.add('attendance');
}

async function attendanceChangeMonth(ym) {
  attendanceMonth = ym;
  await loadCheckinData(ym);
  rendered.delete('attendance');
  renderAttendance();
  rendered.add('attendance');
}

// 维度1: 日常建联 (40分) ← 飞书 ALL_ROWS

// 附加分: 博主适配度+话术库 (计入周总分，最多+10)
// ══════════════════════════════════════════════════════════════

  };
})();

function perfWeekDates(offset=0) {
  const now = new Date();
  const day = now.getDay() || 7;
  const mon = new Date(now); mon.setDate(now.getDate() - day + 1 + offset*7);
  const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
  const dates = Array.from({length:5},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d.toISOString().slice(0,10); });

  };
}

let perfWeekOffset = 0;

// 计算某人某周绩效
function calcMemberPerf(memberName, dates) {
  const today = new Date().toISOString().slice(0, 10);

  // ── 维度1：日常建联 (40分) ──────────────────────────────
  // 从 ALL_ROWS 按日期+owner 统计
  const dailyContact = {}; // { 'YYYY-MM-DD': count }
  const dailySuccess = {};
  dates.forEach(d => { dailyContact[d] = 0; dailySuccess[d] = 0; });

  ALL_ROWS.forEach(r => {
    if (!r.owner || r.owner.trim() !== memberName) return;
    if (r.is_dup) return; // 重复数据不计入工作量
    const d = r.record_date;
    if (!dates.includes(d)) return;
    // 有建联状态才算建联
    if (r.status) {
      dailyContact[d] = (dailyContact[d] || 0) + 1;
      if (STATUS_SUCCESS.includes(r.status)) dailySuccess[d] = (dailySuccess[d] || 0) + 1;
    }
  });

  // 每日建联分（活跃度指标，用于日打分/明细表展示，邀请数≥5视为活跃）
  let contactScore = 0;
  const contactDetail = {};
  dates.forEach(d => {
    const cnt = dailyContact[d] || 0;
    contactDetail[d] = cnt;
    if (d > today) return; // 未来不计
    if (cnt >= 5) contactScore += 3; // 满分3分/天，5天=15（达标线：5位/天）
    else if (cnt > 0) contactScore += 1; // 不足扣分
    else contactScore -= 0; // 0位：本身不加分（已从满分扣了）
  });
  // 「建联数量达标(15分)」：邀请数≥5 为前提门槛，且当天建联成功数≥3 才算达标
  const workDays = dates.filter(d => d <= today).length;
  const reachDays = dates.filter(d => {
    if (d > today) return false;
    const invited = dailyContact[d] || 0;
    const success  = dailySuccess[d] || 0;
    return invited >= 5 && success >= 3; // 邀请数门槛 + 成功数达标(3-5位)
  }).length;
  const s_contact_qty = workDays > 0 ? Math.round(reachDays / workDays * 15) : 0;

  // 表格信息完整性 10分（从飞书数据有owner即视为有填表，用完整度代理：完整行/总建联行）
  const ownerRows = ALL_ROWS.filter(r => r.owner?.trim() === memberName && dates.includes(r.record_date) && !r.is_dup);
  const completeRows = ownerRows.filter(r => r.name && r.status);
  const s_table = ownerRows.length > 0 ? Math.round(completeRows.length / ownerRows.length * 10) : 0;

  // 博主类型达标 10分（有blogger_type且不为空视为达标）
  const typeOk = ownerRows.filter(r => r.blogger_type && r.blogger_type !== '未知');
  const s_type = ownerRows.length > 0 ? Math.round(typeOk.length / ownerRows.length * 10) : 0;

  // 粉丝数记录 5分
  const fansOk = ownerRows.filter(r => r.followers && r.followers > 0);
  const s_fans = ownerRows.length > 0 ? Math.round(fansOk.length / ownerRows.length * 5) : 0;

  const dim1 = s_contact_qty + s_table + s_type + s_fans; // /40

  // ── 维度2：截图上传 (40分) ── 每日打卡状态 + 三类截图全勤奖励
  let s_review = 0, s_chat = 0, s_blogger_img = 0;
  const cfg = CHECKIN_MEMBERS.find(m => m.name === memberName) || {};
  dates.forEach(d => {
    if (d > today) return;
    const rec = (checkinData[d] || {})[memberName] || {};
    if ((rec.review||[]).length > 0) s_review += 2;  // 最多10分(5天×2)
    if ((rec.chat||[]).length > 0) s_chat += 2;       // 最多10分
    if ((rec.blogger||[]).length > 0) s_blogger_img += 2; // 最多10分
  });
  s_review = Math.min(10, s_review);
  s_chat = Math.min(10, s_chat);
  s_blogger_img = Math.min(10, s_blogger_img);
  // 三类截图本周均有上传 → +10分（原"博主质量"分数并入此处）
  const dim2 = s_review + s_chat + s_blogger_img; // /30

  // ── 维度3：工作质量 (20分) ──
  const totalContact = ownerRows.length;
  const totalSuccess = ownerRows.filter(r => STATUS_SUCCESS.includes(r.status)).length;
  const avgFans = ownerRows.filter(r=>r.followers>0).reduce((a,r)=>a+r.followers,0) / (ownerRows.filter(r=>r.followers>0).length||1) / 10000;
  const successRate = totalContact > 0 ? totalSuccess / totalContact : 0;
  // 质量分：成功率×20（博主质量已并入截图上传维度）
  const dim3 = Math.round(Math.min(20, successRate * 20 * 2));

  // ── 附加分 ── 话术库（每条+2分，上限20） + 博主适配度（平均≥70且当日无建联成功，+20/天）｜二者合计按10分上限计入周总分
  // 话术库：从 chatScriptRows 里统计本周该成员保存的条数
  const weekTacticsCount = chatScriptRows.filter(r => {
    if (!r.member || r.member !== memberName) return false;
    // 尝试按日期过滤（tactics有date字段，格式可能是 YYYY/M/D 或 YYYY-MM-DD）
    if (!r.date) return true; // 无日期的不过滤（保底）
    try {
      const rd = new Date(r.date.replace(/\//g,'-'));
      const rdStr = rd.toISOString().slice(0,10);
      return dates.includes(rdStr);
    } catch(e) { return false; }
  }).length;
  const bonus_script = Math.min(20, weekTacticsCount * 2); // +2分/条，上限20分

  // 博主适配度：从全局 compatScoreCache 读取（由 loadCompatScores 填充）
  // 规则：当日有建联成功则不算；当日平均适配分≥75，该天得5分，每周累计不超过25分
  let bonus_adapt = 0;
  dates.forEach(d => {
    if (d > today) return;
    // 检查当日是否有建联成功
    const hasSuccess = ALL_ROWS.some(r =>
      r.owner?.trim() === memberName && r.record_date === d && STATUS_SUCCESS.includes(r.status) && !r.is_dup
    );
    if (hasSuccess) return; // 有建联成功，该天不算适配度分
    // 取该成员当天的适配度记录
    const dayScores = (window.compatScoreCache || []).filter(r =>
      r.member_name === memberName && r.score_date === d
    );
    if (!dayScores.length) return;
    const avg = dayScores.reduce((s,r) => s + (r.compat_score||0), 0) / dayScores.length;
    if (avg >= 70) bonus_adapt += 20; // 平均≥70分得+20，每天最多触发一次
  });
  bonus_adapt = Math.min(100, bonus_adapt); // 单项不单独限制，最终合计计入周总分时再按10分上限截断

  const bonusTotal = Math.min(10, bonus_adapt + bonus_script); // 附加分计入周总分，上限10

  const total = Math.min(100, dim1 + dim2 + dim3 + bonusTotal); // 40+30+20+10=100

  return {
    total: Math.round(total),
    dim1, dim2, dim3, bonusTotal,
    s_contact_qty, s_table, s_type, s_fans,
    s_review, s_chat, s_blogger_img,
    reachDays, workDays, totalContact, totalSuccess,
    contactDetail,
    bonus_adapt, bonus_script,
    avgFans: Math.round(avgFans * 10) / 10,
  };
}

function perfGrade(score) {
  if (score >= 90) return { color:'#22c55e', bg:'rgba(34,197,94,.12)' };
  if (score >= 80) return { color:'var(--blue)', bg:'rgba(91,127,255,.12)' };
  if (score >= 70) return { color:'var(--gold)', bg:'rgba(245,166,35,.12)' };
  if (score >= 60) return { color:'var(--orange)', bg:'rgba(251,146,60,.12)' };
  return                   { color:'var(--red)',  bg:'rgba(255,107,107,.12)' };
}

// 手动触发飞书数据同步
// 手动触发飞书数据同步（带进度条，轮询 GitHub Actions 运行状态）
async function perfSyncFeishu() {
  const btn = document.getElementById('perf-sync-btn');
  const statusEl = document.getElementById('perf-sync-status');
  if (btn) { btn.disabled = true; btn.style.opacity = '.5'; btn.textContent = '🔄 同步中...'; }

  const renderBar = (pct, label, color) => {
    if (!statusEl) return;
    statusEl.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;max-width:260px;height:6px;background:var(--surf2);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${color || 'var(--blue)'};border-radius:4px;transition:width .4s"></div>
        </div>
        <span style="font-size:11px;color:var(--muted);white-space:nowrap">${label}</span>
      </div>`;
  };

  renderBar(5, '正在触发同步任务...', 'var(--blue)');

  try {
    const resp = await fetch(`${window.location.origin}/api/sync-feishu`, { method: 'POST' });
    const data = await resp.json();
    if (data.error) {
      if (statusEl) statusEl.innerHTML = `❌ 同步失败：${data.error}`;
      if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '🔄 同步飞书数据'; }
      return;
    }

    renderBar(10, '任务已触发，等待 GitHub 启动...', 'var(--blue)');

    // 轮询任务状态，最多2分钟（每3秒一次，共40次）
    let lastConclusion = null;
    let triggeredAt = Date.now();
    for (let i = 0; i < 40; i++) {
      await new Promise(r => setTimeout(r, 3000));
      try {
        const sResp = await fetch(`${window.location.origin}/api/sync-feishu/status`);
        const sData = await sResp.json();
        if (sData.error) {
          // 查询状态失败不算致命，继续等待
          renderBar(Math.min(15 + i * 2, 90), '同步进行中...', 'var(--blue)');
          continue;
        }
        // 只关心本次触发之后开始的任务
        const createdAt = sData.created_at ? new Date(sData.created_at).getTime() : 0;
        const isCurrentRun = createdAt >= triggeredAt - 15000; // 容忍15秒时间差

        if (sData.status === 'completed' && isCurrentRun) {
          if (sData.conclusion === 'success') {
            renderBar(100, '同步完成 ✅', 'var(--green)');
          } else {
            renderBar(100, `同步结束（${sData.conclusion || '未知状态'}）`, 'var(--red)');
            if (statusEl) statusEl.innerHTML += `<div style="margin-top:4px"><a href="${sData.html_url}" target="_blank" style="font-size:11px;color:var(--blue)">查看运行日志 →</a></div>`;
          }
          lastConclusion = sData.conclusion;
          break;
        } else if (sData.status === 'in_progress' || (sData.status === 'queued' && isCurrentRun)) {
          const pct = Math.min(15 + i * 2.5, 90);
          renderBar(pct, sData.status === 'queued' ? '排队中...' : '同步进行中...', 'var(--blue)');
        } else {
          renderBar(Math.min(15 + i * 2, 90), '等待任务开始...', 'var(--blue)');
        }
      } catch (e) {
        renderBar(Math.min(15 + i * 2, 90), '同步进行中...', 'var(--blue)');
      }
    }

    if (lastConclusion === null) {
      renderBar(100, '同步任务耗时较长，请稍后手动刷新页面', 'var(--gold)');
    }

    // 刷新前端数据
    if (statusEl) statusEl.innerHTML += `<div style="margin-top:4px;font-size:11px;color:var(--muted)">正在刷新页面数据...</div>`;
    await loadData();
    await loadCheckinData();
    rendered.delete('perf');
    renderPerf();
    rendered.add('perf');
    const s2 = document.getElementById('perf-sync-status');
    if (s2 && lastConclusion === 'success') {
      s2.innerHTML = '✅ 同步完成，数据已刷新';
    } else if (s2) {
      s2.innerHTML += `<div style="margin-top:4px;font-size:11px;color:var(--green)">✅ 数据已刷新</div>`;
    }

  } catch (e) {
    if (statusEl) statusEl.innerHTML = `❌ 同步失败：${e.message}`;
  }

  if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '🔄 同步飞书数据'; }
}

function renderPerf() {
  const el = document.getElementById('pane-perf');
  if (!el) return;

  const wk = perfWeekDates(perfWeekOffset);
  const today = new Date().toISOString().slice(0,10);

  // ── 每人本周数据 ──
  const perfData = CHECKIN_MEMBERS.map(m => ({ name: m.name, ...calcMemberPerf(m.name, wk.dates) }))
    .sort((a,b) => b.total - a.total);

  // ── 日视图数据 ──
  const dayData = CHECKIN_MEMBERS.map(m => {
    const cnt = ALL_ROWS.filter(r => r.owner?.trim()===m.name && r.record_date===perfDayDate && r.status && !r.is_dup).length;
    const rec = (checkinData[perfDayDate]||{})[m.name] || {};
    const chatN = (rec.chat||[]).length;
    const blogN = (rec.blogger||[]).length;
    const reviewN = (rec.review||[]).length;
    const imgs = chatN + blogN + reviewN;
    const isFuture = perfDayDate > today;
    // 从0开始加分：做了才有分
    let score = 0;
    if (!isFuture) {
      // 建联分（满50）：≥5位得50，1-4位得20，0位得0
      if (cnt >= 5) score += 50;
      else if (cnt > 0) score += 20;
      // 截图分（满50）：三类各15分 + 三类全勤奖励5分
      if (chatN > 0)   score += 15;
      if (blogN > 0)   score += 15;
      if (reviewN > 0) score += 15;
      if (chatN > 0 && blogN > 0 && reviewN > 0) score += 5; // 全勤奖励
    }
    return { name: m.name, cnt, imgs, chatN, blogN, reviewN, score: Math.min(100, score), isFuture };
  }).sort((a,b) => b.score - a.score);

  el.innerHTML = `
<div style="max-width:1100px">
  <!-- 标题栏 -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:10px">
    <div>
      <div style="font-size:16px;font-weight:700;color:var(--text)">📊 绩效评分</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">依据《运营岗位制度管理办法》v2026-06-10</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      ${isAdmin ? `<button onclick="perfSyncFeishu()" id="perf-sync-btn" style="padding:5px 12px;border-radius:7px;border:1px solid rgba(91,127,255,.4);font-size:12px;cursor:pointer;background:rgba(91,127,255,.08);color:var(--blue)">🔄 同步飞书数据</button>` : ''}
      <button onclick="perfView='daily';renderPerf()" style="padding:5px 14px;border-radius:7px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:${perfView==='daily'?'var(--blue)':'var(--surf2)'};color:${perfView==='daily'?'#fff':'var(--muted)'}">📋 今日日报</button>
      <button onclick="perfView='day';renderPerf()" style="padding:5px 14px;border-radius:7px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:${perfView==='day'?'var(--blue)':'var(--surf2)'};color:${perfView==='day'?'#fff':'var(--muted)'}">📅 日打分</button>
      <button onclick="perfView='week';renderPerf()" style="padding:5px 14px;border-radius:7px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:${perfView==='week'?'var(--blue)':'var(--surf2)'};color:${perfView==='week'?'#fff':'var(--muted)'}">📆 周汇总</button>
      <button onclick="perfView='month';renderPerf()" style="padding:5px 14px;border-radius:7px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:${perfView==='month'?'var(--blue)':'var(--surf2)'};color:${perfView==='month'?'#fff':'var(--muted)'}">🗓 月累计</button>
      <button onclick="perfView='report';renderPerf()" style="padding:5px 14px;border-radius:7px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:${perfView==='report'?'var(--blue)':'var(--surf2)'};color:${perfView==='report'?'#fff':'var(--muted)'}">📋 周报</button>
    </div>
  </div>
  ${isAdmin ? `<div id="perf-sync-status" style="font-size:11px;color:var(--muted);min-height:16px;margin-bottom:12px"></div>` : '<div style="margin-bottom:12px"></div>'}

  ${perfView === 'daily' ? renderPerfDailyReport(today) : ''}
  ${perfView === 'day' ? renderPerfDayView(dayData) : ''}

  <!-- 评分说明 -->
  <details style="margin-top:20px">
    <summary style="font-size:12px;color:var(--muted);cursor:pointer;padding:8px 0">📋 评分维度说明</summary>
    <div style="background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:8px;font-size:12px;color:var(--muted);line-height:1.8">
      <b style="color:var(--text)">总分100分（含附加分）</b><br>
      • <b style="color:var(--text)">日常建联（40分）</b>：数量达标15分 + 信息完整10分 + 博主类型10分 + 粉丝记录5分｜数据来源：飞书表格<br>
      • <b style="color:var(--text)">截图上传（30分）</b>：复盘截图10分 + 建联成功截图10分 + 建联列表截图10分｜数据来源：每日签到<br>

    </div>

function renderPerfDailyReport(today) {
  const SUCCESS_STATUSES = ['引导到私域了', '二次回访成功'];
  const CONTACT_STATUSES = ['抖音私信建联', '小红书私信建联', '微信建联', '微信私信建联',
    '引导到私域了', '二次回访成功', '没引导到私域', '需要且未二次回访'];
  const TARGET_SUCCESS = 3; // 每日建联成功目标

  const activeMembers = CHECKIN_MEMBERS.filter(m => memberStatusMap[m.name] !== 'inactive');

  const memberData = activeMembers.map(m => {
    const todayRows = ALL_ROWS.filter(r =>
      (r.owner || '').trim() === m.name &&
      r.record_date === today &&
      !r.is_dup
    );
    const contacted = todayRows.filter(r => CONTACT_STATUSES.includes(r.status)).length;
    const success   = todayRows.filter(r => SUCCESS_STATUSES.includes(r.status)).length;
    const reached   = success >= TARGET_SUCCESS;
    const successRate = contacted > 0 ? (success / contacted * 100).toFixed(1) : '0.0';
    return { name: m.name, contacted, success, successRate, reached, total: todayRows.length };
  });

  const reachedCount = memberData.filter(m => m.reached).length;
  const totalSuccess = memberData.reduce((a, m) => a + m.success, 0);
  const totalContacted = memberData.reduce((a, m) => a + m.contacted, 0);

  const dateStr = new Date(today).toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });

  return `
    <div style="background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px">
        <div>
          <div style="font-size:15px;font-weight:700;color:var(--text)">📋 今日工作日报</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${dateStr} · 建联成功目标 ≥ ${TARGET_SUCCESS} 位/人</div>
        </div>
        <div style="display:flex;gap:10px">
          <div style="text-align:center">
            <div style="font-size:20px;font-weight:800;color:var(--green)">${reachedCount}</div>
            <div style="font-size:11px;color:var(--muted)">达标人数</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:20px;font-weight:800;color:var(--red)">${activeMembers.length - reachedCount}</div>
            <div style="font-size:11px;color:var(--muted)">未达标</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:20px;font-weight:800;color:var(--blue)">${totalSuccess}</div>
            <div style="font-size:11px;color:var(--muted)">今日总成功</div>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px">
        ${memberData.map(m => {
          const pct = Math.min(100, m.success / TARGET_SUCCESS * 100);
          const color = m.reached ? 'var(--green)' : m.success > 0 ? 'var(--gold)' : 'var(--red)';
          const tag = m.reached
            ? `<span style="font-size:11px;font-weight:700;color:var(--green);background:rgba(67,217,164,.1);border:1px solid rgba(67,217,164,.3);border-radius:5px;padding:2px 8px">✅ 已达标</span>`
            : `<span style="font-size:11px;font-weight:700;color:var(--red);background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);border-radius:5px;padding:2px 8px">❌ 未达标（差${TARGET_SUCCESS - m.success}个）</span>`;
          return `
            <div style="background:var(--surf2);border-radius:10px;padding:12px 14px">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">
                <div style="display:flex;align-items:center;gap:8px">
                  <span style="font-size:14px;font-weight:600;color:var(--text)">${m.name}</span>
                  ${tag}
                </div>
                <div style="font-size:12px;color:var(--muted)">
                  已联系 ${m.contacted} 位 · 成功 <b style="color:${color}">${m.success}</b> 位 · 转化率 ${m.successRate}%
                </div>
              </div>
              <div style="height:6px;background:var(--surf);border-radius:4px;overflow:hidden">
                <div style="height:100%;width:${pct}%;background:${color};border-radius:4px;transition:width .4s"></div>
              </div>
              <div style="font-size:11px;color:var(--muted);margin-top:4px">${m.success}/${TARGET_SUCCESS} · ${pct.toFixed(0)}%</div>
            </div>`;
        }).join('')}
      </div>

      ${totalContacted === 0 ? `
        <div style="text-align:center;padding:20px;color:var(--muted);font-size:13px;margin-top:8px">
          今日暂无建联数据（数据来自飞书同步，若刚填写可点击「最后同步」按钮手动同步）
        </div>` : ''}
    </div>`;
}

              ).join('')
            ).join('')}
          </tr>
        </thead>
        <tbody>
          ${perfData.map((m, mi) => {
            const gc = perfGrade(m.total);
            const today = new Date().toISOString().slice(0,10);
            // 计算每天各项分数
            const dayScores = wk.dates.map(d => {
              const future = d > today;
              const cnt = m.contactDetail[d] || 0;
              const rec = (checkinData[d]||{})[m.name]||{};
              const chatN = (rec.chat||[]).length;
              const blogN = (rec.blogger||[]).length;
              const reviewN = (rec.review||[]).length;
              const totalImgs = chatN + blogN + reviewN;

              // 建联分（当日贡献，满分3分/天 → 周×5=15，此处显示当日占比）
              let contactPt = future ? null : cnt >= 5 ? 3 : cnt > 0 ? 1 : 0;

              // 截图分（每类有上传得2，满分6/天 → 周最多30）
              let screenshotPt = future ? null : (chatN>0?2:0) + (blogN>0?2:0) + (reviewN>0?2:0);

              // 附加分（话术库当日+适配度）
              let bonusPt = future ? null : 0;
              let bonusTacticsCnt = 0, bonusTacticsPt = 0, bonusCompatPt = 0;
              if (!future) {
                // 话术库：每条 +2 分（周维度上限20分）
                bonusTacticsCnt = chatScriptRows.filter(r => {
                  if (!r.member || r.member !== m.name) return false;
                  try { return new Date(r.date?.replace(/\//g,'-')).toISOString().slice(0,10) === d; } catch(e){ return false; }
                }).length;
                bonusTacticsPt = bonusTacticsCnt * 2;
                // 适配度：当日无建联成功 + 平均分≥70 → +20
                const hasSuccess = ALL_ROWS.some(r =>
                  r.owner?.trim()===m.name && r.record_date===d && STATUS_SUCCESS.includes(r.status) && !r.is_dup
                );
                if (!hasSuccess) {
                  const dayCompat = (window.compatScoreCache||[]).filter(r => r.member_name===m.name && r.score_date===d);
                  if (dayCompat.length) {
                    const avg = dayCompat.reduce((s,r)=>s+(r.compat_score||0),0)/dayCompat.length;
                    if (avg >= 70) bonusCompatPt = 20;
                  }
                }
                bonusPt = bonusTacticsPt + bonusCompatPt;
              }

              const dayTotal = future ? null : contactPt + screenshotPt + bonusPt;
              return { cnt, chatN, blogN, reviewN, totalImgs, contactPt, screenshotPt, bonusPt, bonusTacticsCnt, bonusTacticsPt, bonusCompatPt, dayTotal, future };
            });

            return `<tr style="background:${mi%2?'rgba(255,255,255,.015)':'transparent'}">
              <td style="padding:8px 10px;font-weight:600;color:var(--text);border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap">${m.name}</td>
              ${dayScores.map((ds, di) => {
                if (ds.future) return `
                  <td colspan="4" style="padding:5px 4px;text-align:center;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.04);border-left:1px solid rgba(255,255,255,.06);font-size:11px">—</td>`;

                const cColor = ds.cnt>=5?'var(--green)':ds.cnt>0?'var(--gold)':'var(--red)';
                const sColor = ds.screenshotPt>=6?'var(--green)':ds.screenshotPt>0?'var(--gold)':'var(--red)';
                const bColor = ds.bonusPt>0?'var(--green)':'var(--muted)';

                // 截图tooltip
                const sTitle = `聊天${ds.chatN}张 建联${ds.blogN}张 复盘${ds.reviewN}张`;
                // 附加分tooltip
                const bParts = [];
                if (ds.bonusTacticsPt > 0) bParts.push(`话术库${ds.bonusTacticsCnt}条×2 = +${ds.bonusTacticsPt}`);
                if (ds.bonusCompatPt > 0) bParts.push(`适配度平均≥70→+20`);
                const bTitle = bParts.length ? bParts.join(' · ') : '暂无附加分（话术库0条，适配度未达标或有建联成功）';
                const bIcon = ds.bonusCompatPt > 0 ? '🎯' : ds.bonusTacticsPt > 0 ? '💬' : '';

                return `
                  <td style="padding:5px 3px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04);border-left:1px solid rgba(255,255,255,.06)">
                    <div style="font-weight:700;color:${cColor};font-size:13px">+${ds.contactPt}</div>
                    <div style="font-size:10px;color:var(--muted)">${ds.cnt}位</div>
                  </td>
                  <td style="padding:5px 3px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)" title="${sTitle}">
                    <div style="font-weight:700;color:${sColor};font-size:13px">+${ds.screenshotPt}</div>
                    <div style="font-size:10px;color:var(--muted)">${ds.totalImgs}张</div>
                  </td>
                  <td style="padding:5px 3px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)" title="${bTitle}">
                    <div style="font-weight:700;color:${bColor};font-size:13px">${ds.bonusPt>0?'+'+ds.bonusPt:'—'}</div>
                    <div style="font-size:10px;color:var(--muted)">${bIcon}${ds.bonusTacticsCnt>0&&!ds.bonusCompatPt?ds.bonusTacticsCnt+'条':''}</div>
                  </td>
                  <td style="padding:5px 3px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)">
                    <div style="font-weight:800;font-size:14px;color:var(--text)">${ds.dayTotal}</div>
                  </td>`;
              }).join('')}
              <td style="padding:8px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04);border-left:1px solid rgba(255,255,255,.06);font-weight:800;font-size:16px;color:${gc.color}">${m.total}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <!-- 图例 -->
    <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted)">
      <span>建联分：≥5位 <b style="color:var(--green)">+3</b> · 1-4位 <b style="color:var(--gold)">+1</b> · 0位 <b style="color:var(--red)">+0</b></span>
      <span>截图分：每类有上传 <b style="color:var(--green)">+2</b>（建联列表/建联成功/复盘各+2，满+6）</span>
      <span>附加分：💬 话术库每条 <b style="color:var(--green)">+2</b>（周上限20分）· 🎯 适配度平均≥70且当日无建联成功 <b style="color:var(--green)">+20/天</b></span>
    </div>
  </div>`;
}

function renderPerfMonthView() {
  // 取当前月所有周
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const today = now.toISOString().slice(0,10);

  // 当月所有日期
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const monthDates = Array.from({length:daysInMonth}, (_,i) => {
    return `${ym}-${String(i+1).padStart(2,'0')}`;
  }).filter(d => d <= today);

  const monthPerf = CHECKIN_MEMBERS.map(m => ({
    name: m.name,
    ...calcMemberPerf(m.name, monthDates)
  })).sort((a,b) => b.total - a.total);

  // 按周分组计算趋势
  const weeks = [];
  for (let off = -3; off <= 0; off++) {
    const wk = perfWeekDates(off);
    const wDates = wk.dates.filter(d => d.startsWith(ym) && d <= today);
    if (wDates.length > 0) weeks.push({ label: `W${wk.weekNum}`, dates: wDates });
  }

  return `
  <div style="font-size:13px;color:var(--muted);margin-bottom:16px">📅 ${now.getFullYear()}年${now.getMonth()+1}月  · 截至今日</div>

  <!-- 月度排名卡 -->
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:18px">
    ${(() => {
      const total = monthPerf.length;
      const bottomN = Math.max(1, Math.ceil(total * 0.2));
      return monthPerf.map((m, i) => {
        const gc = perfGrade(m.total);
        const rank = i + 1;
        const isBottom = rank > total - bottomN;
        const checkinDays = monthDates.filter(d => {
          const rec = (checkinData[d]||{})[m.name]||{};
          return (rec.chat||[]).length>0||(rec.review||[]).length>0||(rec.blogger||[]).length>0;
        }).length;
        return `<div style="background:var(--surf);border:1px solid ${isBottom?'rgba(255,107,107,.35)':'var(--border)'};border-radius:12px;padding:14px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
            <div style="font-size:14px;font-weight:600;color:var(--text)">${m.name}</div>
            <div style="font-size:11px;color:var(--muted)">#${rank}</div>
          </div>
          <div style="font-size:32px;font-weight:800;color:${gc.color};line-height:1">${m.total}</div>
          <div style="margin-top:8px;font-size:11px;color:var(--muted)">
            建联${m.totalContact}位 · 打卡${checkinDays}天 · 成功${m.totalSuccess}位
          </div>
          ${m.bonusTotal>0?`<div style="font-size:11px;color:var(--green);margin-top:4px">+${m.bonusTotal} 附加分</div>`:''}
          ${isBottom?`<div style="font-size:11px;color:var(--red);margin-top:4px">⚠️ 月度末位20% · 待复核</div>`:''}
        </div>`;
      }).join('');
    })()}
  </div>

  <!-- 周趋势表 -->
  <div style="background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:16px">
    <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px">📈 本月各周趋势</div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead>
          <tr>
            <th style="padding:7px 10px;text-align:left;color:var(--muted);border-bottom:1px solid var(--border)">姓名</th>
            ${weeks.map(w=>`<th style="padding:7px 8px;text-align:center;color:var(--muted);border-bottom:1px solid var(--border)">${w.label}</th>`).join('')}
            <th style="padding:7px 8px;text-align:center;color:var(--muted);border-bottom:1px solid var(--border)">月累计</th>
            
          </tr>
        </thead>
        <tbody>
          ${(() => {
            const total = monthPerf.length;
            const bottomN = Math.max(1, Math.ceil(total * 0.2));
            return monthPerf.map((m,i)=>{
            const gc = perfGrade(m.total);
            const isBottom = (i+1) > total - bottomN;
            return `<tr style="background:${i%2?'rgba(255,255,255,.01)':'transparent'}">
              <td style="padding:7px 10px;font-weight:600;color:${isBottom?'var(--red)':'var(--text)'};border-bottom:1px solid rgba(255,255,255,.03)">${m.name}${isBottom?' ⚠️':''}</td>
              ${weeks.map(w=>{
                const wperf = calcMemberPerf(m.name, w.dates);
                const wgc = perfGrade(wperf.total);
                return `<td style="padding:7px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,.03)">
                  <span style="color:${wgc.color};font-weight:600">${wperf.total}</span>
                </td>`;
              }).join('')}
              <td style="padding:7px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,.03);font-weight:700;color:${gc.color}">${m.total}</td>
            </tr>`;
          }).join('');
          })()}
        </tbody>
      </table>
    </div>
  </div>`;
}

// 📋 周报（自动/手动生成的绩效评估报告）
// ══════════════════════════════════════════
let perfReportList = [];
let perfReportCurrent = null; // 当前展示的报告详情 {period_key, period_label, report_data, ...}
let perfReportLoading = false;
let perfReportProgress = null; // { done, total, label }

async function perfReportLoadList() {
  try {
    const resp = await fetch(`${window.location.origin}/api/perf-report/list`);
    const data = await resp.json();
    perfReportList = Array.isArray(data) ? data : [];
  } catch(e) {
    perfReportList = [];
  }
}

function perfCurrentMonday() {
  const now = new Date();
  const day = now.getDay() || 7;
  const mon = new Date(now);
  mon.setDate(now.getDate() - day + 1);
  return mon.toISOString().slice(0,10);
}

function perfReportRerender() {
  const pane = document.getElementById('pane-perf');
  if (pane && pane.style.display === 'none') return; // 绩效Tab未显示时不重渲染
  rendered.delete('perf'); renderPerf(); rendered.add('perf');
}

// 分步生成：init → 逐个 gen-member → gen-overview → gen-bottom
async function perfReportGenerate(monday, force) {
  if (perfReportLoading) return;
  perfReportLoading = true;
  perfReportProgress = { done: 0, total: 1, label: '正在初始化报告...' };
  perfReportRerender();

  try {
    // Step 1: init
    const initResp = await fetch(`${window.location.origin}/api/perf-report/init`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ monday, force: !!force })
    });
    const initData = await initResp.json();
    if (initData.error) throw new Error(initData.error);

    if (initData.skipped) {
      await perfReportLoadList();
      if (initData.period_key) await perfReportOpen(initData.period_key);
      perfReportLoading = false;
      perfReportProgress = null;
      perfReportRerender();
      return;
    }

    const periodKey = initData.period_key;
    const memberNames = initData.member_names || [];
    const totalSteps = initData.total_steps || (memberNames.length + 2);
    perfReportProgress = { done: 0, total: totalSteps, label: `已计算各成员分数，开始生成分析文本...` };
    perfReportRerender();

    // Step 2: 逐个成员生成AI文本
    for (let i = 0; i < memberNames.length; i++) {
      const name = memberNames[i];
      perfReportProgress = { done: i, total: totalSteps, label: `正在生成 ${name} 的绩效分析（${i+1}/${memberNames.length}）...` };
      perfReportRerender();
      const r = await fetch(`${window.location.origin}/api/perf-report/gen-member`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ period_key: periodKey, member_name: name })
      });
      const d = await r.json();
      if (d.error) throw new Error(`${name}: ${d.error}`);
      perfReportProgress = { done: i+1, total: totalSteps, label: `已完成 ${name} 的绩效分析` };
      perfReportRerender();
    }

    // Step 3: 数据概况
    perfReportProgress = { done: memberNames.length, total: totalSteps, label: '正在生成整体数据概况...' };
    perfReportRerender();
    const ovResp = await fetch(`${window.location.origin}/api/perf-report/gen-overview`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ period_key: periodKey })
    });
    const ovData = await ovResp.json();
    if (ovData.error) throw new Error(ovData.error);
    perfReportProgress = { done: memberNames.length + 1, total: totalSteps, label: '已生成数据概况' };
    perfReportRerender();

    // Step 4: 末位建议 + 标记完成
    perfReportProgress = { done: memberNames.length + 1, total: totalSteps, label: '正在生成末位管理建议...' };
    perfReportRerender();
    const botResp = await fetch(`${window.location.origin}/api/perf-report/gen-bottom`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ period_key: periodKey })
    });
    const botData = await botResp.json();
    if (botData.error) throw new Error(botData.error);
    perfReportProgress = { done: totalSteps, total: totalSteps, label: '✅ 报告生成完成' };
    perfReportRerender();

    await perfReportLoadList();
    await perfReportOpen(periodKey);
  } catch(e) {
    alert('生成失败：' + e.message);
  }
  perfReportLoading = false;
  perfReportProgress = null;
  perfReportRerender();
}

async function perfReportOpen(periodKey) {
  perfReportLoading = true;
  perfReportProgress = { done: 0, total: 1, label: '加载报告...' };
  rendered.delete('perf'); renderPerf(); rendered.add('perf');
  try {
    const resp = await fetch(`${window.location.origin}/api/perf-report/get?period_key=${encodeURIComponent(periodKey)}`);
    const data = await resp.json();
    if (!data.error) perfReportCurrent = data;
  } catch(e) {}
  perfReportLoading = false;
  perfReportProgress = null;
  rendered.delete('perf'); renderPerf(); rendered.add('perf');
}

function perfReportBack() {
  perfReportCurrent = null;
  rendered.delete('perf'); renderPerf(); rendered.add('perf');
}

// 将 AI 返回的 【小标题】内容 文本转换为简单HTML
function perfReportAiTextToHtml(text) {
  if (!text) return '<div style="color:var(--muted);font-size:12px">（AI未返回内容）</div>';
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  let html = '';
  lines.forEach(line => {
    const headerMatch = line.match(/^【(.+?)】\s*(.*)$/);
    if (headerMatch) {
      html += `<div style="font-size:12px;font-weight:700;color:var(--blue);margin-top:8px">${trEscapeHtml(headerMatch[1])}</div>`;
      if (headerMatch[2]) html += `<div style="font-size:12px;color:var(--text);margin-top:2px">${trEscapeHtml(headerMatch[2])}</div>`;
    } else {
      const cleaned = line.replace(/^[-•·]\s*/, '');
      html += `<div style="font-size:12px;color:var(--text);margin-top:2px;padding-left:12px;position:relative"><span style="position:absolute;left:0;color:var(--muted)">·</span>${trEscapeHtml(cleaned)}</div>`;
    }
  });
  return html;
}

// 知识检测：单题多选
const TR_QUIZ = {
  q: '作为运营组新人，以下哪些是你每天/每周必须做的事情？（多选，选出所有正确项）',
  opts: [

    '当日24:00前上传三类签到截图（复盘/建联成功/建联列表）',
    '飞书表格里发现D列变红（重复）要立即删除该行',
    '建联成功后及时把回复情况改成"引导到私域了"',
    '攒到周五一次性补填本周所有飞书数据即可',
    '博主类型（K列）可以不填，不影响评分',
  ],
  correctSet: [0,1,2,3],
  fb: '前四项是每天/每次建联都要做的：数量达标3-5位、当日24:00前传齐三类截图、删除重复行（否则不计分还拉低完整性）、及时更新建联成功状态（影响成功率和"建联数量达标"判定）。最后两项是错的——飞书要每天填写而不是攒到周五；博主类型会计入"博主类型达标(10分)"，不填会扣分。'
};

const TR_TOTAL_STEPS = 11; // 不含证书页，证书算第12页
const TR_STEP_TITLES = [
  '欢迎加入','核心职责','建联表格填写规范','建联状态说明','每日签到与截图',
  '绩效评分总览','截图与质量细则','附加分与系统工具','末位管理与红线','知识检测','答疑环节'
];

let trState = {
  step: 0,
  name: (typeof checkinCurrentMember !== 'undefined' && checkinCurrentMember) ? checkinCurrentMember : '',
  quizSelected: [],     // 多选已选下标
  quizSubmitted: false,
  qaHistory: [],        // {role:'user'|'ai', text}
};

function trEscapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTraining(){
  const el = document.getElementById('pane-training');
  el.innerHTML = `
    <div class="tr-app">
      <div class="tr-progress-track"><div class="tr-progress-fill" id="trProgressFill"></div></div>
      <div class="tr-step-label">
        <span id="trStepLabel">开始</span>
        <span class="tr-badge" id="trStepBadge">运营组新人培训</span>
      </div>
      <div class="tr-content" id="trContent"></div>
      <div class="tr-nav" id="trNav"></div>
    </div>
  `;
  trRender();
}

function trRender(){
  const content = document.getElementById('trContent');
  const nav = document.getElementById('trNav');
  const progressFill = document.getElementById('trProgressFill');
  const stepLabel = document.getElementById('trStepLabel');
  const stepBadge = document.getElementById('trStepBadge');

  if(trState.step === 0){
    progressFill.style.width = '0%';
    stepLabel.textContent = '开始';
  } else if(trState.step <= TR_TOTAL_STEPS){
    progressFill.style.width = (trState.step / (TR_TOTAL_STEPS+1) * 100) + '%';
    stepLabel.textContent = `步骤 ${trState.step} / ${TR_TOTAL_STEPS}`;
  } else {
    progressFill.style.width = '100%';
    stepLabel.textContent = '完成';
  }
  stepBadge.textContent = trState.step === 0 ? '运营组新人培训'
    : trState.step <= TR_TOTAL_STEPS ? TR_STEP_TITLES[trState.step-1]
    : '培训证书';

  content.innerHTML = trRenderContent();
  nav.innerHTML = trRenderNav();
  trBindEvents();
}

function trRenderContent(){
  switch(trState.step){
    case 0: return trScreenName();
    case 1: return trScreenWelcome();
    case 2: return trScreenDuties();
    case 3: return trScreenTable();
    case 4: return trScreenStatus();
    case 5: return trScreenCheckin();
    case 6: return trScreenScoreOverview();
    case 7: return trScreenScoreDetail();
    case 8: return trScreenBonusTools();
    case 9: return trScreenRedlines();
    case 10: return trScreenQuiz();
    case 11: return trScreenQA();
    case 12: return trScreenCertificate();
    default: return '';
  }
}

function trRenderNav(){
  if(trState.step === 0){
    return `<div></div><button class="tr-btn tr-primary" id="trBtnNext" ${trState.name.trim()?'':'disabled'}>开始培训 →</button>`;
  }
  if(trState.step === TR_TOTAL_STEPS + 1){
    return ''; // 证书页自带按钮
  }
  if(trState.step === TR_TOTAL_STEPS - 1){
    // 知识检测：先"提交答案"，提交后变"下一步"
    const backBtn = `<button class="tr-btn tr-ghost" id="trBtnBack">← 上一步</button>`;
    if(!trState.quizSubmitted){
      const disabled = trState.quizSelected.length === 0;
      return `${backBtn}<button class="tr-btn tr-primary" id="trBtnQuizSubmit" ${disabled?'disabled':''}>提交答案</button>`;
    }
    return `${backBtn}<button class="tr-btn tr-primary" id="trBtnNext">答疑环节 →</button>`;
  }
  const backBtn = `<button class="tr-btn tr-ghost" id="trBtnBack">← 上一步</button>`;
  let nextLabel = '下一步 →';
  if(trState.step === TR_TOTAL_STEPS - 2) nextLabel = '知识检测 →';
  if(trState.step === TR_TOTAL_STEPS) nextLabel = '领取证书 →';
  return `${backBtn}<button class="tr-btn tr-primary" id="trBtnNext">${nextLabel}</button>`;
}

function trBindEvents(){
  const btnNext = document.getElementById('trBtnNext');
  const btnBack = document.getElementById('trBtnBack');

  if(btnNext) btnNext.onclick = () => { trState.step++; trRender(); };
  if(btnBack) btnBack.onclick = () => { trState.step--; trRender(); };

  if(trState.step === 0){
    const input = document.getElementById('trNameInput');
    input.addEventListener('input', e => {
      trState.name = e.target.value;
      document.getElementById('trBtnNext').disabled = !trState.name.trim();
    });
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter' && trState.name.trim()){ trState.step++; trRender(); }
    });
    input.focus();
  }

  if(trState.step === TR_TOTAL_STEPS - 1){
    // 多选选项点击
    if(!trState.quizSubmitted){
      document.querySelectorAll('.tr-quiz-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const oi = parseInt(btn.dataset.o);
          const idx = trState.quizSelected.indexOf(oi);
          if(idx >= 0) trState.quizSelected.splice(idx, 1);
          else trState.quizSelected.push(oi);
          trRender();
        });
      });
    }
    const submitBtn = document.getElementById('trBtnQuizSubmit');
    if(submitBtn) submitBtn.onclick = () => { trState.quizSubmitted = true; trRender(); };
  }

  if(trState.step === TR_TOTAL_STEPS){
    // 答疑环节
    if(typeof kbItems !== 'undefined' && kbItems.length === 0 && typeof loadKbList === 'function'){
      loadKbList();
    }
    const sendBtn = document.getElementById('trQaSend');
    const input = document.getElementById('trQaInput');
    if(sendBtn) sendBtn.onclick = () => trAskAI();
    if(input) input.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); trAskAI(); }
    });
  }

  if(trState.step === TR_TOTAL_STEPS + 1){
    const printBtn = document.getElementById('trBtnPrint');
    if(printBtn) printBtn.onclick = () => window.print();
    const restartBtn = document.getElementById('trBtnRestart');
    if(restartBtn) restartBtn.onclick = () => {
      trState = { step:0, name:'', quizSelected:[], quizSubmitted:false, qaHistory:[] };
      trRender();
    };
  }
}

// 答疑环节：基于知识库的AI问答
async function trAskAI(){
  const input = document.getElementById('trQaInput');
  const q = (input.value || '').trim();
  if(!q) return;
  input.value = '';
  trState.qaHistory.push({ role:'user', text:q });
  trState.qaHistory.push({ role:'ai', text:'__loading__' });
  trRender();

  try {
    const kbContext = (typeof kbItems !== 'undefined' && kbItems.length > 0)
      ? kbItems.map(i => `【${i.category}·${i.title}】\n${i.content}`).join('\n\n')
      : '（暂无知识库材料）';

    const trainingContext = '【新人培训要点】\n'
      + '1. 每个工作日主动建联博主3-5位，粉丝数尽量≤5万，优先垂类/生活方式类/中小型/近期活跃的博主。\n'
      + '2. 飞书表格须当天填写（B链接/C回复情况/D博主名/E粉丝量/F博主号/K博主类型），D列变红的重复行须立即删除（已重复记录不计分）。\n'
      + '3. 回复情况分四类：建联中（私信建联）/✅成功（引导到私域了、二次回访成功）/待跟进（需要且未二次回访）/已结束（拒绝等）。\n'
      + '4. 每日24:00前在「✅签到」上传复盘截图、建联成功截图、建联列表截图三类，飞书填表不能替代签到。\n'
      + '5. 周绩效共100分：日常建联40（建联数量达标15，需当日邀请数≥5且建联成功数≥3；表格完整性10；博主类型10；粉丝记录5）+ 截图上传30（三类各10，按本周上传天数/5×10折算）+ 工作质量20（建联成功率）+ 附加分计入总分最多10（话术库+2/条，适配度达标+20/天）。\n'
      + '6. 末位管理：不分ABCD等级，按总分排名，后20%进入观察；伪造记录或截图该维度记0分并立即末位复核。\n'
      + '7. 系统小工具：截图识别（AI提取博主信息）、建联排序、回访提醒（2天/4天）、数据分析。';

    const systemPrompt = '你是"博主建联看板"系统里给运营组新人答疑的助手。请优先依据下面的【新人培训要点】和【知识库材料】回答问题；'
      + '如果问题超出这些材料范围，回复"这个问题超出我的知识范围，建议询问Leader或管理员"。回答要简洁、口语化、对新人友好，尽量在150字以内。\n\n'
      + trainingContext + '\n\n【知识库材料】\n' + kbContext;

    const resp = await fetch(window.location.origin + '/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: systemPrompt + '\n\n新人提问：' + q, max_tokens: 300 })
    });
    const data = await resp.json();
    const answer = data.text || '抱歉，暂时无法回答，请询问管理员';
    trState.qaHistory[trState.qaHistory.length - 1] = { role:'ai', text: answer };
  } catch(e) {
    trState.qaHistory[trState.qaHistory.length - 1] = { role:'ai', text: '请求失败，请稍后重试' };
  }
  trRender();
  const hist = document.getElementById('trQaHistory');
  if(hist) hist.scrollTop = hist.scrollHeight;
}

function trScreenQuiz(){
  const item = TR_QUIZ;
  const submitted = trState.quizSubmitted;
  const opts = item.opts.map((opt, oi) => {
    const isSelected = trState.quizSelected.includes(oi);
    const isCorrect = item.correctSet.includes(oi);
    let cls = '';
    if(submitted){
      if(isCorrect && isSelected) cls = 'tr-correct';        // ✅ 选对了
      else if(!isCorrect && isSelected) cls = 'tr-wrong';      // ❌ 多选错了
      else if(isCorrect && !isSelected) cls = 'tr-missed';     // ⭕ 漏选
    } else if(isSelected){
      cls = 'tr-selected';
    }
    let mark = '';
    if(submitted){
      if(isCorrect && isSelected) mark = '✅ ';
      else if(!isCorrect && isSelected) mark = '❌ ';
      else if(isCorrect && !isSelected) mark = '⭕ ';
    } else {
      mark = isSelected ? '☑ ' : '☐ ';
    }
    return `<button class="tr-quiz-opt ${cls}" data-o="${oi}" ${submitted?'disabled':''}>${mark}${trEscapeHtml(opt)}</button>`;
  }).join('');

  return `
    <div class="tr-eyebrow">知识检测</div>
    <h1>检验一下今天学到的内容</h1>
    <p class="tr-lead">${trEscapeHtml(item.q)}</p>
    <div class="tr-quiz-box">
      <div class="tr-quiz-q"><span class="tr-qmark">?</span>请勾选所有正确选项</div>
      ${opts}
      ${submitted ? `<div class="tr-quiz-fb"><b>解析：</b>${trEscapeHtml(item.fb)}</div>` : ''}
    </div>
  `;
}
