// 博主分类：可自定义分类列表（存本地，同步到AI补全）
let classifyCustomTypes = JSON.parse(localStorage.getItem('classifyCustomTypes') || '["AI类","作家类","教育类","青年知识类"]');

function classifySaveTypes() {
  localStorage.setItem('classifyCustomTypes', JSON.stringify(classifyCustomTypes));
}

function classifyAddType() {
  const name = prompt('输入新分类名称：');
  if (!name || !name.trim()) return;
  const t = name.trim();
  if (classifyCustomTypes.includes(t)) { alert('该分类已存在'); return; }
  classifyCustomTypes.push(t);
  classifySaveTypes();
  classifyRender();
}

function classifyDeleteType(t) {
  if (!confirm(`确定删除分类「${t}」？已归入该类的博主不会自动更改，需手动重新分类。`)) return;
  classifyCustomTypes = classifyCustomTypes.filter(x => x !== t);
  classifySaveTypes();
  classifyRender();
}

let classifyState = {
  view: 'overview',   // 'overview' | 'detail'
  detailType: '',
  summary: [],
  detail: [],
  total: 0,
  unclassified: 0,
  running: false,
  runProgress: null,  // { processed, total }
  error: '',
};

async function classifyLoadOverview() {
  try {
    const r = await fetch(`${window.location.origin}/api/blogger-classify/list`);
    const d = await r.json();
    if (d.error) { classifyState.error = d.error; return; }
    classifyState.summary = d.summary || [];
    classifyState.total = d.total || 0;
    classifyState.unclassified = d.unclassified || 0;
    classifyState.error = '';
  } catch(e) {
    classifyState.error = e.message;
  }
}

async function classifyLoadDetail(type) {
  classifyState.view = 'detail';
  classifyState.detailType = type;
  classifyState.detail = [];
  classifyRender();
  try {
    const r = await fetch(`${window.location.origin}/api/blogger-classify/detail?type=${encodeURIComponent(type)}`);
    const d = await r.json();
    classifyState.detail = Array.isArray(d) ? d : [];
  } catch(e) {
    classifyState.detail = [];
  }
  classifyRender();
}

async function classifyDeleteRow(id, name) {
  if (!confirm(`确定删除「${name || id}」这条记录吗？\n（会将该条记录标记为"已重复"，不会物理删除数据）`)) return;
  try {
    const r = await fetch(`${window.location.origin}/api/blogger-classify/delete-row?id=${encodeURIComponent(id)}`, { method: 'POST' });
    const d = await r.json();
    if (d.ok) {
      classifyState.detail = classifyState.detail.filter(x => String(x.id) !== String(id));
      classifyRender();
    } else {
      alert('删除失败：' + (d.error || '未知错误'));
    }
  } catch(e) { alert('删除失败：' + e.message); }
}

async function classifyDedup() {
  if (!confirm('确定要删除重复博主记录吗？系统会保留每位博主最新的一条记录（已有分类的优先保留），其余标记为已重复。')) return;
  try {
    const r = await fetch(`${window.location.origin}/api/blogger-classify/dedup`, { method: 'POST' });
    const d = await r.json();
    if (d.error) { alert('去重失败：' + d.error); return; }
    alert(d.message || `✅ 已处理 ${d.deleted} 条重复记录`);
    await classifyLoadOverview();
    classifyRender();
  } catch(e) { alert('去重失败：' + e.message); }
}

async function classifyReset() {
  if (!confirm('确定要清空所有博主的分类吗？清空后需要重新点「AI补全类型」来重新分类。')) return;
  try {
    const r = await fetch(`${window.location.origin}/api/blogger-classify/reset`, { method: 'POST' });
    const d = await r.json();
    if (d.error) { alert('重置失败：' + d.error); return; }
    alert(`✅ 已清空 ${d.cleared} 位博主的分类，请点「AI补全类型」重新分类`);
    await classifyLoadOverview();
    classifyRender();
  } catch(e) { alert('重置失败：' + e.message); }
}

async function classifyRunAI() {
  if (classifyState.running) return;
  if (!classifyState.unclassified) { alert('所有建联成功的博主都已分类'); return; }
  classifyState.running = true;
  classifyState.runProgress = { processed: 0, total: classifyState.unclassified };
  classifyRender();

  // 分批处理，每次50个，直到全部完成（最多跑20批防止意外循环）
  let totalProcessed = 0;
  let maxBatches = 20;
  while (maxBatches-- > 0) {
    try {
      const r = await fetch(`${window.location.origin}/api/blogger-classify/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ limit: 50, types: classifyCustomTypes })
      });
      const d = await r.json();
      if (d.error) { alert('AI分类失败：' + d.error); break; }
      totalProcessed += d.processed || 0;
      classifyState.runProgress = { processed: totalProcessed, total: classifyState.unclassified };
      classifyRender();
      if (!d.processed || d.processed < 50 || (d.remaining !== undefined && d.remaining === 0)) break;
    } catch(e) { alert('请求失败：' + e.message); break; }
  }

  classifyState.running = false;
  classifyState.runProgress = null;
  await classifyLoadOverview();
  classifyRender();
}

async function classifyUpdateType(id, currentType) {
  const typeList = classifyCustomTypes.join(' / ');
  const newType = prompt(`修改博主类型\n当前：${currentType || '未分类'}\n\n可选类型：${typeList}\n（也可以输入新类型名，会自动添加到分类列表）\n\n请输入新类型：`, currentType || '');
  if (!newType || !newType.trim()) return;
  const trimmed = newType.trim();
  if (!classifyCustomTypes.includes(trimmed) && trimmed !== '未分类') {
    if (confirm(`「${trimmed}」不在当前分类列表中，是否同时添加到分类列表？`)) {
      classifyCustomTypes.push(trimmed);
      classifySaveTypes();
    }
  }
  try {
    const updateUrl = `${window.location.origin}/api/blogger-classify/update-type?id=${encodeURIComponent(id)}&type=${encodeURIComponent(trimmed)}`;
    const r = await fetch(updateUrl, { method: 'POST' });
    console.log('[classify] update-type url:', updateUrl);
    const d = await r.json();
    if (d.ok) {
      const item = classifyState.detail.find(x => x.id === id);
      if (item) item.blogger_type = trimmed;
      classifyRender();
    }
  } catch(e) { alert('修改失败：' + e.message); }
}

function classifyRender() {
  const el = document.getElementById('pane-classify');
  if (!el) return;
  // 构建临时数据 map 供按钮处理函数读取（避免特殊字符转义问题）
  window._classifyRowMap = {};
  if (classifyState.detail && classifyState.detail.length) {
    classifyState.detail.forEach(r => {
      window._classifyRowMap[r.id] = r;
    });
  }
  el.innerHTML = renderClassifyContent();
  el.onclick = function(e) {
    const editBtn = e.target.closest('.cl-edit-btn');
    const delBtn = e.target.closest('.cl-del-btn');
    if (editBtn) {
      const id = editBtn.dataset.id;
      console.log('[classify] edit clicked, id=', id, 'map keys=', Object.keys(window._classifyRowMap).slice(0,3));
      const row = window._classifyRowMap[id] || {};
      console.log('[classify] row found=', row);
      classifyUpdateType(id, row.blogger_type || '');
    }
    if (delBtn) {
      const id = delBtn.dataset.id;
      console.log('[classify] del clicked, id=', id);
      const row = window._classifyRowMap[id] || {};
      classifyDeleteRow(id, row.name || '');
    }
  };
}

function renderClassify() {
  classifyLoadOverview().then(() => classifyRender());
  classifyRender();
}

function renderClassifyContent() {
  const s = classifyState;

  // ── 顶部工具栏 ──
  const toolbar = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:16px;font-weight:700;color:var(--text)">🏷 博主分类</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">
          建联成功博主共 <b style="color:var(--text)">${s.total}</b> 位，
          未分类 <b style="color:${s.unclassified>0?'var(--gold)':'var(--green)'}">${s.unclassified}</b> 位
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${s.view === 'detail' ? `<button onclick="classifyState.view='overview';classifyRender()" style="background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:6px 14px;font-size:12px;cursor:pointer">← 返回概况</button>` : ''}
        ${s.unclassified > 0 && !s.running ? `<button onclick="classifyRunAI()" style="background:var(--blue);border:none;color:#fff;border-radius:7px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer">🤖 AI补全类型（${s.unclassified}位）</button>` : ''}
        ${s.running ? `
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:140px;height:6px;background:var(--surf2);border-radius:4px;overflow:hidden">
              <div style="height:100%;width:${s.runProgress ? Math.round(s.runProgress.processed/s.runProgress.total*100) : 20}%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:4px;transition:width .4s"></div>
            </div>
            <span style="font-size:11px;color:var(--muted)">分类中 ${s.runProgress?.processed||0}/${s.runProgress?.total||'?'}</span>
          </div>` : ''}
        <button onclick="classifyDedup()" style="background:transparent;border:1px solid rgba(245,166,35,.4);color:var(--gold);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer">🔍 删除重复</button>
        <button onclick="classifyAddType()" style="background:rgba(67,217,164,.08);border:1px solid rgba(67,217,164,.4);color:var(--green);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer">＋ 添加分类</button>
        <button onclick="classifyReset()" style="background:transparent;border:1px solid rgba(255,107,107,.4);color:var(--red);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer">🗑 重置分类</button>
        <button onclick="classifyLoadOverview().then(()=>classifyRender())" style="background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer">↺ 刷新</button>
      </div>
    </div>`;

  if (s.error) {
    return `<div style="max-width:1000px">${toolbar}<div style="color:var(--red);font-size:13px">加载失败：${s.error}</div></div>`;
  }

  // ── 详情视图 ──
  if (s.view === 'detail') {
    const color = BLOGGER_TYPE_COLORS[s.detailType] || '#6b7280';
    const rows = s.detail;
    return `<div style="max-width:1000px">${toolbar}
      <div style="background:var(--surf);border:1px solid var(--border);border-radius:12px;overflow:hidden">
        <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
          <span style="width:10px;height:10px;border-radius:50%;background:${color};display:inline-block"></span>
          <span style="font-size:14px;font-weight:700;color:var(--text)">${s.detailType}</span>
          <span style="font-size:12px;color:var(--muted)">${rows.length} 位博主</span>
        </div>
        ${rows.length === 0 ? `<div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">加载中...</div>` : `
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
              <tr style="border-bottom:1px solid var(--border)">
                <th style="padding:10px 14px;text-align:left;color:var(--muted);font-weight:600">博主名</th>
                <th style="padding:10px 14px;text-align:left;color:var(--muted);font-weight:600">账号</th>
                <th style="padding:10px 14px;text-align:left;color:var(--muted);font-weight:600">粉丝量</th>
                <th style="padding:10px 14px;text-align:left;color:var(--muted);font-weight:600">跟进人</th>
                <th style="padding:10px 14px;text-align:left;color:var(--muted);font-weight:600">建联日期</th>
                <th style="padding:10px 14px;text-align:left;color:var(--muted);font-weight:600">操作</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr style="border-bottom:1px solid var(--border)" onmouseover="this.style.background='rgba(255,255,255,.03)'" onmouseout="this.style.background=''">
                  <td style="padding:9px 14px;color:var(--text);font-weight:500">
                    ${r.link ? `<a href="${r.link}" target="_blank" style="color:var(--text);text-decoration:none" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color='var(--text)'">${r.name || '—'} ↗</a>` : (r.name || '—')}
                  </td>
                  <td style="padding:9px 14px;color:var(--muted)">${r.account || '—'}</td>
                  <td style="padding:9px 14px;color:var(--muted)">${r.followers ? r.followers + '万' : '—'}</td>
                  <td style="padding:9px 14px;color:var(--muted)">${r.owner || '—'}</td>
                  <td style="padding:9px 14px;color:var(--muted)">${r.record_date || '—'}</td>
                  <td style="padding:9px 14px">
                    <button class="cl-edit-btn" data-id="${r.id}" style="font-size:11px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:2px 8px;cursor:pointer">修改类型</button>
                    <button class="cl-del-btn" data-id="${r.id}" style="font-size:11px;background:transparent;border:1px solid rgba(255,107,107,.4);color:var(--red);border-radius:5px;padding:2px 8px;cursor:pointer">🗑 删除</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`}
      </div>
    </div>`;
  }

  // ── 概况视图 ──
  if (!s.summary.length) {
    return `<div style="max-width:1000px">${toolbar}<div style="text-align:center;padding:60px;color:var(--muted);font-size:13px">${s.total === 0 ? '暂无建联成功的博主数据' : '加载中...'}</div></div>`;
  }

  // 分类管理标签
  const typeTagsHtml = `
    <div style="margin-bottom:14px;padding:12px 14px;background:var(--surf);border:1px solid var(--border);border-radius:10px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:600">当前分类（AI补全时使用这些类别）</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        ${classifyCustomTypes.map(t => `
          <span style="display:inline-flex;align-items:center;gap:4px;background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--text)">
            ${trEscapeHtml(t)}
            <button onclick="classifyDeleteType('${t.replace(/'/g,"\\'")}') " style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0;line-height:1" title="删除此分类">×</button>
          </span>
        `).join('')}
        <button onclick="classifyAddType()" style="background:none;border:1px dashed var(--border);color:var(--muted);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer">＋ 添加</button>
      </div>
    </div>
  `;
  const cards = s.summary.map(item => {
    const color = BLOGGER_TYPE_COLORS[item.type] || '#6b7280';
    const barW = Math.max(4, item.pct);
    return `
      <div onclick="classifyLoadDetail('${item.type.replace(/'/g,"\\'")}')"
        style="background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s"
        onmouseover="this.style.borderColor='${color}'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <span style="width:10px;height:10px;border-radius:50%;background:${color};flex:0 0 10px"></span>
          <span style="font-size:14px;font-weight:700;color:var(--text)">${item.type}</span>
          <span style="margin-left:auto;font-size:20px;font-weight:800;color:${color}">${item.count}</span>
        </div>
        <div style="height:4px;background:var(--surf2);border-radius:3px;margin-bottom:10px;overflow:hidden">
          <div style="height:100%;width:${barW}%;background:${color};border-radius:3px"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${item.pct}% · 点击查看详情</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          ${item.samples.map(n => `<span style="font-size:11px;background:var(--surf2);border-radius:4px;padding:2px 7px;color:var(--muted)">${n}</span>`).join('')}
        </div>
      </div>`;
  }).join('');

  return `<div style="max-width:1000px">
    ${toolbar}
    ${typeTagsHtml}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">
      ${cards}
    </div>
  </div>`;
}

const TABS = {
  overview:   renderOverview,
  team:       renderTeam,
  bloggers:   renderBloggers,
  revisit:    renderRevisit,
  trend:      renderTrend,
  guide:      renderGuide,
  periodic:   renderPeriodic,
  rank:       renderRank,
  ocr:        renderOcr,
  checkin:    renderCheckin,
  attendance: renderAttendance,
  perf:       renderPerf,
  training:   renderTraining,
  classify:   renderClassify,
};
let rendered = new Set();

function switchTab(tab, btn) {
  Object.keys(TABS).forEach(t => document.getElementById("pane-"+t).style.display = t===tab?"":"none");
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  if (!rendered.has(tab)) { TABS[tab](); rendered.add(tab); }
  if (tab === 'guide') { loadAISummary(); loadKbList(); }
}

// 加载博主适配度得分缓存（供绩效计算用）
async function loadCompatScores() {
  try {
    const ym = new Date().toISOString().slice(0, 7);
    const resp = await fetch(
      `${SUPABASE_URL}/rest/v1/compat_scores?score_date=gte.${ym}-01&select=*`,
      { headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON } }
    );
    if (resp.ok) {
      window.compatScoreCache = await resp.json();
    } else {
      window.compatScoreCache = [];
    }
  } catch(e) {
    window.compatScoreCache = [];
  }
}

async function init() {
  checkAdmin();
  if (isAdmin) {
    const btn = document.getElementById('admin-btn');
    if (btn) { btn.textContent = '🔓 管理员模式'; btn.style.color = 'var(--green)'; }
  }
  const now = new Date();
  document.getElementById("dateBadge").textContent =
    `${now.getMonth()+1}月${now.getDate()}日 ${now.getHours().toString().padStart(2,"0")}:${now.getMinutes().toString().padStart(2,"0")}`;
  await loadData();
  await loadMemberStatus(); // 从数据库 merge 最新成员列表（包括新加入的成员）
  await loadCheckinData();
  await loadChatScripts();
  await loadCompatScores();
  // cleanupOldCheckinImages(); // 已禁用，图片存在Storage无需清理
  renderOverview();
  rendered.add("overview");

  // 周五及以后自动检查本周绩效报告是否需要生成；需要则在后台按分步流程生成
  // （进度条仅在用户停留在"周报"视图时可见；生成过程不阻塞页面其他渲染）
  fetch(`${window.location.origin}/api/perf-report/auto-check`)
    .then(r => r.json())
    .then(d => {
      if (d && d.needGenerate && d.monday) {
        perfReportGenerate(d.monday, false);
      }
    })
    .catch(() => {});
}

init();
